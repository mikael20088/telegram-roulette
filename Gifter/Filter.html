  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: transparent;
      font-family: 'Inter', Arial, sans-serif;
      color: #fff;
      padding: 16px 0;
      overflow-y: auto;
      height: 100%;
    }

    .filter-list {
      list-style: none;
    }

    .filter-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #3a3a3a;
      cursor: pointer;
      transition: background 0.2s;
    }

    .filter-item:hover {
      background-color: #3a3a3a;
    }

    .item-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .item-emoji {
      font-size: 20px;
      width: 30px;
      text-align: center;
    }

    .item-name {
      font-size: 16px;
      font-weight: 500;
    }

    .icon-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #007aff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      font-weight: 500;
      flex-shrink: 0;
    }
  </style>
</head>

      { emoji: '🍬', name: 'Candy Cane' },
      { emoji: '🐍📦', name: 'Snake Box' }
    ];

    // Ключ для localStorage
    const STORAGE_KEY = 'favoriteGifts';

    // Загрузка избранных из localStorage
    function loadFavorites() {
      const stored = localStorage.getItem(STORAGE_KEY);
      return stored ? JSON.parse(stored) : [];
    }

    // Сохранение избранных
    function saveFavorites(favorites) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(favorites));
    }

    // Рендер списка
    function renderList() {
      const favorites = loadFavorites();
      // Сортируем: сначала выбранные (по порядку, как они сохранились), потом остальные (по исходному порядку)
      const selectedItems = allGifts.filter(g => favorites.includes(g.name));
      const unselectedItems = allGifts.filter(g => !favorites.includes(g.name));

      const sortedGifts = [...selectedItems, ...unselectedItems];

      const listEl = document.getElementById('filterList');
      listEl.innerHTML = sortedGifts.map(gift => {
        const isSelected = favorites.includes(gift.name);
        const icon = isSelected ? '✓' : '−';
        return `
          <div class="filter-item" data-name="${gift.name}">
            <div class="item-info">
              <span class="item-emoji">${gift.emoji}</span>
              <span class="item-name">${gift.name}</span>
            </div>
            <div class="icon-circle">${icon}</div>
          </div>
        `;
      }).join('');
    }

    // Обработчик клика
    document.getElementById('filterList').addEventListener('click', (e) => {
      const item = e.target.closest('.filter-item');
      if (!item) return;
      const giftName = item.dataset.name;
      let favorites = loadFavorites();
      const index = favorites.indexOf(giftName);
      if (index === -1) {
        // Добавляем
        favorites.unshift(giftName); // добавляем в начало
      } else {
        // Удаляем
        favorites.splice(index, 1);
      }
      saveFavorites(favorites);
      renderList(); // перерисовываем (выбранный уйдёт вверх)
    });

    // Начальный рендер
    renderList();
  </script>
