  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Выбор избранных</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: transparent;
      font-family: 'Inter', Arial, sans-serif;
      color: #fff;
      padding: 0;
      overflow-y: auto;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    /* Заголовок с кнопкой */
    .filter-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-bottom: 1px solid #3a3a3a;
      background-color: #1a1a1a;
      cursor: pointer; /* добавляем указатель, чтобы показать кликабельность */
    }

    .filter-title {
      font-size: 18px;
      font-weight: 600;
      color: #fff;
    }

    .save-button {
      background: transparent;
      border: 1.5px solid #007aff;
      border-radius: 20px;
      padding: 6px 20px;
      font-size: 14px;
      font-weight: 600;
      color: #007aff;
      cursor: pointer;
      transition: all 0.2s ease;
      pointer-events: auto; /* кнопка перехватывает клики */
    }

    .save-button:enabled {
      opacity: 1;
      border-color: #007aff;
      color: #007aff;
    }

    .save-button:enabled:hover {
      background-color: rgba(0, 122, 255, 0.1);
    }

    .save-button:disabled {
      opacity: 0.4;
      border-color: #aaa;
      color: #aaa;
      cursor: default;
      pointer-events: none; /* отключаем клики по неактивной кнопке */
    }

    .filter-list {
      list-style: none;
      flex: 1;
      overflow-y: auto;
    }

    .filter-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-bottom: 1px solid #3a3a3a;
      cursor: pointer;
      transition: background 0.2s;
    }

    .filter-item:hover {
      background-color: #3a3a3a;
    }

    .item-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .item-emoji {
      font-size: 20px;
      width: 30px;
      text-align: center;
    }

    .item-name {
      font-size: 16px;
      font-weight: 500;
    }

    .icon-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #007aff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 20px;
      font-weight: 500;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

    <button class="save-button" id="saveButton" disabled>Сохранить</button>

  <div class="filter-list" id="filterList"></div>

      { emoji: '🧦', name: 'Xmas Stocking' },
      { emoji: '🍬', name: 'Candy Cane' },
      { emoji: '🐍📦', name: 'Snake Box' }
    ];

    const STORAGE_KEY = 'favoriteGifts';
    let currentFavorites = [];
    let savedFavorites = [];

    function loadFavorites() {
      const stored = localStorage.getItem(STORAGE_KEY);
      return stored ? JSON.parse(stored) : [];
    }

    function saveFavorites(favorites) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(favorites));
    }

    function isFavoritesChanged() {
      if (currentFavorites.length === 0 && savedFavorites.length === 0) return false;
      const sortedCurrent = [...currentFavorites].sort();
      const sortedSaved = [...savedFavorites].sort();
      return JSON.stringify(sortedCurrent) !== JSON.stringify(sortedSaved);
    }

    function updateSaveButton() {
      const saveBtn = document.getElementById('saveButton');
      const hasSelection = currentFavorites.length > 0;
      const changed = isFavoritesChanged();
      saveBtn.disabled = !(hasSelection && changed);
    }

    function renderList() {
      const selectedItems = allGifts.filter(g => currentFavorites.includes(g.name));
      selectedItems.sort((a, b) => currentFavorites.indexOf(a.name) - currentFavorites.indexOf(b.name));
      const unselectedItems = allGifts.filter(g => !currentFavorites.includes(g.name));
      const sortedGifts = [...selectedItems, ...unselectedItems];

      const listEl = document.getElementById('filterList');
      listEl.innerHTML = sortedGifts.map(gift => {
        const isSelected = currentFavorites.includes(gift.name);
        const icon = isSelected ? '✓' : '−';
        return `
          <div class="filter-item" data-name="${gift.name}">
            <div class="item-info">
              <span class="item-emoji">${gift.emoji}</span>
              <span class="item-name">${gift.name}</span>
            </div>
            <div class="icon-circle">${icon}</div>
          </div>
        `;
      }).join('');
      updateSaveButton();
    }

    // Клик по элементу списка
    document.getElementById('filterList').addEventListener('click', (e) => {
      const item = e.target.closest('.filter-item');
      if (!item) return;
      const giftName = item.dataset.name;
      const index = currentFavorites.indexOf(giftName);
      if (index === -1) {
        currentFavorites.unshift(giftName);
      } else {
        currentFavorites.splice(index, 1);
      }
      renderList();
    });

    // Клик по заголовку (кроме кнопки) — закрываем панель
    document.getElementById('filterHeader').addEventListener('click', (e) => {
      // Если клик по кнопке — не обрабатываем здесь, она обрабатывается отдельно
      if (e.target.classList.contains('save-button')) return;
      // Отправляем родителю сообщение о закрытии
      window.parent.postMessage({ type: 'CLOSE_FILTER_PANEL' }, '*');
    });

    // Клик по кнопке "Сохранить"
    document.getElementById('saveButton').addEventListener('click', () => {
      // Сохраняем только если кнопка активна (disabled=false)
      if (!document.getElementById('saveButton').disabled) {
        saveFavorites(currentFavorites);
        savedFavorites = [...currentFavorites];
        updateSaveButton();
        // После сохранения закрываем панель
        window.parent.postMessage({ type: 'CLOSE_FILTER_PANEL' }, '*');
      }
    });

    // Инициализация
    (function init() {
      currentFavorites = loadFavorites();
      savedFavorites = [...currentFavorites];
      renderList();
    })();
  </script>
