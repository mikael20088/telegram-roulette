  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: transparent;
      font-family: 'Inter', Arial, sans-serif;
      color: #fff;
      padding: 0;
      overflow-y: auto;
      height: 100%;
    }

    .categories {
      height: 100%;
      overflow-y: auto;
    }

    .category-item {
      background-color: #2a2a2a;
      border-bottom: 1px solid #3a3a3a;
      padding: 16px 16px;
      display: flex;
      gap: 16px;
      position: relative;
    }

    .category-item:last-child {
      border-bottom: none;
    }

    .category-emoji {
      width: 30px;
      font-size: 20px;
      text-align: center;
      flex-shrink: 0;
    }

    .category-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .category-name {
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      line-height: 1.2;
    }

    .category-stats {
      font-size: 13px;
      color: #aaa;
      font-weight: 400;
      line-height: 1.2;
    }

    /* Блоки цены и процента (для каждого подарка) */
    .gift-price,
    .gift-percent {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      white-space: nowrap;
      z-index: 1;
    }

    .gift-price {
      --price-right: 100px;   /* такое же значение, как на главной */
      right: var(--price-right);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 500;
      color: #fff;
    }

    .gift-percent {
      --percent-right: 17px;   /* такое же значение, как на главной */
      right: var(--percent-right);
      color: #4caf50;
      font-weight: 600;
      font-size: 14px;
    }

    .coin-icon {
      font-size: 16px;
      margin-right: 2px;
    }

    .empty-message {
      text-align: center;
      color: #aaa;
      font-size: 16px;
      margin-top: 40px;
    }
  </style>
</head>

    // Загрузка списка избранных из localStorage
    function loadFavorites() {
      const stored = localStorage.getItem(STORAGE_KEY);
      return stored ? JSON.parse(stored) : [];
    }

    // Рендер избранных подарков
    function renderFavorites() {
      const favorites = loadFavorites();
      const container = document.getElementById('favoritesContainer');

      if (favorites.length === 0) {
        container.innerHTML = '<div class="empty-message">Нет избранных подарков</div>';
        return;
      }

      // Фильтруем полный массив, оставляем только выбранные
      const selectedGifts = allGiftsFull.filter(gift => favorites.includes(gift.name));

      let html = '';
      selectedGifts.forEach(gift => {
        html += `
          <div class="category-item">
            <div class="category-emoji">${gift.emoji}</div>
            <div class="category-info">
              <div class="category-name">${gift.name}</div>
              <div class="category-stats">${gift.stats}</div>
            </div>
            <div class="gift-price">
              <span class="coin-icon">💎</span>
              <span class="price">${gift.price}</span>
            </div>
            <div class="gift-percent">${gift.percent}</div>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    // Первоначальный рендер
    renderFavorites();

    // Слушаем изменения localStorage (если фильтр меняет данные)
    window.addEventListener('storage', (e) => {
      if (e.key === STORAGE_KEY) {
        renderFavorites();
      }
    });
