<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Сравнение графиков</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #1a1a1a; font-family: 'Inter', sans-serif; color: #fff; height: 100%; overflow-y: auto; padding: 16px; scrollbar-width: thin; scrollbar-color: #4a4a4a #2a2a2a; }
    body::-webkit-scrollbar { width: 5px; }
    body::-webkit-scrollbar-track { background: #2a2a2a; }
    body::-webkit-scrollbar-thumb { background: #4a4a4a; border-radius: 3px; }
    .header { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; cursor: pointer; }
    .back-arrow { font-size: 24px; color: #007aff; }
    .back-text { font-size: 18px; font-weight: 500; color: #007aff; }
    .add-button { background-color: #007aff; color: white; border: none; border-radius: 30px; padding: 12px 24px; font-size: 18px; font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 8px; margin: 16px 0 8px; cursor: pointer; transition: background 0.2s; box-shadow: 0 2px 8px rgba(0,122,255,0.3); }
    .add-button:hover { background-color: #005bbf; }
    .hint-text { font-size: 14px; color: #aaa; margin-bottom: 20px; }
    .gift-list-container { display: none; background-color: #1e1e1e; border-radius: 16px; padding: 8px 0; margin: 16px 0; max-height: 400px; overflow-y: auto; border: 1px solid #333; }
    .gift-list-container.visible { display: block; }
    .category-item { background-color: #2a2a2a; border-bottom: 1px solid #3a3a3a; padding: 16px; display: flex; gap: 16px; position: relative; cursor: pointer; transition: background 0.15s; }
    .category-item:last-child { border-bottom: none; }
    .category-item:hover { background-color: #3a3a3a; }
    .category-item.selected { background-color: #1e3a5f; border-left: 4px solid #007aff; }
    .category-emoji { width: 30px; font-size: 20px; text-align: center; }
    .category-info { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .category-name { font-size: 16px; font-weight: 500; color: #fff; }
    .category-stats { font-size: 13px; color: #aaa; }
    .gift-price, .gift-percent { position: absolute; top: 50%; transform: translateY(-50%); white-space: nowrap; }
    .gift-price { right: 100px; display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 500; }
    .gift-percent { right: 17px; font-weight: 600; font-size: 14px; }
    .gift-percent.positive { color: #4caf50; }
    .gift-percent.negative { color: #ff5252; }
    .coin-icon { font-size: 16px; margin-right: 2px; }
    .selected-chips { display: flex; flex-wrap: wrap; gap: 12px; margin: 24px 0 16px; min-height: 50px; }
    .chip { display: flex; align-items: center; gap: 8px; background-color: #2a2a2a; border-radius: 30px; padding: 8px 16px 8px 12px; font-size: 14px; font-weight: 500; border: 1px solid #444; cursor: pointer; transition: background 0.2s; }
    .chip:hover { background-color: #3a3a3a; }
    .color-dot { width: 12px; height: 12px; border-radius: 3px; }
    .color-blue { background-color: #007AFF; }
    .color-orange { background-color: #FF9F0A; }
    .color-purple { background-color: #BF5AF2; }
    .save-button { background-color: #007aff; color: white; border: none; border-radius: 30px; padding: 14px 32px; font-size: 18px; font-weight: 600; width: 100%; cursor: pointer; transition: background 0.2s, opacity 0.2s; margin-top: 20px; }
    .save-button:disabled { opacity: 0.4; pointer-events: none; }
    .empty-message { text-align: center; color: #aaa; font-size: 16px; margin-top: 40px; }
  </style>
</head>
<body>
  <div class="header" id="backButton">
    <span class="back-arrow">←</span>
    <span class="back-text">Назад</span>
  </div>
  <button class="add-button" id="addGiftBtn">+ Добавить подарок</button>
  <div class="hint-text">выберите хотя бы один подарок</div>
  <div class="gift-list-container" id="giftListContainer">
    <div id="giftList" class="categories"></div>
  </div>
  <div class="selected-chips" id="selectedChips"></div>
  <button class="save-button" id="saveBtn" disabled>Сохранить</button>

  <script>
    (function() {
      const STORAGE_KEY = 'giftData';
      const fallbackGifts = [ /* ... ваш огромный массив с ценами и процентами ... */ ];

      function loadGiftData() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) { try { return JSON.parse(stored); } catch(e) {} }
        return fallbackGifts;
      }

      const backBtn = document.getElementById('backButton');
      const addBtn = document.getElementById('addGiftBtn');
      const listContainer = document.getElementById('giftListContainer');
      const giftListEl = document.getElementById('giftList');
      const selectedChips = document.getElementById('selectedChips');
      const saveBtn = document.getElementById('saveBtn');

      let allGifts = loadGiftData();
      let selected = [];

      const chipColors = ['#007AFF', '#FF9F0A', '#BF5AF2'];

      function renderGiftList() {
        let html = '';
        allGifts.forEach(gift => {
          let percentClass = 'neutral';
          if (gift.percent.startsWith('+')) percentClass = 'positive';
          else if (gift.percent.startsWith('-')) percentClass = 'negative';

          const isSelected = selected.some(s => s.name === gift.name);
          const selectedClass = isSelected ? 'selected' : '';

          html += `
            <div class="category-item ${selectedClass}" data-name="${gift.name}" data-emoji="${gift.emoji}" data-stats="${gift.stats}" data-price="${gift.price}" data-percent="${gift.percent}">
              <div class="category-emoji">${gift.emoji}</div>
              <div class="category-info">
                <div class="category-name">${gift.name}</div>
                <div class="category-stats">${gift.stats}</div>
              </div>
              <div class="gift-price"><span class="coin-icon">💎</span>${gift.price}</div>
              <div class="gift-percent ${percentClass}">${gift.percent}</div>
            </div>
          `;
        });
        giftListEl.innerHTML = html;

        document.querySelectorAll('.category-item').forEach(item => {
          item.addEventListener('click', () => {
            const name = item.dataset.name;
            const gift = allGifts.find(g => g.name === name);
            if (!gift) return;

            const index = selected.findIndex(s => s.name === name);
            if (index !== -1) {
              selected.splice(index, 1);
            } else {
              if (selected.length < 3) {
                selected.push(gift);
              } else {
                alert('Можно выбрать не более трёх подарков');
                return;
              }
            }
            updateSelection();
          });
        });
      }

      function updateSelection() {
        renderGiftList();

        let chipsHtml = '';
        selected.forEach((gift, idx) => {
          chipsHtml += `
            <div class="chip" data-name="${gift.name}">
              <span class="color-dot color-${idx === 0 ? 'blue' : idx === 1 ? 'orange' : 'purple'}"></span>
              <span>${gift.name}</span>
            </div>
          `;
        });
        selectedChips.innerHTML = chipsHtml;

        document.querySelectorAll('.chip').forEach(chip => {
          chip.addEventListener('click', (e) => {
            e.stopPropagation();
            const name = chip.dataset.name;
            selected = selected.filter(s => s.name !== name);
            updateSelection();
          });
        });

        saveBtn.disabled = selected.length === 0;
      }

      backBtn.addEventListener('click', () => {
        window.parent.postMessage({ type: 'CLOSE_COMPARISON' }, '*');
      });

      addBtn.addEventListener('click', () => {
        listContainer.classList.toggle('visible');
        if (listContainer.classList.contains('visible')) {
          renderGiftList();
        }
      });

      saveBtn.addEventListener('click', () => {
        if (selected.length === 0) return;
        window.parent.postMessage({ type: 'OPEN_COMPARISON_GRAPH', gifts: selected }, '*');
      });

      renderGiftList();

      window.addEventListener('storage', (e) => {
        if (e.key === STORAGE_KEY) {
          allGifts = loadGiftData();
          renderGiftList();
        }
      });
    })();
  </script>
</body>
</html>
