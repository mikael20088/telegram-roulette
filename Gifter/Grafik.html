<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>График</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Inter', Arial, sans-serif;
      background: radial-gradient(circle at top left, #0c4f17, #000);
      color: white;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Верхняя панель с кнопкой назад и Overview/Models */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 40px;
    }

    .back-button {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 18px;
      font-weight: 500;
      color: #fff;
      cursor: pointer;
      background: none;
      border: none;
      padding: 8px 0;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .back-button:hover {
      opacity: 1;
    }

    .back-button span {
      font-size: 24px;
    }

    .right-actions {
      display: flex;
      gap: 20px;
    }

    .action-btn {
      background: none;
      border: none;
      color: #aaa;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: color 0.2s;
    }

    .action-btn.active {
      color: #39ff14;
    }

    /* Заголовок и изображение */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 30px;
    }

    .title-section {
      flex: 1;
    }

    .title {
      font-size: 60px;
      font-weight: 700;
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .price {
      font-size: 70px;
      font-weight: 800;
      margin-bottom: 15px;
    }

    .stats {
      font-size: 22px;
      color: #aaa;
    }

    .stats span {
      color: #ff4d4d;
      margin-left: 10px;
    }

    .coin-img {
      width: 160px;
      height: 160px;
      border-radius: 25px;
      object-fit: cover;
      background: #2a2a2a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 60px;
      box-shadow: 0 0 30px rgba(0,255,0,0.3);
    }

    /* Для режима сравнения - другой блок */
    .comparison-info {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 30px;
    }

    .comparison-gift-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background-color: rgba(0,0,0,0.5);
      border-radius: 12px;
      padding: 8px 12px;
      backdrop-filter: blur(5px);
    }

    .color-dot {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }
    .color-blue { background-color: #007AFF; }
    .color-orange { background-color: #FF9F0A; }
    .color-purple { background-color: #BF5AF2; }

    .gift-mini-emoji { font-size: 24px; }
    .gift-mini-name { flex: 1; font-size: 16px; font-weight: 500; color: #fff; }
    .gift-mini-price { font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 4px; }

    /* Панели управления (валюта, тип графика, таймфреймы) */
    .control-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 30px 0 20px;
      background: rgba(0,0,0,0.5);
      border-radius: 40px;
      padding: 4px;
      backdrop-filter: blur(5px);
    }

    .currency-selector, .chart-type-selector {
      display: flex;
      gap: 4px;
    }

    .currency-btn, .chart-type-btn {
      background: transparent;
      border: none;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      color: #aaa;
      cursor: pointer;
      transition: all 0.2s;
    }

    .currency-btn.active, .chart-type-btn.active {
      background-color: #39ff14;
      color: #000;
    }

    .chart-type-btn {
      padding: 8px 12px;
      font-size: 18px;
    }

    .timeframe-bar {
      display: flex;
      gap: 8px;
      background: rgba(0,0,0,0.5);
      border-radius: 30px;
      padding: 4px;
      margin: 20px 0;
      backdrop-filter: blur(5px);
    }

    .timeframe-btn {
      background: transparent;
      border: none;
      padding: 8px 16px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 500;
      color: #aaa;
      cursor: pointer;
      flex: 1;
      text-align: center;
      transition: all 0.2s;
    }

    .timeframe-btn.active {
      background-color: #39ff14;
      color: #000;
    }

    /* Контейнер для графика */
    .chart-container {
      margin-top: 20px;
      background: transparent;
      padding: 0;
      height: 260px;
      position: relative;
    }

    /* Убираем оси и сетку через настройки Chart.js, но добавим свой блок с датами */
    .dates {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      color: #76ff7a;
      font-size: 14px;
    }

    .footer {
      margin-top: 20px;
      display: flex;
      justify-content: space-between;
      color: #777;
      font-size: 14px;
      border-top: 1px solid rgba(255,255,255,0.1);
      padding-top: 15px;
    }

    .error-message {
      text-align: center;
      color: #ff5252;
      margin-top: 40px;
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Верхняя панель -->
    <div class="top-bar">
      <div class="back-button" id="backBtn">
        <span>←</span> Назад
      </div>
      <div class="right-actions">
        <button class="action-btn active" id="overviewBtn">Overview</button>
        <button class="action-btn" id="modelsBtn">Models</button>
      </div>
    </div>

    <!-- Контейнер для информации (заполняется динамически) -->
    <div id="giftInfoContainer"></div>

    <!-- Панели управления -->
    <div class="control-panel">
      <div class="currency-selector">
        <button class="currency-btn active" data-currency="TON">💎TON</button>
        <button class="currency-btn" data-currency="USDT">$USDT</button>
        <button class="currency-btn" data-currency="RUB">₽RUB</button>
      </div>
      <div class="chart-type-selector">
        <button class="chart-type-btn active" data-chart="line">📈</button>
        <button class="chart-type-btn" data-chart="candle">📊</button>
      </div>
    </div>

    <!-- График -->
    <div class="chart-container">
      <canvas id="priceChart"></canvas>
    </div>

    <!-- Даты (будут обновляться динамически) -->
    <div class="dates" id="datesContainer">
      <span>01.02</span>
      <span>07.02</span>
      <span>14.02</span>
      <span>21.02</span>
      <span>28.02</span>
    </div>

    <!-- Нижний блок с информацией -->
    <div class="footer" id="footerContainer">
      <span>UTC time zone</span>
      <span>Floor price</span>
      <span id="footerTag">@PlushPepe</span>
    </div>

    <!-- Таймфреймы -->
    <div class="timeframe-bar">
      <button class="timeframe-btn active" data-timeframe="all">Все</button>
      <button class="timeframe-btn" data-timeframe="1y">1 год</button>
      <button class="timeframe-btn" data-timeframe="6m">6 мес</button>
      <button class="timeframe-btn" data-timeframe="3m">3 мес</button>
      <button class="timeframe-btn" data-timeframe="1m">1 мес</button>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const indexParam = urlParams.get('index');
    const giftName = urlParams.get('name');
    const giftEmoji = urlParams.get('emoji');
    const giftStats = urlParams.get('stats');
    const giftPrice = urlParams.get('price');
    const giftPercent = urlParams.get('percent');

    const comparisonData = sessionStorage.getItem('comparisonGifts');
    let comparisonGifts = null;
    if (comparisonData) {
      try { comparisonGifts = JSON.parse(comparisonData); } catch (e) {}
    }

    const isComparisonMode = comparisonGifts && Array.isArray(comparisonGifts) && comparisonGifts.length > 0;

    const giftInfoContainer = document.getElementById('giftInfoContainer');
    const backBtn = document.getElementById('backBtn');
    const currencyBtns = document.querySelectorAll('.currency-btn');
    const chartTypeBtns = document.querySelectorAll('.chart-type-btn');
    const timeframeBtns = document.querySelectorAll('.timeframe-btn');
    const ctx = document.getElementById('priceChart').getContext('2d');
    const datesContainer = document.getElementById('datesContainer');
    const footerTag = document.getElementById('footerTag');

    // Функция генерации данных (имитация)
    function generateChartData(points = 50, basePrice = 7000) {
      const data = [];
      let price = basePrice;
      for (let i = 0; i < points; i++) {
        const change = (Math.random() * 4 - 2) / 100; // -2% до +2%
        price = price * (1 + change);
        data.push(price);
      }
      return data;
    }

    function parsePrice(priceStr) {
      if (!priceStr) return 7000;
      return parseFloat(priceStr.replace(/,/g, '')) || 7000;
    }

    // Функция форматирования дат для подписей (можно адаптировать под выбранный таймфрейм)
    function updateDates(timeframe) {
      const now = new Date();
      const dates = [];
      if (timeframe === 'all' || timeframe === '1y') {
        // показываем месяцы
        for (let i = 0; i < 5; i++) {
          const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
          dates.unshift(d.toLocaleDateString('ru', { day: '2-digit', month: '2-digit' }));
        }
      } else if (timeframe === '6m') {
        for (let i = 0; i < 5; i++) {
          const d = new Date(now.getFullYear(), now.getMonth() - i*1.5, 1);
          dates.unshift(d.toLocaleDateString('ru', { day: '2-digit', month: '2-digit' }));
        }
      } else {
        // для коротких интервалов показываем дни
        for (let i = 0; i < 5; i++) {
          const d = new Date(now.getTime() - i*7*24*60*60*1000);
          dates.unshift(d.toLocaleDateString('ru', { day: '2-digit', month: '2-digit' }));
        }
      }
      datesContainer.innerHTML = dates.map(d => `<span>${d}</span>`).join('');
    }

    // Инициализация дат
    updateDates('all');

    let chart;

    // Функция для обновления нижнего тега
    function updateFooterTag() {
      if (indexParam) {
        footerTag.textContent = '@' + indexParam;
      } else if (isComparisonMode) {
        footerTag.textContent = '@Comparison';
      } else if (giftName) {
        footerTag.textContent = '@' + giftName.replace(/\s/g, '');
      } else {
        footerTag.textContent = '@Gift';
      }
    }

    // Отрисовка информации в зависимости от режима
    if (indexParam) {
      // Режим индекса
      const indexData = {
        marketcap: { name: 'Market Cap', emoji: '💎', unit: 'TON' },
        tradingvolume: { name: 'Trading Volume', emoji: '💎', unit: 'TON' },
        totalsupply: { name: 'Total Supply', emoji: '🎁', unit: 'шт' },
        fdv: { name: 'FDV', emoji: '💎', unit: 'TON' },
        holders: { name: 'Уникальные холдеры', emoji: '👤', unit: 'чел' },
        top10: { name: 'TOP 10 NFT World', emoji: '🏆', unit: '' }
      };
      const info = indexData[indexParam] || { name: 'Индекс', emoji: '📊', unit: '' };
      giftInfoContainer.innerHTML = `
        <div class="header">
          <div class="title-section">
            <div class="title">${info.name}</div>
            <div class="price">—</div>
            <div class="stats">— <span>—</span></div>
          </div>
          <div class="coin-img">${info.emoji}</div>
        </div>
      `;
      const basePrice = 10000;
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: Array.from({ length: 50 }, (_, i) => i + 1),
          datasets: [{
            label: info.name,
            data: generateChartData(50, basePrice),
            borderColor: '#39ff14',
            backgroundColor: 'transparent',
            borderWidth: 4,
            pointRadius: 0,
            tension: 0.2,
            fill: false
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { enabled: true, backgroundColor: '#000', titleColor: '#fff', bodyColor: '#39ff14' }
          },
          scales: {
            x: { display: false },
            y: { display: false } // полностью убираем оси
          },
          elements: { line: { borderWidth: 4 } }
        }
      });
    } else if (isComparisonMode) {
      // Режим сравнения
      let html = '<div class="comparison-info">';
      const colors = ['color-blue', 'color-orange', 'color-purple'];
      comparisonGifts.forEach((gift, index) => {
        const price = gift.price || '0.00';
        const percent = gift.percent || '0%';
        let percentClass = 'neutral';
        if (percent.startsWith('+')) percentClass = 'positive';
        else if (percent.startsWith('-')) percentClass = 'negative';
        html += `
          <div class="comparison-gift-row">
            <span class="color-dot ${colors[index % colors.length]}"></span>
            <span class="gift-mini-emoji">${gift.emoji || '🎁'}</span>
            <span class="gift-mini-name">${gift.name}</span>
            <span class="gift-mini-price"><span class="coin-icon">💎</span>${price}</span>
            <span class="gift-percent ${percentClass}" style="color: ${percentClass === 'positive' ? '#4caf50' : (percentClass === 'negative' ? '#ff5252' : '#fff')}">${percent}</span>
          </div>
        `;
      });
      html += '</div>';
      giftInfoContainer.innerHTML = html;

      const datasets = [];
      const colors2 = ['#39ff14', '#FF9F0A', '#BF5AF2']; // ярко-зелёный для первой линии
      comparisonGifts.forEach((gift, index) => {
        const basePrice = parsePrice(gift.price);
        datasets.push({
          label: gift.name,
          data: generateChartData(50, basePrice),
          borderColor: colors2[index % colors2.length],
          backgroundColor: 'transparent',
          borderWidth: 4,
          pointRadius: 0,
          tension: 0.2,
          fill: false
        });
      });
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: Array.from({ length: 50 }, (_, i) => i + 1),
          datasets: datasets
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: true, labels: { color: '#fff', font: { size: 12 } } },
            tooltip: { enabled: true, backgroundColor: '#000', titleColor: '#fff' }
          },
          scales: { x: { display: false }, y: { display: false } }
        }
      });
    } else {
      // Обычный режим одного подарка
      if (!giftName) {
        giftInfoContainer.innerHTML = `<div class="error-message">Данные не переданы</div>`;
      } else {
        let percentClass = 'neutral';
        if (giftPercent && giftPercent.startsWith('+')) percentClass = 'positive';
        else if (giftPercent && giftPercent.startsWith('-')) percentClass = 'negative';
        const percentValue = giftPercent ? giftPercent.replace('%', '') : '0';
        giftInfoContainer.innerHTML = `
          <div class="header">
            <div class="title-section">
              <div class="title">${giftName}</div>
              <div class="price">$${giftPrice || '0.00'}</div>
              <div class="stats">${giftStats ? giftStats.split('/')[0].trim() : '0тыс.'} <span>${giftPercent || '0%'}</span></div>
            </div>
            <div class="coin-img">${giftEmoji || '🎁'}</div>
          </div>
        `;
      }
      const basePrice = parsePrice(giftPrice);
      chart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: Array.from({ length: 50 }, (_, i) => i + 1),
          datasets: [{
            label: 'Цена',
            data: generateChartData(50, basePrice),
            borderColor: '#39ff14',
            backgroundColor: 'transparent',
            borderWidth: 4,
            pointRadius: 0,
            tension: 0.2,
            fill: false
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: { display: false },
            tooltip: { enabled: true, backgroundColor: '#000', titleColor: '#fff', bodyColor: '#39ff14' }
          },
          scales: { x: { display: false }, y: { display: false } }
        }
      });
    }

    updateFooterTag();

    // Функция обновления данных (каждые 10 мин)
    function updateChartData() {
      if (indexParam) {
        const basePrice = 10000;
        chart.data.datasets[0].data = generateChartData(50, basePrice);
      } else if (isComparisonMode) {
        comparisonGifts.forEach((gift, index) => {
          const basePrice = parsePrice(gift.price);
          chart.data.datasets[index].data = generateChartData(50, basePrice);
        });
      } else {
        const basePrice = parsePrice(giftPrice);
        chart.data.datasets[0].data = generateChartData(50, basePrice);
      }
      chart.update();
    }
    setInterval(updateChartData, 600000);

    // Обработчик кнопки "Назад"
    backBtn.addEventListener('click', () => {
      if (indexParam) {
        window.parent.postMessage({ type: 'CLOSE_GRAPH' }, '*');
      } else if (isComparisonMode) {
        window.parent.postMessage({ type: 'CLOSE_COMPARISON' }, '*');
      } else {
        window.parent.postMessage({ type: 'CLOSE_GRAPH' }, '*');
      }
    });

    // Валюта (заглушка)
    currencyBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        currencyBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        // Здесь можно пересчитывать цену и обновлять график
        // Пока оставим заглушку
      });
    });

    // Тип графика (только линия работает)
    chartTypeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        chartTypeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        if (btn.dataset.chart === 'line') {
          chart.config.type = 'line';
          chart.update();
        } else {
          alert('Свечной график пока не реализован');
          document.querySelector('[data-chart="line"]').classList.add('active');
          btn.classList.remove('active');
        }
      });
    });

    // Таймфреймы
    timeframeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        timeframeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const timeframe = btn.dataset.timeframe;
        updateDates(timeframe);
        const newPoints = 50;
        if (indexParam) {
          const basePrice = 10000;
          chart.data.datasets[0].data = generateChartData(newPoints, basePrice);
        } else if (isComparisonMode) {
          comparisonGifts.forEach((gift, index) => {
            const basePrice = parsePrice(gift.price);
            chart.data.datasets[index].data = generateChartData(newPoints, basePrice);
          });
        } else {
          const basePrice = parsePrice(giftPrice);
          chart.data.datasets[0].data = generateChartData(newPoints, basePrice);
        }
        chart.update();
      });
    });

    // Overview / Models (заглушка)
    document.getElementById('overviewBtn').addEventListener('click', () => {
      document.getElementById('overviewBtn').classList.add('active');
      document.getElementById('modelsBtn').classList.remove('active');
    });
    document.getElementById('modelsBtn').addEventListener('click', () => {
      document.getElementById('modelsBtn').classList.add('active');
      document.getElementById('overviewBtn').classList.remove('active');
    });
  </script>
</body>
</html>
