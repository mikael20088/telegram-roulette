    /* Все стили без изменений (полностью из вашего кода) */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #1a1a1a;
      font-family: 'Inter', Arial, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    body::-webkit-scrollbar {
      display: none;
    }

    .top-nav {
      display: flex;
      gap: 20px;
      padding: 16px 16px 16px 16px;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
      flex-shrink: 0;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      -ms-overflow-style: none;
      transition: opacity 0.2s, height 0.2s, padding 0.2s;
    }

    .top-nav.hidden {
      opacity: 0;
      height: 0;
      padding: 0 16px;
      pointer-events: none;
    }

    .top-nav::-webkit-scrollbar {
      display: none;
    }

    .nav-item {
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      cursor: pointer;
      padding-bottom: 4px;
      transition: color 0.2s, border-bottom 0.2s;
      flex-shrink: 0;
    }

    .nav-item.active {
      color: #4caf50;
      border-bottom: 2px solid #4caf50;
    }

    .green-arrow {
      color: #4caf50;
    }

    .red-arrow {
      color: #ff5252;
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 16px 0 16px;
      flex-shrink: 0;
      transition: opacity 0.2s, height 0.2s, padding 0.2s;
    }

    .search-row.hidden {
      opacity: 0;
      height: 0;
      padding: 0 16px;
      pointer-events: none;
    }

    .search-input {
      flex: 1;
      background-color: #2a2a2a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      padding: 12px 20px;
      font-size: 16px;
      color: #fff;
      outline: none;
      transition: border 0.2s;
      min-width: 0;
    }

    .search-input::placeholder {
      color: #aaa;
    }

    .search-input:focus {
      border-color: rgba(255, 255, 255, 0.3);
    }

    .circle-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #2a2a2a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .circle-btn:hover {
      background-color: #3a3a3a;
    }

    .double-arrow {
      font-size: 20px;
      transform: scale(1.2);
    }

    .content-area {
      flex: 1;
      min-height: 0;
      margin-top: 16px;
      overflow-y: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
      -ms-overflow-style: none;
      position: relative;
    }

    .content-area::-webkit-scrollbar {
      display: none;
    }

    .categories {
      height: 100%;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category-item {
      background-color: #2a2a2a;
      border-bottom: 1px solid #3a3a3a;
      padding: 16px 16px;
      display: flex;
      gap: 16px;
      position: relative;
      align-items: center;
      cursor: pointer;
    }

    .category-item:last-child {
      border-bottom: none;
    }

    .category-emoji {
      width: 30px;
      font-size: 20px;
      text-align: center;
      flex-shrink: 0;
    }

    .category-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .category-name {
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      line-height: 1.2;
    }

    .category-stats {
      font-size: 13px;
      color: #aaa;
      font-weight: 400;
      line-height: 1.2;
    }

    .gift-price,
    .gift-percent {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      white-space: nowrap;
      z-index: 1;
    }

    .gift-price {
      --price-right: 100px;
      right: var(--price-right);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 500;
      color: #fff;
    }

    .gift-percent {
      --percent-right: 17px;
      right: var(--percent-right);
      font-weight: 600;
      font-size: 14px;
    }

    .gift-percent.positive {
      color: #4caf50;
    }

    .gift-percent.negative {
      color: #ff5252;
    }

    .gift-percent.neutral {
      color: #fff;
    }

    .coin-icon {
      font-size: 16px;
      margin-right: 2px;
    }

    .favorite-content,
    .services-content {
      height: 100%;
      display: none;
    }

    .favorite-content iframe,
    .services-content iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }

    .bottom-nav {
      display: flex;
      justify-content: space-between;
      padding: 8px 16px 12px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.5);
      background-color: #1a1a1a;
      flex-shrink: 0;
    }

    .bottom-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: #fff;
      font-weight: 500;
      cursor: pointer;
    }

    .bottom-nav-emoji {
      font-size: 20px;
      line-height: 1;
    }

    .panel {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 80%;
      background-color: #1a1a1a;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
      transform: translateY(100%);
      transition: transform 0.3s ease-in-out;
      z-index: 1000;
      padding: 20px;
    }

    #filterPanel {
      height: 75%;
    }

    .panel.active {
      transform: translateY(0);
    }

    .close-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      font-size: 24px;
      color: #fff;
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background-color: #2a2a2a;
      transition: background 0.2s;
      z-index: 1010;
    }

    .close-panel:hover {
      background-color: #3a3a3a;
    }

    .panel iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }

    .fullscreen-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #1a1a1a;
      z-index: 2000;
      display: none;
      flex-direction: column;
    }

    .fullscreen-overlay.active {
      display: flex;
    }

    .fullscreen-overlay iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }
  </style>
</head>

      { emoji: '🐍📦', name: 'Snake Box', stats: '174.9тыс. / 273.9тыс.' }
    ];

    // Текущие данные (будут заполнены из localStorage или API)
    let allGiftsFull = [];

    // Предыдущие цены для расчёта процента изменения
    let previousPrices = {};

    // Загружаем сохранённые данные из localStorage
    const storedData = localStorage.getItem('giftData');
    if (storedData) {
      try {
        allGiftsFull = JSON.parse(storedData);
      } catch (e) {
        console.warn('Ошибка парсинга giftData, начинаем с пустого массива');
      }
    }

    const savedPrices = localStorage.getItem('previousPrices');
    if (savedPrices) {
      try {
        previousPrices = JSON.parse(savedPrices);
      } catch (e) {
        console.warn('Ошибка парсинга previousPrices');
      }
    }

    // Функция для преобразования нанотон в число с двумя знаками и форматированием
    function nanotonToTon(nanoton) {
      const tons = (parseInt(nanoton) / 1e9).toFixed(2);
      return Number(tons).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // Функция для расчёта процента изменения
    function calculatePercent(currentPrice, previousPrice) {
      if (!previousPrice || previousPrice === '0') return '0%';
      const current = parseFloat(currentPrice.replace(/,/g, ''));
      const previous = parseFloat(previousPrice.replace(/,/g, ''));
      if (previous === 0) return '0%';
      const change = ((current - previous) / previous) * 100;
      return (change >= 0 ? '+' : '') + change.toFixed(2) + '%';
    }

    // Загрузка данных из API
    async function fetchGiftData() {
      console.log('⏳ Запрашиваем данные из API...');
      try {
        const response = await fetch('https://proxy.thermos.gifts/api/v1/collections');
        if (!response.ok) throw new Error(`HTTP error ${response.status}`);
        const collections = await response.json();
        console.log('✅ Данные от API получены');

        const updatedGifts = baseGifts.map(base => {
          const found = collections.find(c => c.name === base.name);
          if (found) {
            const priceTon = nanotonToTon(found.stats.floor);
            const oldPrice = previousPrices[base.name]; // может быть undefined

            let percent;
            if (oldPrice === undefined) {
              // Первый раз – процент 0%, запоминаем цену
              percent = '0%';
              previousPrices[base.name] = priceTon;
            } else {
              if (priceTon !== oldPrice) {
                // Цена изменилась – вычисляем процент и обновляем previousPrice
                percent = calculatePercent(priceTon, oldPrice);
                previousPrices[base.name] = priceTon;
              } else {
                // Цена не изменилась – берём процент из существующих данных (если есть)
                const existing = allGiftsFull.find(g => g.name === base.name);
                percent = existing ? existing.percent : '0%';
                // previousPrices не трогаем – оставляем старую цену для будущих сравнений
              }
            }

            return {
              ...base,
              price: priceTon,
              percent: percent
            };
          } else {
            console.warn(`⚠️ Коллекция "${base.name}" не найдена в API, оставляем последние сохранённые данные`);
            const existing = allGiftsFull.find(g => g.name === base.name);
            if (existing) return existing;
            return { ...base, price: '0.00', percent: '0%' };
          }
        });

        allGiftsFull = updatedGifts;
        localStorage.setItem('giftData', JSON.stringify(allGiftsFull));
        localStorage.setItem('previousPrices', JSON.stringify(previousPrices));
        console.log('🔄 Данные сохранены в localStorage');

        // Перерисовываем текущую вкладку
        if (!favoriteContent.style.display || favoriteContent.style.display === 'none' && servicesContent.style.display === 'none') {
          if (allGiftsBtn.classList.contains('active')) {
            renderGifts(allGiftsFull);
          } else if (growthBtn.classList.contains('active')) {
            const sorted = [...allGiftsFull].sort((a, b) => parsePercent(b.percent) - parsePercent(a.percent));
            renderGifts(sorted);
          } else if (fallBtn.classList.contains('active')) {
            const sorted = [...allGiftsFull].sort((a, b) => parsePercent(a.percent) - parsePercent(b.percent));
            renderGifts(sorted);
          }
        }
      } catch (error) {
        console.error('❌ Ошибка загрузки данных:', error);
      }
    }

    function parsePercent(percentStr) {
      let numStr = percentStr.replace('%', '').replace('+', '');
      return parseFloat(numStr);
    }

    function getPercentClass(percent) {
      if (percent.startsWith('+')) return 'positive';
      if (percent.startsWith('-')) return 'negative';
      return 'neutral';
    }

    function renderGifts(giftsArray) {
      const container = document.getElementById('giftList');
      if (!giftsArray || giftsArray.length === 0) {
        container.innerHTML = '<div class="empty-message">Загрузка данных...</div>';
        return;
      }
      let html = '';
      giftsArray.forEach(gift => {
        const percentClass = getPercentClass(gift.percent);
        html += `
          <div class="category-item" data-name="${gift.name}">
            <div class="category-emoji">${gift.emoji}</div>
            <div class="category-info">
              <div class="category-name">${gift.name}</div>
              <div class="category-stats">${gift.stats}</div>
            </div>
            <div class="gift-price">
              <span class="coin-icon">💎</span>
              <span class="price">${gift.price || '0.00'}</span>
            </div>
            <div class="gift-percent ${percentClass}">${gift.percent || '0%'}</div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // Элементы
    const topNav = document.getElementById('topNav');
    const searchRow = document.getElementById('searchRow');
    const allGiftsBtn = document.getElementById('allGiftsBtn');
    const favoriteBtn = document.getElementById('favoriteBtn');
    const growthBtn = document.getElementById('growthBtn');
    const fallBtn = document.getElementById('fallBtn');
    const homeBottomBtn = document.getElementById('homeBottomBtn');
    const servicesBottomBtn = document.getElementById('servicesBottomBtn');
    const accountBottomBtn = document.getElementById('accountBottomBtn');
    const settingsBottomBtn = document.getElementById('settingsBottomBtn');
    const giftList = document.getElementById('giftList');
    const favoriteContent = document.getElementById('favoriteContent');
    const servicesContent = document.getElementById('servicesContent');
    const sortBtn = document.getElementById('sortBtn');
    const sortPanel = document.getElementById('sortPanel');
    const closeSort = document.getElementById('closeSort');
    const filterBtn = document.getElementById('filterBtn');
    const filterPanel = document.getElementById('filterPanel');
    const closeFilter = document.getElementById('closeFilter');
    const graphOverlay = document.getElementById('graphOverlay');
    const graphFrame = document.getElementById('graphFrame');

    function setTopVisibility(visible) {
      if (visible) {
        topNav.classList.remove('hidden');
        searchRow.classList.remove('hidden');
      } else {
        topNav.classList.add('hidden');
        searchRow.classList.add('hidden');
      }
    }

    function setActiveMainTab(tab) {
      allGiftsBtn.classList.remove('active');
      favoriteBtn.classList.remove('active');
      growthBtn.classList.remove('active');
      fallBtn.classList.remove('active');

      giftList.style.display = 'none';
      favoriteContent.style.display = 'none';
      servicesContent.style.display = 'none';

      setTopVisibility(true);

      if (tab === 'all') {
        allGiftsBtn.classList.add('active');
        giftList.style.display = 'block';
        renderGifts(allGiftsFull);
      } else if (tab === 'favorite') {
        favoriteBtn.classList.add('active');
        favoriteContent.style.display = 'block';
        // Данные в LOVE.html обновятся автоматически через событие storage, перезагрузка iframe не требуется
        // const loveFrame = document.querySelector('#favoriteContent iframe');
        // if (loveFrame) loveFrame.contentWindow.location.reload();
      } else if (tab === 'growth') {
        growthBtn.classList.add('active');
        giftList.style.display = 'block';
        const sorted = [...allGiftsFull].sort((a, b) => parsePercent(b.percent) - parsePercent(a.percent));
        renderGifts(sorted);
      } else if (tab === 'fall') {
        fallBtn.classList.add('active');
        giftList.style.display = 'block';
        const sorted = [...allGiftsFull].sort((a, b) => parsePercent(a.percent) - parsePercent(b.percent));
        renderGifts(sorted);
      }
    }

    function setActiveBottomTab(tab) {
      giftList.style.display = 'none';
      favoriteContent.style.display = 'none';
      servicesContent.style.display = 'none';

      if (tab === 'home') {
        setTopVisibility(true);
        setActiveMainTab('all');
      } else if (tab === 'services') {
        setTopVisibility(false);
        servicesContent.style.display = 'block';
        const servicesFrame = document.querySelector('#servicesContent iframe');
        if (servicesFrame) servicesFrame.contentWindow.location.reload();
      } else if (tab === 'account') {
        console.log('Аккаунт');
      } else if (tab === 'settings') {
        console.log('Настройки');
      }
    }

    // Обработчик клика на подарок
    giftList.addEventListener('click', (e) => {
      const item = e.target.closest('.category-item');
      if (!item) return;
      const giftName = item.dataset.name;
      const gift = allGiftsFull.find(g => g.name === giftName);
      if (!gift) return;
      const params = new URLSearchParams({
        name: gift.name,
        emoji: gift.emoji,
        stats: gift.stats,
        price: gift.price,
        percent: gift.percent
      });
      graphFrame.src = `Grafik.html?${params.toString()}`;
      graphOverlay.classList.add('active');
    });

    // ========== ИЗМЕНЕНИЯ ЗДЕСЬ ==========
    // Обработчик сообщений от iframe
    window.addEventListener('message', (event) => {
      // Закрытие оверлея (как для графика, так и для тепловой карты)
      if (event.data.type === 'CLOSE_GRAPH' || event.data.type === 'CLOSE_HEATMAP') {
        graphOverlay.classList.remove('active');
        graphFrame.src = '';
      }
      // Открыть график конкретного подарка
      else if (event.data.type === 'OPEN_GRAPH') {
        const gift = event.data.gift;
        const params = new URLSearchParams({
          name: gift.name,
          emoji: gift.emoji,
          stats: gift.stats,
          price: gift.price,
          percent: gift.percent
        });
        graphFrame.src = `Grafik.html?${params.toString()}`;
        graphOverlay.classList.add('active');
      }
      // Открыть тепловую карту
      else if (event.data.type === 'OPEN_HEATMAP') {
        graphFrame.src = 'Heatmap.html';
        graphOverlay.classList.add('active');
      }
    });

    allGiftsBtn.addEventListener('click', () => setActiveMainTab('all'));
    favoriteBtn.addEventListener('click', () => setActiveMainTab('favorite'));
    growthBtn.addEventListener('click', () => setActiveMainTab('growth'));
    fallBtn.addEventListener('click', () => setActiveMainTab('fall'));

    homeBottomBtn.addEventListener('click', () => setActiveBottomTab('home'));
    servicesBottomBtn.addEventListener('click', () => setActiveBottomTab('services'));
    accountBottomBtn.addEventListener('click', () => setActiveBottomTab('account'));
    settingsBottomBtn.addEventListener('click', () => setActiveBottomTab('settings'));

    sortBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      sortPanel.classList.add('active');
    });
    closeSort.addEventListener('click', (e) => {
      e.stopPropagation();
      sortPanel.classList.remove('active');
    });

    filterBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      filterPanel.classList.add('active');
    });
    closeFilter.addEventListener('click', (e) => {
      e.stopPropagation();
      filterPanel.classList.remove('active');
    });

    window.addEventListener('click', (e) => {
      if (e.target === sortPanel) sortPanel.classList.remove('active');
      if (e.target === filterPanel) filterPanel.classList.remove('active');
    });

    // Инициализация
    renderGifts(allGiftsFull);
    setActiveMainTab('all');
    fetchGiftData(); // первый запрос
    setInterval(fetchGiftData, 300000); // каждые 5 минут
  </script>
</body>
</html>
