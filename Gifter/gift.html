<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Gift Charts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    /* Все стили без изменений (как в предыдущей версии) */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #1a1a1a;
      font-family: 'Inter', Arial, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    body::-webkit-scrollbar {
      display: none;
    }

    .top-nav {
      display: flex;
      gap: 20px;
      padding: 16px 16px 16px 16px;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
      flex-shrink: 0;
      overflow-x: auto;
      white-space: nowrap;
      scrollbar-width: none;
      -ms-overflow-style: none;
      transition: opacity 0.2s, height 0.2s, padding 0.2s;
    }

    .top-nav.hidden {
      opacity: 0;
      height: 0;
      padding: 0 16px;
      pointer-events: none;
    }

    .top-nav::-webkit-scrollbar {
      display: none;
    }

    .nav-item {
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      cursor: pointer;
      padding-bottom: 4px;
      transition: color 0.2s, border-bottom 0.2s;
      flex-shrink: 0;
    }

    .nav-item.active {
      color: #4caf50;
      border-bottom: 2px solid #4caf50;
    }

    .green-arrow {
      color: #4caf50;
    }

    .red-arrow {
      color: #ff5252;
    }

    .search-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 16px 0 16px;
      flex-shrink: 0;
      transition: opacity 0.2s, height 0.2s, padding 0.2s;
    }

    .search-row.hidden {
      opacity: 0;
      height: 0;
      padding: 0 16px;
      pointer-events: none;
    }

    .search-input {
      flex: 1;
      background-color: #2a2a2a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      padding: 12px 20px;
      font-size: 16px;
      color: #fff;
      outline: none;
      transition: border 0.2s;
      min-width: 0;
    }

    .search-input::placeholder {
      color: #aaa;
    }

    .search-input:focus {
      border-color: rgba(255, 255, 255, 0.3);
    }

    .circle-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #2a2a2a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .circle-btn:hover {
      background-color: #3a3a3a;
    }

    .double-arrow {
      font-size: 20px;
      transform: scale(1.2);
    }

    .content-area {
      flex: 1;
      min-height: 0;
      margin-top: 16px;
      overflow-y: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
      -ms-overflow-style: none;
      position: relative;
    }

    .content-area::-webkit-scrollbar {
      display: none;
    }

    .categories {
      height: 100%;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    .categories::-webkit-scrollbar {
      display: none;
    }

    .category-item {
      background-color: #2a2a2a;
      border-bottom: 1px solid #3a3a3a;
      padding: 16px 16px;
      display: flex;
      gap: 16px;
      position: relative;
      align-items: center;
    }

    .category-item:last-child {
      border-bottom: none;
    }

    .category-emoji {
      width: 30px;
      font-size: 20px;
      text-align: center;
      flex-shrink: 0;
    }

    .category-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .category-name {
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      line-height: 1.2;
    }

    .category-stats {
      font-size: 13px;
      color: #aaa;
      font-weight: 400;
      line-height: 1.2;
    }

    .gift-price,
    .gift-percent {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      white-space: nowrap;
      z-index: 1;
    }

    .gift-price {
      --price-right: 100px;
      right: var(--price-right);
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 500;
      color: #fff;
    }

    .gift-percent {
      --percent-right: 17px;
      right: var(--percent-right);
      font-weight: 600;
      font-size: 14px;
    }

    .gift-percent.positive {
      color: #4caf50;
    }

    .gift-percent.negative {
      color: #ff5252;
    }

    .gift-percent.neutral {
      color: #fff;
    }

    .coin-icon {
      font-size: 16px;
      margin-right: 2px;
    }

    .favorite-content,
    .services-content {
      height: 100%;
      display: none;
    }

    .favorite-content iframe,
    .services-content iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }

    .bottom-nav {
      display: flex;
      justify-content: space-between;
      padding: 8px 16px 12px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.5);
      background-color: #1a1a1a;
      flex-shrink: 0;
    }

    .bottom-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: #fff;
      font-weight: 500;
      cursor: pointer;
    }

    .bottom-nav-emoji {
      font-size: 20px;
      line-height: 1;
    }

    .panel {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 80%;
      background-color: #1a1a1a;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
      transform: translateY(100%);
      transition: transform 0.3s ease-in-out;
      z-index: 1000;
      padding: 20px;
    }

    #filterPanel {
      height: 75%;
    }

    .panel.active {
      transform: translateY(0);
    }

    .close-panel {
      position: absolute;
      top: 16px;
      left: 16px;
      font-size: 24px;
      color: #fff;
      cursor: pointer;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background-color: #2a2a2a;
      transition: background 0.2s;
      z-index: 1010;
    }

    .close-panel:hover {
      background-color: #3a3a3a;
    }

    .panel iframe {
      width: 100%;
      height: 100%;
      border: none;
      background: transparent;
    }
  </style>
</head>

    // Текущие данные (начинаем со статики)
    let allGiftsFull = staticGifts.map(g => ({ ...g })); // копия

    // Предыдущие цены для расчёта процента изменения
    let previousPrices = {};

    // Функция для преобразования нанотон в число с двумя знаками и форматированием
    function nanotonToTon(nanoton) {
      const tons = (parseInt(nanoton) / 1e9).toFixed(2);
      // Добавляем разделители тысяч
      return Number(tons).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // Функция для расчёта процента изменения
    function calculatePercent(currentPrice, previousPrice) {
      if (!previousPrice || previousPrice === '0') return '0%';
      const current = parseFloat(currentPrice.replace(/,/g, ''));
      const previous = parseFloat(previousPrice.replace(/,/g, ''));
      if (previous === 0) return '0%';
      const change = ((current - previous) / previous) * 100;
      return (change >= 0 ? '+' : '') + change.toFixed(2) + '%';
    }

    // Загрузка данных из API
    async function fetchGiftData() {
      console.log('⏳ Запрашиваем данные из API...');
      try {
        const response = await fetch('https://proxy.thermos.gifts/api/v1/collections');
        console.log('📡 Ответ получен, статус:', response.status);
        if (!response.ok) throw new Error(`HTTP error ${response.status}`);
        const collections = await response.json();
        console.log('✅ Данные от API:', collections);

        // Обновляем allGiftsFull, оставляя stats из статики
        const updatedGifts = staticGifts.map(staticGift => {
          const found = collections.find(c => c.name === staticGift.name);
          if (found) {
            const priceTon = nanotonToTon(found.stats.floor);
            const previousPrice = previousPrices[staticGift.name] || priceTon;
            const percent = calculatePercent(priceTon, previousPrice);
            previousPrices[staticGift.name] = priceTon;
            return {
              ...staticGift,
              price: priceTon,
              percent: percent
            };
          } else {
            console.warn(`⚠️ Коллекция "${staticGift.name}" не найдена в API, оставляем статические данные`);
            return { ...staticGift };
          }
        });
        allGiftsFull = updatedGifts;
        console.log('🔄 Обновлённые данные:', allGiftsFull);
        // Перерисовываем текущую вкладку (если она не избранное и не сервисы)
        if (!favoriteContent.style.display || favoriteContent.style.display === 'none' && servicesContent.style.display === 'none') {
          // Определяем, какая вкладка активна сейчас
          if (allGiftsBtn.classList.contains('active')) {
            renderGifts(allGiftsFull);
          } else if (growthBtn.classList.contains('active')) {
            const sorted = [...allGiftsFull].sort((a, b) => parsePercent(b.percent) - parsePercent(a.percent));
            renderGifts(sorted);
          } else if (fallBtn.classList.contains('active')) {
            const sorted = [...allGiftsFull].sort((a, b) => parsePercent(a.percent) - parsePercent(b.percent));
            renderGifts(sorted);
          }
        }
      } catch (error) {
        console.error('❌ Ошибка загрузки данных:', error);
        // В случае ошибки оставляем статические данные (уже есть)
      }
    }

    function parsePercent(percentStr) {
      let numStr = percentStr.replace('%', '').replace('+', '');
      return parseFloat(numStr);
    }

    function getPercentClass(percent) {
      if (percent.startsWith('+')) return 'positive';
      if (percent.startsWith('-')) return 'negative';
      return 'neutral';
    }

    function renderGifts(giftsArray) {
      const container = document.getElementById('giftList');
      let html = '';
      giftsArray.forEach(gift => {
        const percentClass = getPercentClass(gift.percent);
        html += `
          <div class="category-item">
            <div class="category-emoji">${gift.emoji}</div>
            <div class="category-info">
              <div class="category-name">${gift.name}</div>
              <div class="category-stats">${gift.stats}</div>
            </div>
            <div class="gift-price">
              <span class="coin-icon">💎</span>
              <span class="price">${gift.price}</span>
            </div>
            <div class="gift-percent ${percentClass}">${gift.percent}</div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    const filterBtn = document.getElementById('filterBtn');

    const closeFilter = document.getElementById('closeFilter');

    function setTopVisibility(visible) {
      if (visible) {
        topNav.classList.remove('hidden');
        searchRow.classList.remove('hidden');
      } else {
        topNav.classList.add('hidden');
        searchRow.classList.add('hidden');
      }
    }

    function setActiveMainTab(tab) {
      allGiftsBtn.classList.remove('active');
      favoriteBtn.classList.remove('active');
      growthBtn.classList.remove('active');
      fallBtn.classList.remove('active');

      giftList.style.display = 'none';
      favoriteContent.style.display = 'none';
      servicesContent.style.display = 'none';

      setTopVisibility(true);

      if (tab === 'all') {
        allGiftsBtn.classList.add('active');
        giftList.style.display = 'block';
        renderGifts(allGiftsFull);
      } else if (tab === 'favorite') {
        favoriteBtn.classList.add('active');
        favoriteContent.style.display = 'block';
        const loveFrame = document.querySelector('#favoriteContent iframe');
        if (loveFrame) loveFrame.contentWindow.location.reload();
      } else if (tab === 'growth') {
        growthBtn.classList.add('active');
        giftList.style.display = 'block';
        const sorted = [...allGiftsFull].sort((a, b) => parsePercent(b.percent) - parsePercent(a.percent));
        renderGifts(sorted);
      } else if (tab === 'fall') {
        fallBtn.classList.add('active');
        giftList.style.display = 'block';
        const sorted = [...allGiftsFull].sort((a, b) => parsePercent(a.percent) - parsePercent(b.percent));
        renderGifts(sorted);
      }
    }

    function setActiveBottomTab(tab) {
      giftList.style.display = 'none';
      favoriteContent.style.display = 'none';
      servicesContent.style.display = 'none';

      if (tab === 'home') {
        setTopVisibility(true);
        setActiveMainTab('all');
      } else if (tab === 'services') {
        setTopVisibility(false);
        servicesContent.style.display = 'block';
        const servicesFrame = document.querySelector('#servicesContent iframe');
        if (servicesFrame) servicesFrame.contentWindow.location.reload();
      } else if (tab === 'account') {
        console.log('Аккаунт');
      } else if (tab === 'settings') {
        console.log('Настройки');
      }
    }

    allGiftsBtn.addEventListener('click', () => setActiveMainTab('all'));
    favoriteBtn.addEventListener('click', () => setActiveMainTab('favorite'));
    growthBtn.addEventListener('click', () => setActiveMainTab('growth'));
    fallBtn.addEventListener('click', () => setActiveMainTab('fall'));

    homeBottomBtn.addEventListener('click', () => setActiveBottomTab('home'));
    servicesBottomBtn.addEventListener('click', () => setActiveBottomTab('services'));
    accountBottomBtn.addEventListener('click', () => setActiveBottomTab('account'));
    settingsBottomBtn.addEventListener('click', () => setActiveBottomTab('settings'));

    sortBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      sortPanel.classList.add('active');
    });
    closeSort.addEventListener('click', (e) => {
      e.stopPropagation();
      sortPanel.classList.remove('active');
    });

    filterBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      filterPanel.classList.add('active');
    });
    closeFilter.addEventListener('click', (e) => {
      e.stopPropagation();
      filterPanel.classList.remove('active');
    });

    window.addEventListener('click', (e) => {
      if (e.target === sortPanel) sortPanel.classList.remove('active');
      if (e.target === filterPanel) filterPanel.classList.remove('active');
    });

    window.addEventListener('message', (event) => {
      if (event.data.type === 'CLOSE_FILTER_PANEL') {
        filterPanel.classList.remove('active');
      }
    });

    // Инициализация: рендерим статические данные, затем загружаем реальные
    renderGifts(allGiftsFull);
    setActiveMainTab('all');
    fetchGiftData(); // первый запрос
    setInterval(fetchGiftData, 600000); // каждые 10 минут
  </script>
