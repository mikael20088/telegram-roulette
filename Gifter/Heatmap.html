<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Тепловая карта</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #1a1a1a;
      font-family: 'Inter', Arial, sans-serif;
      color: #fff;
      height: 100%;
      overflow-y: hidden; /* Убираем прокрутку, всё должно поместиться */
      padding: 2px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 2px;
      padding: 2px;
    }

    .back-btn {
      font-size: 20px;
      cursor: pointer;
      color: #fff;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background-color: #2a2a2a;
      transition: background 0.2s;
    }

    .back-btn:hover {
      background-color: #3a3a3a;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
    }

    .heatmap-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0; /* Без промежутков */
      justify-content: flex-start;
    }

    .heatmap-item {
      width: 45px;          /* Фиксированный размер */
      height: 45px;
      border: 0.5px solid rgba(255, 255, 255, 0.15); /* Очень тонкая граница для разделения */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.1s;
      position: relative;
    }

    .heatmap-item:active {
      transform: scale(0.96);
    }

    .heatmap-emoji {
      font-size: 22px;
      line-height: 1;
      margin-bottom: 2px;
    }

    .heatmap-percent {
      font-size: 8px;
      font-weight: 600;
      line-height: 1;
      background-color: rgba(0,0,0,0.5); /* Полупрозрачный фон для читаемости */
      padding: 1px 2px;
      border-radius: 2px;
      color: #fff; /* цвет будет переопределён через style */
      position: absolute;
      bottom: 2px;
      right: 2px;
    }

    .empty-message {
      text-align: center;
      padding: 40px;
      color: #aaa;
      font-size: 16px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="back-btn" id="backBtn">←</div>
    <div class="title">Тепловая карта</div>
  </div>
  <div class="heatmap-grid" id="heatmapGrid"></div>

  <script>
    (function() {
      const backBtn = document.getElementById('backBtn');
      const grid = document.getElementById('heatmapGrid');

      backBtn.addEventListener('click', () => {
        window.parent.postMessage({ type: 'CLOSE_HEATMAP' }, '*');
      });

      function getPercentValue(percentStr) {
        if (!percentStr) return 0;
        const num = parseFloat(percentStr.replace('%', '').replace('+', ''));
        return isNaN(num) ? 0 : num;
      }

      function getBackgroundColor(percentValue) {
        const absPercent = Math.min(Math.abs(percentValue), 20); // насыщенность до 20%
        const intensity = 0.1 + (absPercent / 20) * 0.7; // от 0.1 до 0.8
        if (percentValue > 0) {
          return `rgba(76, 175, 80, ${intensity})`; // зелёный
        } else if (percentValue < 0) {
          return `rgba(255, 82, 82, ${intensity})`; // красный
        } else {
          return '#2a2a2a'; // нейтральный
        }
      }

      function getPercentColor(percentValue) {
        if (percentValue > 0) return '#4caf50';
        if (percentValue < 0) return '#ff5252';
        return '#ffffff';
      }

      function renderHeatmap() {
        try {
          const stored = localStorage.getItem('giftData');
          if (!stored) {
            grid.innerHTML = '<div class="empty-message">Нет данных</div>';
            return;
          }
          let gifts = JSON.parse(stored);
          if (!Array.isArray(gifts) || gifts.length === 0) {
            grid.innerHTML = '<div class="empty-message">Нет данных</div>';
            return;
          }

          // Сортировка по убыванию модуля процента (самые сильные изменения — вверху слева)
          gifts = gifts.sort((a, b) => {
            const aVal = Math.abs(getPercentValue(a.percent));
            const bVal = Math.abs(getPercentValue(b.percent));
            return bVal - aVal;
          });

          let html = '';
          gifts.forEach(gift => {
            const percentStr = gift.percent || '0%';
            const percentValue = getPercentValue(percentStr);
            const bgColor = getBackgroundColor(percentValue);
            const percentColor = getPercentColor(percentValue);

            const style = `background-color: ${bgColor};`;

            html += `
              <div class="heatmap-item" style="${style}" data-name="${gift.name}">
                <span class="heatmap-emoji">${gift.emoji || '🎁'}</span>
                <span class="heatmap-percent" style="color: ${percentColor};">${percentStr}</span>
              </div>
            `;
          });

          grid.innerHTML = html;

          document.querySelectorAll('.heatmap-item').forEach(item => {
            item.addEventListener('click', () => {
              const name = item.dataset.name;
              const gift = gifts.find(g => g.name === name);
              if (gift) {
                window.parent.postMessage({ type: 'OPEN_GRAPH', gift: gift }, '*');
              }
            });
          });
        } catch (e) {
          console.error('Ошибка рендера тепловой карты:', e);
          grid.innerHTML = '<div class="empty-message">Ошибка загрузки</div>';
        }
      }

      renderHeatmap();

      window.addEventListener('storage', (event) => {
        if (event.key === 'giftData') {
          renderHeatmap();
        }
      });

      setInterval(renderHeatmap, 300000);
    })();
  </script>
</body>
</html>
