<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Telegram Stars</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    /* --- ПОЛНОСТЬЮ ВОССТАНОВЛЕННЫЙ ВИЗУАЛ --- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: #000;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 0;
    }

    .stars-container {
      width: 100%;
      max-width: 500px;
      background: rgba(10, 20, 10, 0.3);
      backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      -webkit-backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      padding: 24px 20px;
      margin: 20px 16px;
      position: relative;
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
      animation: matrixGlow 4s ease-in-out infinite alternate;
    }

    @keyframes matrixGlow {
      0% { box-shadow: 0 0 15px rgba(0, 255, 136, 0.2); }
      100% { box-shadow: 0 0 30px rgba(0, 255, 136, 0.5); }
    }

    .stars-container::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(45deg, rgba(0, 255, 136, 0.15) 0%, rgba(0, 200, 100, 0.08) 25%, rgba(0, 255, 200, 0.12) 50%, rgba(0, 150, 80, 0.05) 75%, rgba(0, 255, 136, 0.15) 100%),
        radial-gradient(circle at 25% 25%, rgba(120, 255, 120, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(0, 255, 136, 0.2) 0%, transparent 50%);
      border-radius: 30px;
      z-index: -1;
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: -0.3px;
      margin: 0;
    }

    .subtitle {
      font-size: 16px;
      color: #ffffff;
      opacity: 0.9;
      margin-bottom: 28px;
      font-weight: 400;
    }

    .right-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .balance-panel {
      position: relative;
      padding: 4px 8px 4px 4px;
      display: flex;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      border-radius: 30px;
      background: rgba(10, 20, 10, 0.3);
      backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      -webkit-backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-family: 'Inter', sans-serif;
      flex-shrink: 0;
    }

    .balance-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(45deg, rgba(0, 255, 136, 0.15) 0%, rgba(0, 200, 100, 0.08) 25%, rgba(0, 255, 200, 0.12) 50%, rgba(0, 150, 80, 0.05) 75%, rgba(0, 255, 136, 0.15) 100%),
        radial-gradient(circle at 25% 25%, rgba(120, 255, 120, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(0, 255, 136, 0.2) 0%, transparent 50%);
      border-radius: 30px;
      z-index: -1;
      animation: matrixGlow 4s ease-in-out infinite alternate;
    }

    .ton-icon {
      font-size: 20px;
      color: #00ff88;
    }

    .balance-amount {
      font-size: 16px;
      font-weight: bold;
      color: #fff;
    }

    .plus-square {
      width: 24px;
      height: 24px;
      background: #fff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-size: 18px;
      font-weight: bold;
    }

    .connect-wallet-button {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(10, 20, 10, 0.3);
      backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      -webkit-backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
      transition: transform 0.2s;
      font-size: 18px;
      color: #00ff88;
    }
    .connect-wallet-button:hover {
      transform: scale(1.05);
    }
    .connect-wallet-button::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(45deg, rgba(0, 255, 136, 0.15) 0%, rgba(0, 200, 100, 0.08) 25%, rgba(0, 255, 200, 0.12) 50%, rgba(0, 150, 80, 0.05) 75%, rgba(0, 255, 136, 0.15) 100%),
        radial-gradient(circle at 25% 25%, rgba(120, 255, 120, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(0, 255, 136, 0.2) 0%, transparent 50%);
      border-radius: 8px;
      z-index: -1;
      animation: matrixGlow 4s ease-in-out infinite alternate;
    }
    .connect-wallet-button::after {
      content: '+';
      position: absolute;
      bottom: 0px;
      right: 2px;
      font-size: 12px;
      font-weight: bold;
      color: #00ff88;
      text-shadow: 0 0 5px #00ff88;
    }

    .wallet-icon-header {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(30, 30, 40, 0.8);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #00ff88;
      cursor: pointer;
    }
    .wallet-icon-header.hidden,
    .connect-wallet-button.hidden {
      display: none;
    }

    /* Поле ввода (исходное) */
    .input-field {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 14px 18px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-field:focus-within {
      border-color: rgba(0, 255, 136, 0.6);
      box-shadow: 0 0 12px rgba(0, 255, 136, 0.3);
    }

    .field-icon {
      font-size: 16px;
      width: 20px;
      text-align: center;
      line-height: 1;
      opacity: 0.9;
    }

    .avatar-icon {
      width: 20px;
      height: 20px;
      border-radius: 50%;
      object-fit: cover;
      display: none;
    }

    .field-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 16px;
      font-weight: 400;
    }

    .field-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
      font-weight: 300;
    }

    .static-field {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 14px 18px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #ffffff;
      font-size: 16px;
    }

    .static-field .field-icon {
      opacity: 1;
    }

    .amount-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .amount-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 16px;
      min-width: 80px;
    }

    .amount-input::-webkit-outer-spin-button,
    .amount-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .amount-input[type=number] {
      -moz-appearance: textfield;
    }

    .usd-hint {
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      white-space: nowrap;
      background: rgba(0, 255, 136, 0.15);
      padding: 4px 10px;
      border-radius: 30px;
      border: 1px solid rgba(0, 255, 136, 0.3);
    }

    .buy-button {
      width: 100%;
      background: rgba(200, 230, 255, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      padding: 18px 20px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      cursor: not-allowed;
      transition: all 0.2s ease;
      margin-top: 8px;
    }

    .buy-button.active {
      background: rgba(100, 200, 255, 0.3);
      border-color: rgba(100, 200, 255, 0.8);
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(100, 200, 255, 0.4);
    }

    .buy-button.active:active {
      transform: scale(0.98);
    }

    .error-message {
      color: #ff6b6b;
      font-size: 14px;
      margin-top: 8px;
      margin-bottom: 16px;
      padding-left: 18px;
      display: none;
    }

    @media (max-width: 360px) {
      .stars-container {
        padding: 20px 16px;
      }
      h1 { font-size: 24px; }
      .subtitle { font-size: 14px; }
      .balance-amount { font-size: 14px; }
    }
  </style>
</head>
<body>
  <div class="stars-container">
    <div class="header-row">
      <h1>Telegram Stars</h1>
      <div class="right-group">
        <div class="balance-panel" id="starsBalancePanel">
          <span class="ton-icon">💎</span>
          <span class="balance-amount" id="balanceAmount">0.00</span>
          <span class="plus-square">+</span>
        </div>
        <div class="connect-wallet-button hidden" id="connectWalletButton" title="Подключить кошелек">💳</div>
        <div class="wallet-icon-header hidden" id="walletHeaderIcon">💎</div>
      </div>
    </div>
    <div class="subtitle">Пополните баланс себе или подарите другу</div>

    <!-- Поле ввода с аватаркой -->
    <div class="input-field">
      <span class="field-icon" id="usernameIcon">@</span>
      <img class="avatar-icon" id="usernameAvatar" src="" alt="avatar">
      <input type="text" class="field-input" id="usernameInput" placeholder="Введите Telegram username" autocomplete="off">
    </div>

    <div class="static-field">
      <span class="field-icon">💎</span>
      <span>TON</span>
    </div>

    <div class="input-field" id="starsField">
      <span class="field-icon">⭐</span>
      <div class="amount-wrapper">
        <input type="number" class="amount-input" id="starsAmount" placeholder="Введите сумму (50 — 100000)" min="50" max="100000" step="1" inputmode="numeric">
        <span class="usd-hint" id="usdHint">0.00 $</span>
      </div>
    </div>

    <div class="buy-button" id="buyButton">Купить Stars</div>
    <div class="error-message" id="errorMsg"></div>
  </div>

  <script>
    (function() {
      const starsInput = document.getElementById('starsAmount');
      const usdHint = document.getElementById('usdHint');
      const buyButton = document.getElementById('buyButton');
      const usernameInput = document.getElementById('usernameInput');
      const errorMsg = document.getElementById('errorMsg');
      const balanceAmount = document.getElementById('balanceAmount');
      const connectWalletBtn = document.getElementById('connectWalletButton');
      const walletHeaderIcon = document.getElementById('walletHeaderIcon');

      // Элементы для аватарки
      const usernameIcon = document.getElementById('usernameIcon');
      const usernameAvatar = document.getElementById('usernameAvatar');

      let tonUsdRate = 3.5;
      const starsPerTon = 0.0045;

      // Флаг валидности username (аватарка загружена)
      let isUsernameValid = false;
      // Флаг подключения кошелька (получаем от родителя)
      let isWalletConnected = false;

      // Функция для обновления видимости кнопок кошелька
      function updateWalletUI(connected) {
        if (connected) {
          connectWalletBtn.classList.add('hidden');
          walletHeaderIcon.classList.remove('hidden');
        } else {
          connectWalletBtn.classList.remove('hidden');
          walletHeaderIcon.classList.add('hidden');
        }
      }

      // Кеш для аватарок
      const avatarCache = new Map();

      // Сброс состояния валидации username
      function resetUsernameState() {
        isUsernameValid = false;
        usernameAvatar.style.display = 'none';
        usernameAvatar.src = '';
        usernameIcon.style.display = 'inline';
        updateButtonState();
      }

      // Загружаем аватарку по username
      function loadAvatar(username) {
        let clean = username.trim().replace(/^@/, '');
        if (!clean) {
          resetUsernameState();
          return;
        }

        // Если есть в кеше
        if (avatarCache.has(clean)) {
          const cached = avatarCache.get(clean);
          if (cached === 'found') {
            usernameAvatar.src = `https://t.me/i/userpic/320/${clean}.jpg`;
            usernameAvatar.style.display = 'inline';
            usernameIcon.style.display = 'none';
            isUsernameValid = true;
          } else {
            resetUsernameState();
          }
          updateButtonState();
          return;
        }

        // Нет в кеше – пробуем загрузить
        const avatarUrl = `https://t.me/i/userpic/320/${clean}.jpg`;
        const img = new Image();
        img.onload = () => {
          avatarCache.set(clean, 'found');
          usernameAvatar.src = avatarUrl;
          usernameAvatar.style.display = 'inline';
          usernameIcon.style.display = 'none';
          isUsernameValid = true;
          updateButtonState();
        };
        img.onerror = () => {
          avatarCache.set(clean, 'notfound');
          resetUsernameState();
        };
        img.src = avatarUrl;
      }

      // Функция обновления состояния кнопки
      function updateButtonState() {
        let stars = parseInt(starsInput.value, 10);
        const isStarsValid = !isNaN(stars) && stars >= 50 && stars <= 100000;
        const usernameEmpty = usernameInput.value.trim() === '';

        // Кнопка активна, если:
        // - сумма валидна И
        // - (username пуст ИЛИ username валиден)
        const shouldBeActive = isStarsValid && (usernameEmpty || isUsernameValid);

        if (shouldBeActive) {
          buyButton.classList.add('active');
          errorMsg.style.display = 'none';
        } else {
          buyButton.classList.remove('active');
          if (starsInput.value !== '' && !isStarsValid) {
            errorMsg.style.display = 'block';
            errorMsg.textContent = 'Минимум 50, максимум 100 000 Stars';
          } else {
            errorMsg.style.display = 'none';
          }
        }
      }

      // Обработчики полей
      starsInput.addEventListener('input', updateButtonState);
      usernameInput.addEventListener('input', () => {
        resetUsernameState(); // при вводе сбрасываем валидность username
      });

      usernameInput.addEventListener('blur', () => {
        loadAvatar(usernameInput.value);
      });

      usernameInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          usernameInput.blur();
        }
      });

      // Сообщения от родителя
      window.parent.postMessage({ type: 'STARS_READY' }, '*');

      window.addEventListener('message', (event) => {
        const data = event.data;
        if (!data) return;
        switch (data.type) {
          case 'UPDATE_BALANCE':
            if (balanceAmount) {
              balanceAmount.textContent = data.balance.toFixed(2);
            }
            break;
          case 'WALLET_STATUS':
            if (typeof data.connected === 'boolean') {
              isWalletConnected = data.connected;
              updateWalletUI(data.connected);
            }
            if (data.balance !== undefined && balanceAmount) {
              balanceAmount.textContent = data.balance.toFixed(2);
            }
            break;
        }
      });

      // Клик по панели баланса -> открыть модалку пополнения
      document.getElementById('starsBalancePanel').addEventListener('click', () => {
        window.parent.postMessage({ type: 'OPEN_PAYMENT_MODAL' }, '*');
      });

      // Клик по кнопке подключения кошелька
      connectWalletBtn.addEventListener('click', () => {
        window.parent.postMessage({ type: 'CONNECT_WALLET' }, '*');
      });

      // Клик по иконке кошелька (открыть аккаунт)
      walletHeaderIcon.addEventListener('click', () => {
        window.parent.postMessage({ type: 'OPEN_ACCOUNT_MODAL' }, '*');
      });

      // Обработчик кнопки "Купить Stars"
      buyButton.addEventListener('click', async () => {
        if (!buyButton.classList.contains('active')) return;

        const stars = parseInt(starsInput.value, 10);
        const username = usernameInput.value.trim();

        // Если кошелёк не подключён – отправляем запрос на подключение
        if (!isWalletConnected) {
          window.parent.postMessage({ type: 'CONNECT_WALLET' }, '*');
          return;
        }

        // Если кошелёк подключён – отправляем запрос на покупку
        const tonAmount = stars * starsPerTon; // сумма в TON

        window.parent.postMessage({
          type: 'PURCHASE_STARS',
          stars: stars,
          tonAmount: tonAmount,
          username: username || ''
        }, '*');
      });

      // Оригинальная логика Stars (расчёт USD)
      async function fetchTonRate() {
        try {
          const response = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=the-open-network&vs_currencies=usd');
          const data = await response.json();
          if (data && data['the-open-network'] && data['the-open-network'].usd) {
            tonUsdRate = data['the-open-network'].usd;
          }
        } catch (e) {
          console.warn('Failed to fetch TON rate, using fallback', e);
        }
      }

      function calculateUsd(stars) {
        const tonAmount = stars * starsPerTon;
        return tonAmount * tonUsdRate;
      }

      function updateUI() {
        let stars = parseInt(starsInput.value, 10);
        const isValid = !isNaN(stars) && stars >= 50 && stars <= 100000;
        if (isValid) {
          const usdValue = calculateUsd(stars);
          usdHint.textContent = usdValue.toFixed(2) + ' $';
        } else {
          usdHint.textContent = '0.00 $';
        }
        // Состояние кнопки обновляется в updateButtonState, который вызывается отдельно
      }

      starsInput.addEventListener('input', updateUI);

      fetchTonRate().then(() => {
        updateUI();
        updateButtonState();
      });
    })();
  </script>
</body>
</html>
