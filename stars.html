<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Telegram Stars</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    /* ===== Все существующие стили Stars (без изменений) ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: #000;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 20px 16px;
      position: relative;
    }

    .stars-container {
      width: 100%;
      max-width: 400px;
      background: rgba(10, 20, 10, 0.3);
      backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      -webkit-backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      padding: 24px 20px;
      position: relative;
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
      animation: matrixGlow 4s ease-in-out infinite alternate;
    }

    @keyframes matrixGlow {
      0% { box-shadow: 0 0 15px rgba(0, 255, 136, 0.2); }
      100% { box-shadow: 0 0 30px rgba(0, 255, 136, 0.5); }
    }

    .stars-container::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(45deg, rgba(0, 255, 136, 0.15) 0%, rgba(0, 200, 100, 0.08) 25%, rgba(0, 255, 200, 0.12) 50%, rgba(0, 150, 80, 0.05) 75%, rgba(0, 255, 136, 0.15) 100%),
        radial-gradient(circle at 25% 25%, rgba(120, 255, 120, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(0, 255, 136, 0.2) 0%, transparent 50%);
      border-radius: 30px;
      z-index: -1;
    }

    h1 {
      font-size: 28px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 6px;
      letter-spacing: -0.3px;
    }

    .subtitle {
      font-size: 16px;
      color: #ffffff;
      opacity: 0.9;
      margin-bottom: 28px;
      font-weight: 400;
    }

    .input-field {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 14px 18px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-field:focus-within {
      border-color: rgba(0, 255, 136, 0.6);
      box-shadow: 0 0 12px rgba(0, 255, 136, 0.3);
    }

    .field-icon {
      font-size: 16px;
      width: 20px;
      text-align: center;
      line-height: 1;
      opacity: 0.9;
    }

    .field-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 16px;
      font-weight: 400;
    }

    .field-input::placeholder {
      color: rgba(255, 255, 255, 0.5);
      font-weight: 300;
    }

    .static-field {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      padding: 14px 18px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #ffffff;
      font-size: 16px;
    }

    .static-field .field-icon {
      opacity: 1;
    }

    .static-field span {
      color: #ffffff;
    }

    .amount-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .amount-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 16px;
      min-width: 80px;
    }

    .amount-input::-webkit-outer-spin-button,
    .amount-input::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    .amount-input[type=number] {
      -moz-appearance: textfield;
    }

    .usd-hint {
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      white-space: nowrap;
      background: rgba(0, 255, 136, 0.15);
      padding: 4px 10px;
      border-radius: 30px;
      border: 1px solid rgba(0, 255, 136, 0.3);
    }

    .buy-button {
      width: 100%;
      background: rgba(200, 230, 255, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 30px;
      padding: 18px 20px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 18px;
      font-weight: 600;
      text-align: center;
      cursor: not-allowed;
      transition: all 0.2s ease;
      margin-top: 8px;
    }

    .buy-button.active {
      background: rgba(100, 200, 255, 0.3);
      border-color: rgba(100, 200, 255, 0.8);
      color: #ffffff;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(100, 200, 255, 0.4);
    }

    .buy-button.active:active {
      transform: scale(0.98);
    }

    .error-message {
      color: #ff6b6b;
      font-size: 14px;
      margin-top: 8px;
      margin-bottom: 16px;
      padding-left: 18px;
      display: none;
    }

    @media (max-width: 360px) {
      .stars-container {
        padding: 20px 16px;
      }
      h1 { font-size: 24px; }
      .subtitle { font-size: 14px; }
    }

    /* ===== ТОЧНАЯ КОПИЯ ПАНЕЛИ С ГЛАВНОЙ СТРАНИЦЫ ===== */
    .top-right-panel {
      position: absolute;
      top: 18px;
      right: 18px;
      z-index: 30;
      pointer-events: auto;
    }

    .balance-panel {
      position: relative;
      padding: 4px 8px 4px 4px;
      display: flex;
      align-items: center;
      gap: 2px;
      cursor: pointer;
      border-radius: 30px;
      background: rgba(10, 20, 10, 0.3);
      backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      -webkit-backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
      /* Убираем класс .visible, просто показываем сразу */
      opacity: 1;
      pointer-events: auto;
      transition: none; /* убираем transition, чтобы не было задержки */
    }

    .balance-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(45deg, rgba(0, 255, 136, 0.15) 0%, rgba(0, 200, 100, 0.08) 25%, rgba(0, 255, 200, 0.12) 50%, rgba(0, 150, 80, 0.05) 75%, rgba(0, 255, 136, 0.15) 100%),
        radial-gradient(circle at 25% 25%, rgba(120, 255, 120, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(0, 255, 136, 0.2) 0%, transparent 50%);
      border-radius: 30px;
      z-index: -1;
      animation: matrixGlow 4s ease-in-out infinite alternate;
    }

    .ton-icon {
      font-size: 20px;
      color: #00ff88;
      line-height: 1;
    }

    .balance-amount {
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      line-height: 1;
    }

    .plus-square {
      width: 24px;
      height: 24px;
      background: #fff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-size: 18px;
      font-weight: bold;
      line-height: 1;
    }
  </style>
</head>
<body>
  <!-- Панель справа сверху, идентичная главной -->
  <div class="top-right-panel">
    <div class="balance-panel" id="starsBalancePanel">
      <span class="ton-icon">💎</span>
      <span class="balance-amount" id="balanceAmount">0.00</span>
      <span class="plus-square">+</span>
    </div>
  </div>

  <div class="stars-container">
    <h1>Telegram Stars</h1>
    <div class="subtitle">Пополните баланс себе или подарите другу</div>

    <div class="input-field">
      <span class="field-icon">@</span>
      <input type="text" class="field-input" id="usernameInput" placeholder="Введите Telegram username" autocomplete="off">
    </div>

    <div class="static-field">
      <span class="field-icon">💎</span>
      <span>TON</span>
    </div>

    <div class="input-field" id="starsField">
      <span class="field-icon">⭐</span>
      <div class="amount-wrapper">
        <input type="number" class="amount-input" id="starsAmount" placeholder="Введите сумму (50 — 100000)" min="50" max="100000" step="1" inputmode="numeric">
        <span class="usd-hint" id="usdHint">0.00 $</span>
      </div>
    </div>

    <div class="buy-button" id="buyButton">Купить Stars</div>
    <div class="error-message" id="errorMsg"></div>
  </div>

  <script>
    (function() {
      const starsInput = document.getElementById('starsAmount');
      const usdHint = document.getElementById('usdHint');
      const buyButton = document.getElementById('buyButton');
      const usernameInput = document.getElementById('usernameInput');
      const errorMsg = document.getElementById('errorMsg');

      let tonUsdRate = 3.5;
      const starsPerTon = 0.0045;

      async function fetchTonRate() {
        try {
          const response = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=the-open-network&vs_currencies=usd');
          const data = await response.json();
          if (data && data['the-open-network'] && data['the-open-network'].usd) {
            tonUsdRate = data['the-open-network'].usd;
          }
        } catch (e) {
          console.warn('Failed to fetch TON rate, using fallback', e);
        }
      }

      function calculateUsd(stars) {
        const tonAmount = stars * starsPerTon;
        return tonAmount * tonUsdRate;
      }

      function updateUI() {
        let stars = parseInt(starsInput.value, 10);
        const isValid = !isNaN(stars) && stars >= 50 && stars <= 100000;

        if (isValid) {
          const usdValue = calculateUsd(stars);
          usdHint.textContent = usdValue.toFixed(2) + ' $';
          buyButton.classList.add('active');
          errorMsg.style.display = 'none';
        } else {
          usdHint.textContent = '0.00 $';
          buyButton.classList.remove('active');
          if (starsInput.value !== '') {
            errorMsg.style.display = 'block';
            errorMsg.textContent = 'Минимум 50, максимум 100 000 Stars';
          } else {
            errorMsg.style.display = 'none';
          }
        }
      }

      starsInput.addEventListener('input', updateUI);

      buyButton.addEventListener('click', async () => {
        if (!buyButton.classList.contains('active')) return;

        const stars = parseInt(starsInput.value, 10);
        const username = usernameInput.value.trim();

        if (username === '') {
          console.log('Покупка для себя');
        } else {
          if (!username.startsWith('@') && !username.match(/^[a-zA-Z0-9_]{5,}$/)) {
            alert('Пожалуйста, введите корректный Telegram username (например, @durov или durov)');
            return;
          }
        }

        buyButton.textContent = 'Обработка...';
        buyButton.classList.remove('active');

        setTimeout(() => {
          alert(`Оплата ${stars} Stars: ${(stars * starsPerTon).toFixed(2)} TON`);
          buyButton.textContent = 'Купить Stars';
          buyButton.classList.add('active');
        }, 1000);
      });

      fetchTonRate().then(updateUI);

      // Отправка события открытия модалки родителю
      const balancePanel = document.getElementById('starsBalancePanel');
      balancePanel.addEventListener('click', () => {
        window.parent.postMessage({ type: 'OPEN_PAYMENT_MODAL' }, '*');
      });

      // Получение обновлений баланса от родителя
      window.addEventListener('message', (event) => {
        if (event.data.type === 'UPDATE_BALANCE') {
          const balanceAmount = document.getElementById('balanceAmount');
          if (balanceAmount) {
            balanceAmount.textContent = event.data.balance.toFixed(2);
          }
        }
      });
    })();
  </script>
</body>
</html>
