<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>TON Price Chart</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background: #000; 
            overflow: hidden; 
            height: 100vh; 
        }
        #chart_div { 
            width: 100%; 
            height: 100%; 
        }
    </style>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <script type="text/javascript">
        google.charts.load('current', {'packages':['corechart', 'line']});
        google.charts.setOnLoadCallback(drawChart);

        async function drawChart() {
            try {
                // Получаем данные с Binance (последние 100 свечей по 1 часу)
                const response = await fetch('https://api.binance.com/api/v3/klines?symbol=TONUSDT&interval=1h&limit=100');
                if (!response.ok) throw new Error('Network error');
                const data = await response.json();
                
                // Преобразуем в формат Google Charts
                const chartData = [['Время', 'Цена закрытия']];
                data.forEach(item => {
                    const time = new Date(item[0]); // timestamp в миллисекундах
                    const close = parseFloat(item[4]); // цена закрытия
                    chartData.push([time, close]);
                });

                const chartDiv = document.getElementById('chart_div');
                const chart = new google.visualization.LineChart(chartDiv);
                const options = {
                    title: 'TON / USDT (1 час)',
                    titleTextStyle: { color: '#00ff88', fontSize: 16 },
                    legend: { position: 'none' },
                    colors: ['#00ff88'],
                    backgroundColor: '#000',
                    chartArea: { 
                        backgroundColor: '#000',
                        left: 60,
                        top: 60,
                        right: 30,
                        bottom: 40
                    },
                    hAxis: { 
                        textStyle: { color: '#fff' }, 
                        gridlines: { color: '#333' },
                        format: 'HH:mm dd.MM'
                    },
                    vAxis: { 
                        textStyle: { color: '#fff' }, 
                        gridlines: { color: '#333' },
                        format: 'currency'
                    },
                    lineWidth: 2,
                    curveType: 'function',
                    crosshair: { trigger: 'both' }
                };
                chart.draw(google.visualization.arrayToDataTable(chartData), options);
            } catch (e) {
                document.body.innerHTML = '<p style="color:#fff; text-align:center; margin-top:50px;">Ошибка загрузки данных. Проверьте интернет.</p>';
            }
        }
    </script>
</head>
<body>
    <div id="chart_div"></div>
</body>
</html>
