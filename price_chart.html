<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON / USDT</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            position: relative;
            background: #000;
        }
        /* Фон в стиле главного квадрата */
        body::before {
            content: '';
            position: absolute;
            inset: 0;
            background: 
                linear-gradient(45deg, rgba(0, 255, 136, 0.15) 0%, rgba(0, 200, 100, 0.08) 25%, rgba(0, 255, 200, 0.12) 50%, rgba(0, 150, 80, 0.05) 75%, rgba(0, 255, 136, 0.15) 100%),
                radial-gradient(circle at 25% 25%, rgba(120, 255, 120, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(0, 255, 136, 0.2) 0%, transparent 50%);
            backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
            -webkit-backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
            z-index: 0;
            animation: matrixGlow 4s ease-in-out infinite alternate;
        }
        @keyframes matrixGlow {
            0% { opacity: 0.7; transform: scale(1); }
            100% { opacity: 1; transform: scale(1.03); }
        }
        /* Контейнер для графика */
        #chart {
            position: relative;
            z-index: 1;
            width: 100%;
            height: calc(100% - 50px); /* оставляем место под кнопки */
        }
        /* Панель управления */
        .timeframe-panel {
            position: relative;
            z-index: 2;
            display: flex;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
            border-bottom: 1px solid rgba(255,255,255,0.2);
        }
        .timeframe-btn {
            background: rgba(10,20,10,0.3);
            backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.2s;
        }
        .timeframe-btn:hover {
            transform: scale(1.05);
        }
        .timeframe-btn.active {
            background: rgba(0,255,136,0.3);
            border-color: #00ff88;
        }
    </style>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <div class="timeframe-panel">
        <button class="timeframe-btn active" data-interval="1h">1 час</button>
        <button class="timeframe-btn" data-interval="4h">4 часа</button>
        <button class="timeframe-btn" data-interval="1d">1 день</button>
    </div>
    <div id="chart"></div>
    <script>
        // Текущий интервал
        let currentInterval = '1h';
        let chart = null;
        let candlestickSeries = null;

        // Функция создания графика
        function initChart() {
            if (chart) {
                chart.remove();
            }
            chart = LightweightCharts.createChart(document.getElementById('chart'), {
                width: window.innerWidth,
                height: window.innerHeight - 50,
                layout: {
                    backgroundColor: 'transparent', // прозрачный фон, чтобы был виден фон body::before
                    textColor: '#d1d4dc',
                },
                grid: {
                    vertLines: { color: 'rgba(42, 46, 57, 0.5)' },
                    horzLines: { color: 'rgba(42, 46, 57, 0.5)' },
                },
                crosshair: {
                    mode: LightweightCharts.CrosshairMode.Normal,
                },
                rightPriceScale: {
                    borderColor: 'rgba(197, 203, 206, 0.3)',
                },
                timeScale: {
                    borderColor: 'rgba(197, 203, 206, 0.3)',
                    timeVisible: true,
                    secondsVisible: false,
                },
            });

            candlestickSeries = chart.addCandlestickSeries({
                upColor: '#00ff88',
                downColor: '#ff4d4d',
                borderDownColor: '#ff4d4d',
                borderUpColor: '#00ff88',
                wickDownColor: '#ff4d4d',
                wickUpColor: '#00ff88',
            });
        }

        // Загрузка данных с Binance
        async function loadData(interval) {
            let binanceInterval;
            // Преобразуем формат интервала
            if (interval === '1h') binanceInterval = '1h';
            else if (interval === '4h') binanceInterval = '4h';
            else if (interval === '1d') binanceInterval = '1d';
            // Ограничим количество свечей, чтобы не перегружать
            const limit = 500;
            try {
                const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=TONUSDT&interval=${binanceInterval}&limit=${limit}`);
                const data = await response.json();
                const chartData = data.map(d => ({
                    time: Math.floor(d[0] / 1000),
                    open: parseFloat(d[1]),
                    high: parseFloat(d[2]),
                    low: parseFloat(d[3]),
                    close: parseFloat(d[4]),
                }));
                candlestickSeries.setData(chartData);
                chart.timeScale().fitContent();
            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
            }
        }

        // Инициализация
        initChart();
        loadData(currentInterval);

        // Обработчики кнопок
        document.querySelectorAll('.timeframe-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.timeframe-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentInterval = btn.dataset.interval;
                loadData(currentInterval);
            });
        });

        // Адаптация под изменение размера
        window.addEventListener('resize', () => {
            if (chart) {
                chart.applyOptions({ width: window.innerWidth, height: window.innerHeight - 50 });
            }
        });
    </script>
</body>
</html>
