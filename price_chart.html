<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON / USDT — перетаскивание</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: monospace;
            background: #000;
        }
        #canvasContainer {
            width: 100%;
            height: calc(100% - 60px);
            position: relative;
            background: 
                linear-gradient(45deg, rgba(0, 255, 136, 0.15) 0%, rgba(0, 200, 100, 0.08) 25%, rgba(0, 255, 200, 0.12) 50%, rgba(0, 150, 80, 0.05) 75%, rgba(0, 255, 136, 0.15) 100%),
                radial-gradient(circle at 25% 25%, rgba(120, 255, 120, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 75% 75%, rgba(0, 255, 136, 0.2) 0%, transparent 50%);
            backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
            -webkit-backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
            border-bottom: 1px solid rgba(0, 255, 136, 0.3);
            box-shadow: inset 0 0 30px rgba(0, 255, 136, 0.2);
        }
        #chartCanvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
        }
        #chartCanvas:active {
            cursor: grabbing;
        }
        .timeframe-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: rgba(0, 20, 10, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 255, 136, 0.3);
            box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        .tf-btn {
            background: transparent;
            border: 1px solid rgba(0, 255, 136, 0.5);
            color: #00ff88;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-shadow: 0 0 8px #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }
        .tf-btn.active, .tf-btn:hover {
            background: rgba(0, 255, 136, 0.2);
            border-color: #00ff88;
            box-shadow: 0 0 15px #00ff88;
        }
        #loading, #error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ff88;
            display: none;
            z-index: 20;
        }
        #error { color: #ff4d4d; }
    </style>
</head>
<body>
    <div id="canvasContainer">
        <canvas id="chartCanvas"></canvas>
        <div id="loading">Загрузка данных...</div>
        <div id="error"></div>
    </div>
    <div class="timeframe-bar">
        <button class="tf-btn" data-interval="5m">5м</button>
        <button class="tf-btn" data-interval="15m">15м</button>
        <button class="tf-btn active" data-interval="1h">1ч</button>
        <button class="tf-btn" data-interval="4h">4ч</button>
        <button class="tf-btn" data-interval="1d">1д</button>
    </div>

    <script>
        // ========== НАСТРОЙКИ ГРАФИКА ==========
        const CANDLE_SETTINGS = {
            upColor: '#00ff88',
            downColor: '#ff4d4d',
            wickColor: '#00ff88',
            gridColor: 'rgba(0, 255, 136, 0.15)',
            textColor: '#00ff88',
        };

        const CHART_SETTINGS = {
            paddingLeft: 40,
            paddingRight: 40,
            paddingTop: 30,
            paddingBottom: 30,
            minZoom: 0.5,
            maxZoom: 3,
            candleWidthBase: 6,
        };

        const canvas = document.getElementById('chartCanvas');
        const ctx = canvas.getContext('2d');
        const loading = document.getElementById('loading');
        const errorDiv = document.getElementById('error');

        let chartData = [];
        let currentInterval = '1h';
        let startIndex = 0;
        let zoomLevel = 1;

        // Для перетаскивания
        let isDragging = false;
        let lastMouseX = 0;
        let dragShift = 0;               // текущее смещение при перетаскивании
        let totalDragShift = 0;           // накопленное смещение за всё перетаскивание

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }

        function drawChart() {
            if (!chartData || chartData.length === 0) return;

            resizeCanvas();

            const width = canvas.width;
            const height = canvas.height;
            const { paddingLeft, paddingRight, paddingTop, paddingBottom } = CHART_SETTINGS;

            const candleWidth = CHART_SETTINGS.candleWidthBase * zoomLevel;
            const visibleCount = Math.floor((width - paddingLeft - paddingRight) / candleWidth);
            if (visibleCount < 1) return;

            const endIndex = Math.min(startIndex + visibleCount + 2, chartData.length);
            const visibleData = chartData.slice(startIndex, endIndex);
            if (visibleData.length === 0) return;

            let minPrice = Math.min(...visibleData.map(d => d.low));
            let maxPrice = Math.max(...visibleData.map(d => d.high));
            const priceRange = maxPrice - minPrice;
            minPrice -= priceRange * 0.05;
            maxPrice += priceRange * 0.05;
            if (minPrice === maxPrice) {
                minPrice -= 0.01;
                maxPrice += 0.01;
            }

            ctx.clearRect(0, 0, width, height);

            // Вертикальная сетка со смещением
            ctx.strokeStyle = CANDLE_SETTINGS.gridColor;
            ctx.lineWidth = 0.5;
            for (let i = 0; i < visibleData.length; i++) {
                const x = paddingLeft + i * candleWidth + dragShift;
                if (i % 5 === 0) {
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, height);
                    ctx.stroke();
                }
            }

            // Горизонтальная сетка
            for (let i = 0; i <= 5; i++) {
                const y = paddingTop + (height - paddingTop - paddingBottom) * (i / 5);
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.stroke();
            }

            // Свечи
            visibleData.forEach((candle, i) => {
                const x = paddingLeft + i * candleWidth + dragShift;
                const w = candleWidth - 1;

                const openY = height - paddingBottom - ((candle.open - minPrice) / (maxPrice - minPrice)) * (height - paddingTop - paddingBottom);
                const closeY = height - paddingBottom - ((candle.close - minPrice) / (maxPrice - minPrice)) * (height - paddingTop - paddingBottom);
                const highY = height - paddingBottom - ((candle.high - minPrice) / (maxPrice - minPrice)) * (height - paddingTop - paddingBottom);
                const lowY = height - paddingBottom - ((candle.low - minPrice) / (maxPrice - minPrice)) * (height - paddingTop - paddingBottom);

                const isGreen = candle.close >= candle.open;
                ctx.fillStyle = isGreen ? CANDLE_SETTINGS.upColor : CANDLE_SETTINGS.downColor;
                ctx.strokeStyle = isGreen ? CANDLE_SETTINGS.upColor : CANDLE_SETTINGS.downColor;

                // Фитиль
                ctx.beginPath();
                ctx.moveTo(x + w / 2, highY);
                ctx.lineTo(x + w / 2, lowY);
                ctx.stroke();

                // Тело
                const candleTop = Math.min(openY, closeY);
                const candleBottom = Math.max(openY, closeY);
                const candleHeight = candleBottom - candleTop;

                ctx.fillRect(x, candleTop, w, candleHeight);
            });

            // Шкала цен
            ctx.fillStyle = CANDLE_SETTINGS.textColor;
            ctx.font = '12px monospace';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            for (let i = 0; i <= 5; i++) {
                const price = minPrice + (maxPrice - minPrice) * (i / 5);
                const y = paddingTop + (height - paddingTop - paddingBottom) * (1 - i / 5);
                ctx.fillText(price.toFixed(4), width - 10, y);
            }
        }

        async function loadData(interval) {
            loading.style.display = 'block';
            errorDiv.style.display = 'none';

            const limits = {
                '5m': 1000,
                '15m': 1000,
                '1h': 1000,
                '4h': 800,
                '1d': 500
            };
            const limit = limits[interval] || 500;

            try {
                const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=TONUSDT&interval=${interval}&limit=${limit}`);
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const data = await response.json();

                chartData = data.map(d => ({
                    time: parseInt(d[0]),
                    open: parseFloat(d[1]),
                    high: parseFloat(d[2]),
                    low: parseFloat(d[3]),
                    close: parseFloat(d[4])
                }));

                startIndex = 0;
                dragShift = 0;
                totalDragShift = 0;
                zoomLevel = 1;
                loading.style.display = 'none';
                drawChart();
            } catch (err) {
                loading.style.display = 'none';
                errorDiv.style.display = 'block';
                errorDiv.textContent = `Ошибка: ${err.message}`;
            }
        }

        // --- ПЕРЕТАСКИВАНИЕ (как в тесте с квадратом) ---
        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastMouseX = e.clientX;
            canvas.style.cursor = 'grabbing';
            e.preventDefault();
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - lastMouseX;
            dragShift += dx;
            lastMouseX = e.clientX;
            totalDragShift += dx;
            drawChart();
            e.preventDefault();
        });

        window.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                canvas.style.cursor = 'grab';

                const candleWidth = CHART_SETTINGS.candleWidthBase * zoomLevel;
                const shiftCandles = Math.round(totalDragShift / candleWidth);
                let newStartIndex = startIndex - shiftCandles; // при движении вправо (dragShift>0) смещаемся влево по данным

                const visibleCount = Math.floor((canvas.width - CHART_SETTINGS.paddingLeft - CHART_SETTINGS.paddingRight) / candleWidth);
                const maxStart = Math.max(0, chartData.length - visibleCount);
                if (newStartIndex < 0) newStartIndex = 0;
                if (newStartIndex > maxStart) newStartIndex = maxStart;

                startIndex = newStartIndex;
                dragShift = 0;
                totalDragShift = 0;
                drawChart();
            }
        });

        // Touch-события для мобильных
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            isDragging = true;
            lastMouseX = e.touches[0].clientX;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            const dx = e.touches[0].clientX - lastMouseX;
            dragShift += dx;
            lastMouseX = e.touches[0].clientX;
            totalDragShift += dx;
            drawChart();
        });

        window.addEventListener('touchend', (e) => {
            if (isDragging) {
                isDragging = false;
                const candleWidth = CHART_SETTINGS.candleWidthBase * zoomLevel;
                const shiftCandles = Math.round(totalDragShift / candleWidth);
                let newStartIndex = startIndex - shiftCandles;
                const visibleCount = Math.floor((canvas.width - CHART_SETTINGS.paddingLeft - CHART_SETTINGS.paddingRight) / candleWidth);
                const maxStart = Math.max(0, chartData.length - visibleCount);
                if (newStartIndex < 0) newStartIndex = 0;
                if (newStartIndex > maxStart) newStartIndex = maxStart;
                startIndex = newStartIndex;
                dragShift = 0;
                totalDragShift = 0;
                drawChart();
            }
        });

        // Зум
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            let newZoom = zoomLevel * delta;
            if (newZoom < CHART_SETTINGS.minZoom) newZoom = CHART_SETTINGS.minZoom;
            if (newZoom > CHART_SETTINGS.maxZoom) newZoom = CHART_SETTINGS.maxZoom;
            if (newZoom !== zoomLevel) {
                zoomLevel = newZoom;
                drawChart();
            }
        });

        // Кнопки таймфреймов
        document.querySelectorAll('.tf-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentInterval = btn.dataset.interval;
                loadData(currentInterval);
            });
        });

        window.addEventListener('resize', () => drawChart());

        loadData('1h');
    </script>
</body>
</html>
