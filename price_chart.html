<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON / USDT — DXcharts Lite</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #chart_container {
            width: 100%;
            height: calc(100% - 60px);
            background: #0a0a0a; /* запасной тёмный фон */
        }
        .timeframe-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: rgba(0, 20, 10, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 255, 136, 0.3);
            box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        .tf-btn {
            background: transparent;
            border: 1px solid rgba(0, 255, 136, 0.5);
            color: #00ff88;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-shadow: 0 0 8px #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
            font-size: 14px;
        }
        .tf-btn.active, .tf-btn:hover {
            background: rgba(0, 255, 136, 0.2);
            border-color: #00ff88;
            box-shadow: 0 0 15px #00ff88;
        }
        /* логотип библиотеки (можно убрать) */
        .dxcharts-watermark {
            display: none !important;
        }
    </style>
    <!-- DXcharts Lite from CDN (версия 2.0.1) -->
    <script src="https://www.unpkg.com/@devexperts/dxcharts-lite@2.0.1/dist/dxchart.min.js"></script>
    <!-- import map для генератора свечей -->
    <script type="importmap">
        {
            "imports": {
                "@devexperts/dxcharts-lite/": "https://www.unpkg.com/@devexperts/dxcharts-lite@2.0.1/"
            }
        }
    </script>
</head>
<body>
    <div id="chart_container"></div>
    <div class="timeframe-bar">
        <button class="tf-btn" data-interval="5m">5м</button>
        <button class="tf-btn" data-interval="15m">15м</button>
        <button class="tf-btn active" data-interval="1h">1ч</button>
        <button class="tf-btn" data-interval="4h">4ч</button>
        <button class="tf-btn" data-interval="1d">1д</button>
    </div>

    <script type="module">
        // Импортируем утилиту для конвертации данных (необязательно, используем свою)
        // import generateCandlesData from '@devexperts/dxcharts-lite/dist/chart/utils/candles-generator.utils';

        // Глобальный объект DXChart доступен благодаря подключённому скрипту
        const container = document.getElementById('chart_container');
        
        // Создаём экземпляр графика
        const chart = DXChart.createChart(container);
        
        // Базовая настройка внешнего вида (по желанию)
        // Доступные опции: https://devexperts.com/dxcharts/documentation-for-developers/dxcharts-lite/Chart%20Config/
        // Но оставим пока умолчания — они тёмные.

        let currentInterval = '1h';

        // Функция загрузки данных с Binance и преобразования в формат DXcharts
        async function loadData(interval) {
            try {
                // Определяем лимит в зависимости от интервала
                const limits = {
                    '5m': 500,
                    '15m': 500,
                    '1h': 500,
                    '4h': 500,
                    '1d': 365
                };
                const limit = limits[interval] || 500;
                
                const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=TONUSDT&interval=${interval}&limit=${limit}`);
                const data = await response.json();
                
                // Преобразуем свечи в формат DXcharts
                // Документация: Candle должен содержать timestamp (в секундах или миллисекундах), open, high, low, close
                const candles = data.map(d => ({
                    timestamp: Math.floor(d[0]), // Binance даёт миллисекунды, оставляем как есть
                    open: parseFloat(d[1]),
                    high: parseFloat(d[2]),
                    low: parseFloat(d[3]),
                    close: parseFloat(d[4])
                }));

                // Создаём объект инструмента (нужен для отображения точности цены)
                const instrument = {
                    symbol: 'TONUSDT',
                    priceIncrements: [0.001] // шаг цены, можно подобрать точнее
                };

                // Передаём данные в график
                // chart.chartComponent.setMainSeries({ candles, instrument }); // старый вариант
                // В новых версиях может быть chart.setData({ candles, instrument }) — проверим оба
                if (chart.setData) {
                    chart.setData({ candles, instrument });
                } else if (chart.chartComponent) {
                    chart.chartComponent.setMainSeries({ candles, instrument });
                } else {
                    console.warn('Неизвестный API, пробуем прямой метод');
                    // fallback
                    chart.candles = candles;
                }

                console.log(`Загружено ${candles.length} свечей для ${interval}`);
            } catch (e) {
                console.error('Ошибка загрузки:', e);
            }
        }

        // Загружаем начальные данные
        loadData('1h');

        // Обработчики кнопок таймфреймов
        document.querySelectorAll('.tf-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                if (btn.classList.contains('active')) return;
                document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentInterval = btn.dataset.interval;
                loadData(currentInterval);
            });
        });

        // По желанию: адаптация под ресайз окна
        window.addEventListener('resize', () => {
            // DXcharts сам подстраивается под размер контейнера, если не задан fixedSize
            // поэтому ничего делать не нужно
        });
    </script>
</body>
</html>
