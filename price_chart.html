<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>График / USDT — свечной график</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'JetBrains Mono', 'Roboto Mono', 'Source Code Pro', monospace;
            background: #0b0b0f;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
        }
        .top-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            height: 64px;
            background: #0b0b0f;
            border-bottom: 1px solid #2a2a2a;
        }
        .pair-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .pair-row {
            display: flex;
            align-items: baseline;
            gap: 6px;
        }
        .pair-name {
            font-size: 18px;
            font-weight: 500;
            color: #ffffff;
        }
        .current-price {
            font-size: 20px;
            font-weight: 400;
            font-family: 'JetBrains Mono', 'Roboto Mono', monospace;
            letter-spacing: -0.5px;
            transition: color 0.1s ease;
        }
        .positive {
            color: #00e676;
        }
        .negative {
            color: #ff5252;
        }
        .price-change {
            font-size: 14px;
            font-weight: 400;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.05);
            align-self: flex-start;
            margin-top: 2px;
            font-family: 'JetBrains Mono', 'Roboto Mono', monospace;
            letter-spacing: -0.3px;
        }
        .price-change.positive {
            color: #00e676;
        }
        .price-change.negative {
            color: #ff5252;
        }
        #canvasContainer {
            flex: 1;
            position: relative;
            background: #0b0b0f;
        }
        #chartCanvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
            touch-action: none;
        }
        .timeframe-bar {
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: #0b0b0f;
            border-top: 1px solid #2a2a2a;
        }
        .tf-btn {
            background: transparent;
            border: 1px solid #3a3a4a;
            color: #c0c0d0;
            padding: 8px 18px;
            border-radius: 24px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 14px;
            font-family: 'JetBrains Mono', 'Roboto Mono', monospace;
        }
        .tf-btn.active, .tf-btn:hover {
            background: #2a2a3a;
            border-color: #00e676;
            color: #ffffff;
        }
        .go-last-btn {
            background: transparent;
            border: 1px solid #3a3a4a;
            color: #c0c0d0;
            padding: 8px 18px;
            border-radius: 24px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 18px;
            line-height: 1;
        }
        .go-last-btn:hover {
            background: #2a2a3a;
            border-color: #00e676;
            color: #ffffff;
        }
        #loading, #error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00e676;
            display: none;
            z-index: 20;
            font-size: 14px;
        }
        #error { color: #ff5252; }
    </style>
</head>
<body>
    <div class="top-panel">
        <div class="pair-info">
            <div class="pair-row">
                <span class="pair-name" id="pairName">BTC/USDT</span>
                <span class="current-price" id="priceDisplay">0.0000</span>
            </div>
            <span class="price-change" id="priceChangeDisplay">+0.00%</span>
        </div>
    </div>

    <div id="canvasContainer">
        <canvas id="chartCanvas"></canvas>
        <div id="loading">Загрузка данных...</div>
        <div id="error"></div>
    </div>

    <div class="timeframe-bar">
        <button class="tf-btn" data-interval="5m">5м</button>
        <button class="tf-btn" data-interval="15m">15м</button>
        <button class="tf-btn active" data-interval="1h">1ч</button>
        <button class="tf-btn" data-interval="4h">4ч</button>
        <button class="tf-btn" data-interval="1d">1д</button>
        <button class="go-last-btn" id="goLastBtn">→|</button>
    </div>

    <script>
        // ========== ПОЛУЧАЕМ СИМВОЛ ИЗ URL ==========
        const urlParams = new URLSearchParams(window.location.search);
        let symbol = urlParams.get('symbol') || 'TONUSDT'; // по умолчанию TONUSDT

        // Обновляем отображаемое название пары (например, BTC/USDT)
        const pairNameElement = document.getElementById('pairName');
        if (symbol.includes('USDT')) {
            pairNameElement.textContent = symbol.replace('USDT', '/USDT');
        } else {
            pairNameElement.textContent = symbol; // на всякий случай
        }

        // ========== НАСТРОЙКИ ГРАФИКА ==========
        const CANDLE_SETTINGS = {
            upColor: '#00e676',
            downColor: '#ff5252',
            wickColor: '#a0a0b0',
            gridColor: '#2a2a2a',
            textColor: '#ffffff',
        };

        const CHART_SETTINGS = {
            paddingLeft: 45,
            paddingRight: 45,
            paddingTop: 25,
            paddingBottom: 70,
            minZoom: 0.5,
            maxZoom: 3,
            candleWidthBase: 16,
            gapBetweenCandles: 2,
            minBodyHeight: 2,
            gridVerticalStep: 4,
            gridHorizontalCount: 15,
        };

        const LABEL_CONFIG = {
            '5m':  { step: 12, pattern: ['hour'] },
            '15m': { step: 12, pattern: ['hour'] },
            '1h':  { step: 12, pattern: ['hour', 'day', 'hour', 'month'] },
            '4h':  { step: 12, pattern: ['day', 'month', 'day', 'day'] },
            '1d':  { step: 12, pattern: ['month', 'day', 'month', 'day', 'year', 'day'] }
        };

        const HIGH_LOW_SETTINGS = {
            enabled: true,
            lineColor: '#f0f0f0',
            lineWidth: 1,
            fontSize: 12,
            textColor: '#f0f0f0',
        };

        const LAST_CANDLE_LINE_SETTINGS = {
            enabled: true,
            lineColor: '#f0f0f0',
            lineWidth: 1,
            segmentLength: 8,
            gapLength: 2,
            boxPadding: 6,
            boxBgColor: '#1e1e2e',
            boxBorderColor: '#4a4a5a',
            textColor: '#ffffff',
            fontSize: 12,
        };

        const CROSSHAIR_SETTINGS = {
            lineColor: '#f0f0f0',
            lineWidth: 0.8,
            dashPattern: [5, 4],
            infoBgColor: '#1e1e2e',
            infoBorderColor: '#4a4a5a',
            infoTextColor: '#ffffff',
            infoFontSize: 11,
            infoPadding: 8,
            rightBoxBgColor: '#2d2d3a',
            rightBoxTextColor: '#ffffff',
            rightBoxFontSize: 12,
            rightBoxWidth: 90,
            rightBoxPadding: 6,
        };

        const FIRST_BUTTON_SETTINGS = {
            width: 30,
            height: 20,
            bgColor: '#3a3a4a',
            textColor: '#ffffff',
            fontSize: 14,
            text: '>|',
            gapFromPriceBox: 4,
        };

        const REFRESH_INTERVALS = {
            '5m': 2000,
            '15m': 2000,
            '1h': 2000,
            '4h': 2000,
            '1d': 2000
        };

        const canvas = document.getElementById('chartCanvas');
        const ctx = canvas.getContext('2d');
        const loading = document.getElementById('loading');
        const errorDiv = document.getElementById('error');
        const goLastBtn = document.getElementById('goLastBtn');
        const priceDisplay = document.getElementById('priceDisplay');
        const priceChangeDisplay = document.getElementById('priceChangeDisplay');
        const canvasContainer = document.getElementById('canvasContainer');

        // Учёт devicePixelRatio для чёткости
        function resizeCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const rect = canvasContainer.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            canvas.style.width = rect.width + 'px';
            canvas.style.height = rect.height + 'px';
            ctx.setTransform(1, 0, 0, 1, 0, 0);
            ctx.scale(dpr, dpr);
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'left';
            ctx.shadowColor = 'rgba(255,255,255,0.4)';
            ctx.shadowBlur = 4;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
        }

        // Остальные переменные
        let chartData = [];
        let currentInterval = '1h';
        let startIndex = 0;
        let zoomLevel = 1;
        const EXTRA_SPACE = 15;
        let isDragging = false;
        let lastClientX = 0;
        let dragOffset = 0;
        let refreshIntervalId = null;
        let limit = 1000;
        let animLastCandle = null;
        let animFrame = null;

        // Переменные для мультитач-зума
        let pinchActive = false;
        let initialPinchDistance = 0;
        let initialZoom = 1;
        let centerCandleIndex = null;

        // Переменные для перекрестия
        let crosshairVisible = false;
        let crosshairX = 0;
        let crosshairY = 0;
        let crosshairCandleIndex = -1;
        let crosshairPrice = 0;

        // Для определения tap/drag
        let touchStartTime = 0;
        let touchStartX = 0, touchStartY = 0;
        const TAP_DELAY = 200;
        const TAP_DISTANCE = 10;

        // Бесконечная прокрутка
        let isLoadingMore = false;

        // Кнопка перехода
        let firstButtonRect = null;

        // Сохранённый интервал
        const savedInterval = localStorage.getItem('selectedInterval');
        if (savedInterval && ['5m','15m','1h','4h','1d'].includes(savedInterval)) {
            currentInterval = savedInterval;
        }

        // Вспомогательная функция форматирования цены с пробелами между тысячами
        function formatPrice(price) {
            let parts = price.toFixed(4).split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
            return parts.join('.');
        }

        function getVisibleCount() {
            const totalWidthPerCandle = CHART_SETTINGS.candleWidthBase * zoomLevel + CHART_SETTINGS.gapBetweenCandles;
            return Math.floor((canvas.width / window.devicePixelRatio - CHART_SETTINGS.paddingLeft - CHART_SETTINGS.paddingRight) / totalWidthPerCandle);
        }

        function getMaxStart() {
            const visibleCount = getVisibleCount();
            return Math.max(0, chartData.length - visibleCount + EXTRA_SPACE);
        }

        function setToLastCandle() {
            if (!chartData.length) return;
            const visibleCount = getVisibleCount();
            startIndex = Math.max(0, chartData.length - visibleCount + EXTRA_SPACE);
            dragOffset = 0;
            drawChart();
        }

        function updatePriceColor(candle) {
            const isGreen = candle.close >= candle.open;
            priceDisplay.classList.remove('positive', 'negative');
            priceDisplay.classList.add(isGreen ? 'positive' : 'negative');
        }

        function drawLastCandleLine(x, y, price, isLastVisible, showButton) {
            const { lineWidth, segmentLength, gapLength, boxPadding, boxBgColor, boxBorderColor, textColor, fontSize } = LAST_CANDLE_LINE_SETTINGS;
            const width = canvas.width / window.devicePixelRatio;
            const height = canvas.height / window.devicePixelRatio;
            const { paddingBottom } = CHART_SETTINGS;

            const text = formatPrice(price);
            ctx.font = `500 ${fontSize}px 'JetBrains Mono', 'Roboto Mono', monospace`;
            ctx.letterSpacing = '-0.02em';
            ctx.shadowBlur = 4;
            const textWidth = ctx.measureText(text).width;
            let boxWidth = textWidth + 2 * boxPadding;
            let boxHeight = fontSize + 2 * boxPadding;
            let boxX = width - boxWidth;
            let boxY = y - boxHeight / 2;

            boxY = Math.max(0, Math.min(boxY, height - boxHeight));

            if (boxX < 0) {
                boxX = 0;
                if (boxX + boxWidth > width) {
                    boxWidth = width;
                }
            }

            if (isLastVisible) {
                const startX = x;
                const endX = boxX;
                const distance = endX - startX;
                if (distance > 0) {
                    ctx.save();
                    ctx.strokeStyle = '#f0f0f0';
                    ctx.lineWidth = lineWidth;
                    ctx.setLineDash([segmentLength, gapLength]);
                    ctx.beginPath();
                    ctx.moveTo(startX, y);
                    ctx.lineTo(endX, y);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            ctx.save();
            ctx.fillStyle = boxBgColor;
            ctx.shadowBlur = 8;
            ctx.shadowOffsetY = 2;
            ctx.beginPath();
            ctx.roundRect(boxX, boxY, boxWidth, boxHeight, 6);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = boxBorderColor;
            ctx.lineWidth = 0.8;
            ctx.stroke();

            ctx.fillStyle = textColor;
            ctx.shadowBlur = 4;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.save();
            ctx.beginPath();
            ctx.rect(boxX, boxY, boxWidth, boxHeight);
            ctx.clip();
            ctx.fillText(text, boxX + boxPadding, boxY + boxHeight / 2);
            ctx.restore();

            if (showButton) {
                const btnW = FIRST_BUTTON_SETTINGS.width;
                const btnH = FIRST_BUTTON_SETTINGS.height;
                let btnX = boxX - btnW - FIRST_BUTTON_SETTINGS.gapFromPriceBox;
                let btnY = boxY + (boxHeight - btnH) / 2;

                if (btnX < 0) btnX = 0;

                ctx.save();
                ctx.fillStyle = FIRST_BUTTON_SETTINGS.bgColor;
                ctx.shadowBlur = 6;
                ctx.shadowOffsetY = 1;
                ctx.beginPath();
                ctx.roundRect(btnX, btnY, btnW, btnH, 4);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#5a5a6a';
                ctx.lineWidth = 0.5;
                ctx.stroke();

                ctx.fillStyle = FIRST_BUTTON_SETTINGS.textColor;
                ctx.font = `${FIRST_BUTTON_SETTINGS.fontSize}px 'JetBrains Mono', monospace`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowBlur = 4;
                ctx.fillText(FIRST_BUTTON_SETTINGS.text, btnX + btnW / 2, btnY + btnH / 2);
                ctx.restore();

                firstButtonRect = { x: btnX, y: btnY, w: btnW, h: btnH };
            } else {
                firstButtonRect = null;
            }
        }

        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            this.moveTo(x + r, y);
            this.lineTo(x + w - r, y);
            this.quadraticCurveTo(x + w, y, x + w, y + r);
            this.lineTo(x + w, y + h - r);
            this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            this.lineTo(x + r, y + h);
            this.quadraticCurveTo(x, y + h, x, y + h - r);
            this.lineTo(x, y + r);
            this.quadraticCurveTo(x, y, x + r, y);
            this.closePath();
            return this;
        };

        function formatLabelByType(timestamp, type) {
            const date = new Date(timestamp);
            const monthNames = ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];

            switch (type) {
                case 'hour':
                    const h = date.getHours().toString().padStart(2, '0');
                    return `${h}:00`;
                case 'day':
                    return date.getDate().toString();
                case 'month':
                    return monthNames[date.getMonth()];
                case 'year':
                    return date.getFullYear().toString();
                default:
                    return '';
            }
        }

        function adjustDailyTime(timestamp) {
            return timestamp - 3600000;
        }

        function findCandleByX(x) {
            if (!chartData.length) return -1;
            const { paddingLeft, gapBetweenCandles } = CHART_SETTINGS;
            const candleWidth = CHART_SETTINGS.candleWidthBase * zoomLevel;
            const totalWidthPerCandle = candleWidth + gapBetweenCandles;

            const candleIndexFloat = (x - paddingLeft - dragOffset) / totalWidthPerCandle + startIndex;
            const index = Math.round(candleIndexFloat);
            if (index >= 0 && index < chartData.length) {
                return index;
            }
            return -1;
        }

        function updateCrosshairFromPoint(canvasX, canvasY) {
            const { paddingLeft, paddingRight, paddingTop, paddingBottom } = CHART_SETTINGS;
            const width = canvas.width / window.devicePixelRatio;
            const height = canvas.height / window.devicePixelRatio;
            if (canvasX < paddingLeft || canvasX > width - paddingRight || canvasY < paddingTop || canvasY > height - paddingBottom) {
                return;
            }

            crosshairX = canvasX;
            crosshairY = canvasY;

            const index = findCandleByX(canvasX);
            if (index !== -1) {
                crosshairCandleIndex = index;
                const candleWidth = CHART_SETTINGS.candleWidthBase * zoomLevel;
                const totalWidthPerCandle = candleWidth + CHART_SETTINGS.gapBetweenCandles;
                crosshairX = CHART_SETTINGS.paddingLeft + (index - startIndex) * totalWidthPerCandle + dragOffset + candleWidth / 2;
            } else {
                crosshairCandleIndex = -1;
                crosshairX = canvasX;
            }

            const candleWidth = CHART_SETTINGS.candleWidthBase * zoomLevel;
            const totalWidthPerCandle = candleWidth + CHART_SETTINGS.gapBetweenCandles;
            const visibleCount = getVisibleCount();
            const extraCandles = Math.ceil(Math.abs(dragOffset) / totalWidthPerCandle) + 5;
            const drawStart = Math.max(0, startIndex - extraCandles);
            const drawEnd = Math.min(chartData.length, startIndex + visibleCount + extraCandles);
            const visibleData = chartData.slice(drawStart, drawEnd);
            if (visibleData.length > 0) {
                let minPrice = Math.min(...visibleData.map(d => d.low));
                let maxPrice = Math.max(...visibleData.map(d => d.high));
                const priceRange = maxPrice - minPrice;
                minPrice -= priceRange * 0.05;
                maxPrice += priceRange * 0.05;
                if (minPrice === maxPrice) {
                    minPrice -= 0.01;
                    maxPrice += 0.01;
                }
                const chartHeight = height - paddingTop - paddingBottom;
                crosshairPrice = maxPrice - (canvasY - paddingTop) / chartHeight * (maxPrice - minPrice);
            }
        }

        async function loadOlderCandles() {
            if (isLoadingMore || !chartData.length) return;
            isLoadingMore = true;

            const oldestCandle = chartData[0];
            const endTime = oldestCandle.time - 1;

            try {
                const response = await fetch(
                    `https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${currentInterval}&endTime=${endTime}&limit=500`
                );
                if (!response.ok) throw new Error('Ошибка загрузки');
                const data = await response.json();
                if (data.length === 0) {
                    console.log('Больше нет данных');
                    return;
                }

                const olderCandles = data.map(d => ({
                    time: parseInt(d[0]),
                    open: parseFloat(d[1]),
                    high: parseFloat(d[2]),
                    low: parseFloat(d[3]),
                    close: parseFloat(d[4])
                }));

                chartData = [...olderCandles, ...chartData];
                startIndex += olderCandles.length;
                drawChart();
            } catch (err) {
                console.warn('Не удалось загрузить старые свечи:', err);
            } finally {
                isLoadingMore = false;
            }
        }

        function drawChart() {
            if (!chartData || chartData.length === 0) return;

            resizeCanvas();

            const width = canvas.width / window.devicePixelRatio;
            const height = canvas.height / window.devicePixelRatio;
            const { paddingLeft, paddingRight, paddingTop, paddingBottom, gapBetweenCandles, minBodyHeight, gridVerticalStep, gridHorizontalCount } = CHART_SETTINGS;

            const candleWidth = CHART_SETTINGS.candleWidthBase * zoomLevel;
            const totalWidthPerCandle = candleWidth + gapBetweenCandles;
            const visibleCount = getVisibleCount();
            if (visibleCount < 1) return;

            const maxStart = getMaxStart();
            if (startIndex > maxStart) startIndex = maxStart;
            if (startIndex < 0) startIndex = 0;

            const extraCandles = Math.ceil(Math.abs(dragOffset) / totalWidthPerCandle) + 5;
            const drawStart = Math.max(0, startIndex - extraCandles);
            const drawEnd = Math.min(chartData.length, startIndex + visibleCount + extraCandles);
            let visibleData = chartData.slice(drawStart, drawEnd);
            if (visibleData.length === 0) return;

            if (animLastCandle) {
                const now = performance.now();
                const progress = Math.min((now - animLastCandle.startTime) / animLastCandle.duration, 1);
                const oldC = animLastCandle.oldCandle;
                const newC = animLastCandle.newCandle;

                const interpCandle = {
                    time: newC.time,
                    open: oldC.open + (newC.open - oldC.open) * progress,
                    high: oldC.high + (newC.high - oldC.high) * progress,
                    low: oldC.low + (newC.low - oldC.low) * progress,
                    close: oldC.close + (newC.close - oldC.close) * progress,
                };

                if (visibleData.length > 0) {
                    visibleData[visibleData.length - 1] = interpCandle;
                }

                if (progress < 1) {
                    animFrame = requestAnimationFrame(() => drawChart());
                } else {
                    animLastCandle = null;
                    animFrame = null;
                }
            }

            const baseX = paddingLeft + (drawStart - startIndex) * totalWidthPerCandle + dragOffset;

            const modifiedData = visibleData.map((candle, idx) => {
                if (idx === 0) return { ...candle };
                const prevClose = visibleData[idx - 1].close;
                return {
                    ...candle,
                    open: prevClose,
                };
            });

            let minPriceVisible = Math.min(...visibleData.map(d => d.low));
            let maxPriceVisible = Math.max(...visibleData.map(d => d.high));
            const priceRange = maxPriceVisible - minPriceVisible;
            minPriceVisible -= priceRange * 0.05;
            maxPriceVisible += priceRange * 0.05;
            if (minPriceVisible === maxPriceVisible) {
                minPriceVisible -= 0.01;
                maxPriceVisible += 0.01;
            }

            ctx.clearRect(0, 0, width, height);

            // Сетка
            ctx.strokeStyle = CANDLE_SETTINGS.gridColor;
            ctx.lineWidth = 0.3;
            const stepPx = totalWidthPerCandle * gridVerticalStep;
            const firstLineX = Math.ceil((baseX - paddingLeft) / stepPx) * stepPx + paddingLeft;
            for (let x = firstLineX; x < width - paddingRight; x += stepPx) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }

            for (let i = 0; i <= gridHorizontalCount; i++) {
                const y = paddingTop + (height - paddingTop - paddingBottom) * (i / gridHorizontalCount);
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.strokeStyle = CANDLE_SETTINGS.gridColor;
                ctx.stroke();
            }

            // Свечи
            modifiedData.forEach((candle, i) => {
                const x = baseX + i * totalWidthPerCandle;
                const w = candleWidth;

                const openY = height - paddingBottom - ((candle.open - minPriceVisible) / (maxPriceVisible - minPriceVisible)) * (height - paddingTop - paddingBottom);
                const closeY = height - paddingBottom - ((candle.close - minPriceVisible) / (maxPriceVisible - minPriceVisible)) * (height - paddingTop - paddingBottom);
                const highY = height - paddingBottom - ((candle.high - minPriceVisible) / (maxPriceVisible - minPriceVisible)) * (height - paddingTop - paddingBottom);
                const lowY = height - paddingBottom - ((candle.low - minPriceVisible) / (maxPriceVisible - minPriceVisible)) * (height - paddingTop - paddingBottom);

                const isGreen = candle.close >= candle.open;
                ctx.fillStyle = isGreen ? CANDLE_SETTINGS.upColor : CANDLE_SETTINGS.downColor;
                ctx.strokeStyle = isGreen ? CANDLE_SETTINGS.upColor : CANDLE_SETTINGS.downColor;

                // Фитиль
                ctx.beginPath();
                ctx.moveTo(x + w / 2, highY);
                ctx.lineTo(x + w / 2, lowY);
                ctx.strokeStyle = CANDLE_SETTINGS.wickColor;
                ctx.lineWidth = 0.5;
                ctx.stroke();

                // Тело свечи
                const bodyTop = Math.min(openY, closeY);
                const bodyBottom = Math.max(openY, closeY);
                const bodyHeight = bodyBottom - bodyTop;

                if (bodyHeight < minBodyHeight) {
                    const midY = (openY + closeY) / 2;
                    ctx.fillRect(x, midY - minBodyHeight / 2, w, minBodyHeight);
                } else {
                    ctx.fillRect(x, bodyTop, w, bodyHeight);
                }

                // Лёгкое свечение (дополнительная тонкая линия)
                ctx.save();
                ctx.shadowColor = isGreen ? '#00e676' : '#ff5252';
                ctx.shadowBlur = 8;
                ctx.strokeStyle = 'transparent';
                ctx.strokeRect(x, bodyTop, w, bodyHeight);
                ctx.restore();
            });

            // High/Low линии
            if (HIGH_LOW_SETTINGS.enabled && visibleData.length > 0) {
                const highPrice = Math.max(...visibleData.map(d => d.high));
                const lowPrice = Math.min(...visibleData.map(d => d.low));

                const highIdxInVisible = visibleData.map(d => d.high).lastIndexOf(highPrice);
                const lowIdxInVisible = visibleData.map(d => d.low).lastIndexOf(lowPrice);

                if (highIdxInVisible !== -1) {
                    const highX = baseX + highIdxInVisible * totalWidthPerCandle + candleWidth / 2;
                    const highY = height - paddingBottom - ((highPrice - minPriceVisible) / (maxPriceVisible - minPriceVisible)) * (height - paddingTop - paddingBottom);
                    drawPriceLine(highX, highY, highPrice, width, paddingLeft, paddingRight);
                }

                if (lowIdxInVisible !== -1) {
                    const lowX = baseX + lowIdxInVisible * totalWidthPerCandle + candleWidth / 2;
                    const lowY = height - paddingBottom - ((lowPrice - minPriceVisible) / (maxPriceVisible - minPriceVisible)) * (height - paddingTop - paddingBottom);
                    drawPriceLine(lowX, lowY, lowPrice, width, paddingLeft, paddingRight);
                }
            }

            // Шкала цен — теперь 8 значений для большей детализации
            const PRICE_SCALE_RIGHT = 15;
            ctx.shadowBlur = 4;
            ctx.fillStyle = CANDLE_SETTINGS.textColor;
            ctx.font = '500 11px "JetBrains Mono", "Roboto Mono", monospace';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.letterSpacing = '-0.02em';
            for (let i = 0; i <= 8; i++) {
                const price = minPriceVisible + (maxPriceVisible - minPriceVisible) * (i / 8);
                const y = paddingTop + (height - paddingTop - paddingBottom) * (1 - i / 8);
                ctx.fillText(formatPrice(price), width - PRICE_SCALE_RIGHT, y);
            }

            // Линия последней свечи и кнопка
            if (LAST_CANDLE_LINE_SETTINGS.enabled && chartData.length > 0) {
                const lastIndex = chartData.length - 1;

                let lastPrice;
                if (lastIndex >= drawStart && lastIndex < drawEnd) {
                    lastPrice = visibleData[lastIndex - drawStart].close;
                } else {
                    lastPrice = chartData[lastIndex].close;
                }

                const lastCandleCenterX = paddingLeft + (lastIndex - startIndex) * totalWidthPerCandle + dragOffset + candleWidth / 2;
                const lastCandleLeft = lastCandleCenterX - candleWidth / 2;
                const lastCandleRight = lastCandleCenterX + candleWidth / 2;

                const isLastVisible = (lastCandleRight > paddingLeft && lastCandleLeft < width - paddingRight);
                const showButton = (lastCandleLeft > width - paddingRight);

                const y = height - paddingBottom - ((lastPrice - minPriceVisible) / (maxPriceVisible - minPriceVisible)) * (height - paddingTop - paddingBottom);

                if (isLastVisible) {
                    drawLastCandleLine(lastCandleCenterX, y, lastPrice, true, showButton);
                } else {
                    drawLastCandleLine(0, y, lastPrice, false, showButton);
                }
            }

            // Временные метки снизу
            ctx.save();
            ctx.fillStyle = '#a0a0b0';
            ctx.font = '10px "JetBrains Mono", "Roboto Mono", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 2;
            const labelY = height - paddingBottom / 2;

            const config = LABEL_CONFIG[currentInterval] || { step: 12, pattern: ['hour'] };
            const step = config.step;
            const pattern = config.pattern;

            let seenMonths = new Set();
            let seenYears = new Set();

            for (let i = 0; i < visibleData.length; i++) {
                const globalIndex = drawStart + i;
                const distFromLast = chartData.length - 1 - globalIndex;
                if (distFromLast % step === 0) {
                    let timestamp = visibleData[i].time;
                    if (currentInterval === '1d') {
                        timestamp = adjustDailyTime(timestamp);
                    }
                    const patternIndex = Math.floor(distFromLast / step) % pattern.length;
                    let type = pattern[patternIndex];
                    let label = formatLabelByType(timestamp, type);
                    let skipDueToUniqueness = false;

                    if (type === 'year') {
                        const year = new Date(timestamp).getFullYear();
                        if (seenYears.has(year)) {
                            skipDueToUniqueness = true;
                        } else {
                            seenYears.add(year);
                        }
                    } else if (type === 'month') {
                        const date = new Date(timestamp);
                        const monthKey = `${date.getFullYear()}-${date.getMonth()}`;
                        if (seenMonths.has(monthKey)) {
                            skipDueToUniqueness = true;
                        } else {
                            seenMonths.add(monthKey);
                        }
                    }

                    if (skipDueToUniqueness) {
                        type = 'day';
                        label = formatLabelByType(timestamp, type);
                    }

                    if (label) {
                        const x = baseX + i * totalWidthPerCandle + candleWidth / 2;
                        ctx.fillText(label, x, labelY);
                    }
                }
            }
            ctx.restore();

            // Перекрестие
            if (crosshairVisible) {
                drawCrosshair();
            }
        }

        function drawPriceLine(x, y, price, canvasWidth, paddingLeft, paddingRight) {
            const midX = paddingLeft + (canvasWidth - paddingLeft - paddingRight) / 2;
            const lineLength = 30;

            ctx.save();
            ctx.strokeStyle = HIGH_LOW_SETTINGS.lineColor;
            ctx.lineWidth = HIGH_LOW_SETTINGS.lineWidth;
            ctx.fillStyle = HIGH_LOW_SETTINGS.textColor;
            ctx.font = `500 ${HIGH_LOW_SETTINGS.fontSize}px "JetBrains Mono", monospace`;
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 4;
            ctx.letterSpacing = '-0.02em';

            if (x > midX) {
                const endX = x - lineLength;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(endX, y);
                ctx.stroke();
                ctx.textAlign = 'right';
                ctx.fillText(formatPrice(price), endX - 2, y);
            } else {
                const endX = x + lineLength;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(endX, y);
                ctx.stroke();
                ctx.textAlign = 'left';
                ctx.fillText(formatPrice(price), endX + 2, y);
            }
            ctx.restore();
        }

        function drawCrosshair() {
            const width = canvas.width / window.devicePixelRatio;
            const height = canvas.height / window.devicePixelRatio;
            const { paddingLeft, paddingRight, paddingTop, paddingBottom } = CHART_SETTINGS;
            const { lineColor, lineWidth, dashPattern, infoBgColor, infoBorderColor, infoTextColor, infoFontSize, infoPadding } = CROSSHAIR_SETTINGS;

            ctx.save();

            ctx.strokeStyle = lineColor;
            ctx.lineWidth = lineWidth;
            ctx.setLineDash(dashPattern);
            ctx.beginPath();
            ctx.moveTo(crosshairX, paddingTop);
            ctx.lineTo(crosshairX, height - paddingBottom);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(paddingLeft, crosshairY);
            ctx.lineTo(width - paddingRight, crosshairY);
            ctx.stroke();
            ctx.setLineDash([]);

            // Правый прямоугольник
            const lastPrice = chartData.length ? chartData[chartData.length - 1].close : 0;
            const percentChange = ((crosshairPrice - lastPrice) / lastPrice * 100).toFixed(2);
            const percentSign = percentChange >= 0 ? '+' : '';
            const percentText = `${percentSign}${percentChange}%`;
            const priceText = formatPrice(crosshairPrice);

            ctx.font = `500 ${CROSSHAIR_SETTINGS.rightBoxFontSize}px 'JetBrains Mono', monospace`;
            const priceWidth = ctx.measureText(priceText).width;
            const percentWidth = ctx.measureText(percentText).width;
            const boxWidth = Math.max(priceWidth, percentWidth) + 2 * CROSSHAIR_SETTINGS.rightBoxPadding;
            const boxHeight = CROSSHAIR_SETTINGS.rightBoxFontSize * 2 + 3 * CROSSHAIR_SETTINGS.rightBoxPadding;
            const boxX = width - boxWidth;
            const boxY = crosshairY - boxHeight / 2;
            const finalBoxY = Math.max(paddingTop, Math.min(boxY, height - paddingBottom - boxHeight));

            ctx.fillStyle = CROSSHAIR_SETTINGS.rightBoxBgColor;
            ctx.shadowBlur = 8;
            ctx.shadowOffsetY = 2;
            ctx.beginPath();
            ctx.roundRect(boxX, finalBoxY, boxWidth, boxHeight, 6);
            ctx.fill();
            ctx.shadowBlur = 0;
            ctx.strokeStyle = '#5a5a6a';
            ctx.lineWidth = 0.5;
            ctx.stroke();

            ctx.fillStyle = CROSSHAIR_SETTINGS.rightBoxTextColor;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 4;
            ctx.fillText(priceText, boxX + boxWidth / 2, finalBoxY + CROSSHAIR_SETTINGS.rightBoxPadding + CROSSHAIR_SETTINGS.rightBoxFontSize / 2);
            ctx.fillStyle = percentChange >= 0 ? CANDLE_SETTINGS.upColor : CANDLE_SETTINGS.downColor;
            ctx.fillText(percentText, boxX + boxWidth / 2, finalBoxY + CROSSHAIR_SETTINGS.rightBoxPadding * 2 + CROSSHAIR_SETTINGS.rightBoxFontSize * 1.5);

            // Информационный блок о свече
            if (crosshairCandleIndex >= 0 && crosshairCandleIndex < chartData.length) {
                const candle = chartData[crosshairCandleIndex];
                const time = new Date(candle.time);
                const timeStr = `${time.getUTCFullYear()}/${(time.getUTCMonth()+1).toString().padStart(2,'0')}/${time.getUTCDate().toString().padStart(2,'0')} ${time.getUTCHours().toString().padStart(2,'0')}:${time.getUTCMinutes().toString().padStart(2,'0')}`;
                const open = formatPrice(candle.open);
                const high = formatPrice(candle.high);
                const low = formatPrice(candle.low);
                const close = formatPrice(candle.close);
                const change = (candle.close - candle.open).toFixed(4);
                const changeFormatted = (candle.close - candle.open) >= 0 ? '+' + change : change;
                const changePercent = ((candle.close - candle.open) / candle.open * 100).toFixed(2);
                const changePercentFormatted = (candle.close - candle.open) >= 0 ? '+' + changePercent : changePercent;
                const range = (candle.high - candle.low).toFixed(4);
                const rangePercent = ((candle.high - candle.low) / candle.open * 100).toFixed(2);

                const lines = [
                    { label: 'Time', value: timeStr },
                    { label: 'Open', value: open },
                    { label: 'High', value: high },
                    { label: 'Low', value: low },
                    { label: 'Close', value: close },
                    { label: 'Change', value: `${changeFormatted} (${changePercentFormatted}%)` },
                    { label: 'Range', value: `${range} (${rangePercent}%)` }
                ];

                ctx.font = `${infoFontSize}px 'JetBrains Mono', monospace`;
                const lineHeight = infoFontSize + 2;
                // Измеряем максимальную ширину метки и значения
                let maxLabelWidth = 0;
                let maxValueWidth = 0;
                lines.forEach(line => {
                    const labelWidth = ctx.measureText(line.label + ' ').width;
                    const valueWidth = ctx.measureText(line.value).width;
                    maxLabelWidth = Math.max(maxLabelWidth, labelWidth);
                    maxValueWidth = Math.max(maxValueWidth, valueWidth);
                });
                const blockWidth = maxLabelWidth + maxValueWidth + 3 * infoPadding;
                const blockHeight = lines.length * lineHeight + 2 * infoPadding;
                let blockX = crosshairX + 15;
                let blockY = crosshairY - blockHeight - 10;

                if (blockX + blockWidth > width - paddingRight) blockX = crosshairX - blockWidth - 15;
                if (blockY < paddingTop) blockY = crosshairY + 15;
                if (blockY + blockHeight > height - paddingBottom) blockY = crosshairY - blockHeight - 10;

                ctx.fillStyle = infoBgColor;
                ctx.shadowBlur = 8;
                ctx.shadowOffsetY = 2;
                ctx.beginPath();
                ctx.roundRect(blockX, blockY, blockWidth, blockHeight, 8);
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = infoBorderColor;
                ctx.lineWidth = 0.5;
                ctx.stroke();

                ctx.fillStyle = infoTextColor;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.shadowBlur = 4;

                for (let i = 0; i < lines.length; i++) {
                    const line = lines[i];
                    const y = blockY + infoPadding + i * lineHeight;

                    ctx.fillStyle = infoTextColor;
                    ctx.fillText(line.label + ' ', blockX + infoPadding, y);
                    if (line.label === 'Change') {
                        ctx.fillStyle = (candle.close - candle.open) >= 0 ? CANDLE_SETTINGS.upColor : CANDLE_SETTINGS.downColor;
                    } else {
                        ctx.fillStyle = infoTextColor;
                    }
                    ctx.fillText(line.value, blockX + infoPadding + maxLabelWidth, y);
                }
            }
            ctx.restore();
        }

        // Загрузка данных и вспомогательные функции
        async function loadData(interval) {
            loading.style.display = 'block';
            errorDiv.style.display = 'none';

            try {
                const [candlesResponse, tickerResponse] = await Promise.all([
                    fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${interval}&limit=500`),
                    fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${symbol}`)
                ]);

                if (!candlesResponse.ok) throw new Error(`HTTP ${candlesResponse.status}`);
                if (!tickerResponse.ok) throw new Error(`HTTP ${tickerResponse.status}`);

                const candlesData = await candlesResponse.json();
                const tickerData = await tickerResponse.json();

                let rawData = candlesData.map(d => ({
                    time: parseInt(d[0]),
                    open: parseFloat(d[1]),
                    high: parseFloat(d[2]),
                    low: parseFloat(d[3]),
                    close: parseFloat(d[4])
                }));

                if (interval === '1d') {
                    rawData = rawData.map(c => ({
                        ...c,
                        time: c.time - 3600000
                    }));
                }

                chartData = rawData;

                zoomLevel = 0.7;
                setToLastCandle();

                if (chartData.length > 0) {
                    const lastCandle = chartData[chartData.length - 1];
                    priceDisplay.textContent = lastCandle.close.toFixed(4);
                    updatePriceColor(lastCandle);
                }
                updatePriceChange(tickerData.priceChangePercent);

                loading.style.display = 'none';
            } catch (err) {
                loading.style.display = 'none';
                errorDiv.style.display = 'block';
                errorDiv.textContent = `Ошибка: ${err.message}`;
            }
        }

        function updatePriceChange(percentStr) {
            const percent = parseFloat(percentStr);
            priceChangeDisplay.textContent = (percent >= 0 ? '+' : '') + percent.toFixed(2) + '%';
            priceChangeDisplay.classList.remove('positive', 'negative');
            if (percent > 0) {
                priceChangeDisplay.classList.add('positive');
            } else if (percent < 0) {
                priceChangeDisplay.classList.add('negative');
            } else {
                priceChangeDisplay.classList.add('positive');
            }
        }

        async function refreshData() {
            if (!currentInterval || chartData.length === 0) return;

            try {
                const [candlesResponse, tickerResponse] = await Promise.all([
                    fetch(`https://api.binance.com/api/v3/klines?symbol=${symbol}&interval=${currentInterval}&limit=500`),
                    fetch(`https://api.binance.com/api/v3/ticker/24hr?symbol=${symbol}`)
                ]);

                if (!candlesResponse.ok) throw new Error(`HTTP ${candlesResponse.status}`);
                if (!tickerResponse.ok) throw new Error(`HTTP ${tickerResponse.status}`);

                const newDataRaw = await candlesResponse.json();
                const tickerData = await tickerResponse.json();

                let newData = newDataRaw.map(d => ({
                    time: parseInt(d[0]),
                    open: parseFloat(d[1]),
                    high: parseFloat(d[2]),
                    low: parseFloat(d[3]),
                    close: parseFloat(d[4])
                }));

                if (currentInterval === '1d') {
                    newData = newData.map(c => ({
                        ...c,
                        time: c.time - 3600000
                    }));
                }

                if (newData.length === 0) return;

                const lastOld = chartData[chartData.length - 1];
                const lastNew = newData[newData.length - 1];

                if (lastOld.time === lastNew.time) {
                    const oldCandle = { ...lastOld };
                    const newCandle = { ...lastNew };
                    chartData[chartData.length - 1] = newCandle;

                    animLastCandle = {
                        oldCandle,
                        newCandle,
                        startTime: performance.now(),
                        duration: 400,
                    };
                    if (animFrame) cancelAnimationFrame(animFrame);
                    animFrame = requestAnimationFrame(() => drawChart());

                } else if (lastNew.time > lastOld.time) {
                    chartData.push(lastNew);
                    if (chartData.length > 5000) {
                        chartData.shift();
                        if (startIndex > 0) startIndex -= 1;
                    }
                }

                priceDisplay.textContent = lastNew.close.toFixed(4);
                updatePriceColor(lastNew);
                updatePriceChange(tickerData.priceChangePercent);

                const maxStart = getMaxStart();
                const oldMaxStart = Math.max(0, chartData.length - 1 - getVisibleCount() + EXTRA_SPACE);
                if (startIndex >= oldMaxStart - 5) {
                    startIndex = Math.max(0, chartData.length - getVisibleCount() + EXTRA_SPACE);
                } else {
                    if (startIndex > maxStart) startIndex = maxStart;
                }

                if (!animLastCandle) drawChart();
            } catch (err) {
                console.warn('Ошибка обновления данных:', err);
            }
        }

        function startRefreshTimer(interval) {
            if (refreshIntervalId) clearInterval(refreshIntervalId);
            refreshIntervalId = setInterval(refreshData, REFRESH_INTERVALS[interval]);
        }

        function handleIntervalChange(interval) {
            currentInterval = interval;
            localStorage.setItem('selectedInterval', interval);
            document.querySelectorAll('.tf-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.interval === interval) {
                    btn.classList.add('active');
                }
            });
            loadData(interval).then(() => {
                startRefreshTimer(interval);
            });
        }

        function startDrag(clientX) {
            isDragging = true;
            lastClientX = clientX;
            canvas.style.cursor = 'grabbing';
        }

        function onDrag(clientX) {
            if (!isDragging) return;
            const dx = clientX - lastClientX;
            lastClientX = clientX;

            dragOffset += dx;

            const totalWidthPerCandle = CHART_SETTINGS.candleWidthBase * zoomLevel + CHART_SETTINGS.gapBetweenCandles;
            const maxStart = getMaxStart();

            const maxRightOffset = startIndex * totalWidthPerCandle;
            const maxLeftOffset = -(maxStart - startIndex) * totalWidthPerCandle;

            if (dragOffset > maxRightOffset) dragOffset = maxRightOffset;
            if (dragOffset < maxLeftOffset) dragOffset = maxLeftOffset;

            const leftEdge = CHART_SETTINGS.paddingLeft + dragOffset;
            if (leftEdge > CHART_SETTINGS.paddingLeft - 50 && !isLoadingMore && startIndex > 0) {
                loadOlderCandles();
            }

            drawChart();
        }

        function endDrag() {
            if (!isDragging) return;
            isDragging = false;
            canvas.style.cursor = 'crosshair';
        }

        function handleCanvasClick(e) {
            if (!firstButtonRect) return;
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width / window.devicePixelRatio;
            const scaleY = canvas.height / rect.height / window.devicePixelRatio;
            const mouseX = (e.clientX - rect.left) * scaleX;
            const mouseY = (e.clientY - rect.top) * scaleY;

            if (mouseX >= firstButtonRect.x && mouseX <= firstButtonRect.x + firstButtonRect.w &&
                mouseY >= firstButtonRect.y && mouseY <= firstButtonRect.y + firstButtonRect.h) {
                setToLastCandle();
                e.stopPropagation();
                e.preventDefault();
            }
        }

        // Обработчики мыши и касаний (аналогичны предыдущей версии, с учётом DPR)
        canvas.addEventListener('mousedown', (e) => {
            handleCanvasClick(e);
            if (!e.defaultPrevented) {
                touchStartTime = Date.now();
                touchStartX = e.clientX;
                touchStartY = e.clientY;
                startDrag(e.clientX);
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging) {
                if (crosshairVisible) {
                    const rect = canvas.getBoundingClientRect();
                    const scaleX = canvas.width / rect.width / window.devicePixelRatio;
                    const scaleY = canvas.height / rect.height / window.devicePixelRatio;
                    const canvasX = (e.clientX - rect.left) * scaleX;
                    const canvasY = (e.clientY - rect.top) * scaleY;
                    updateCrosshairFromPoint(canvasX, canvasY);
                    drawChart();
                } else {
                    onDrag(e.clientX);
                }
            }
        });

        canvas.addEventListener('mouseup', (e) => {
            if (isDragging) {
                const touchDuration = Date.now() - touchStartTime;
                const dx = Math.abs(e.clientX - touchStartX);
                const dy = Math.abs(e.clientY - touchStartY);
                if (touchDuration < TAP_DELAY && dx < TAP_DISTANCE && dy < TAP_DISTANCE) {
                    crosshairVisible = !crosshairVisible;
                    if (crosshairVisible) {
                        const rect = canvas.getBoundingClientRect();
                        const scaleX = canvas.width / rect.width / window.devicePixelRatio;
                        const scaleY = canvas.height / rect.height / window.devicePixelRatio;
                        const canvasX = (e.clientX - rect.left) * scaleX;
                        const canvasY = (e.clientY - rect.top) * scaleY;
                        updateCrosshairFromPoint(canvasX, canvasY);
                    }
                    drawChart();
                }
                endDrag();
            }
        });

        canvas.addEventListener('mouseleave', () => {
            if (isDragging) endDrag();
        });

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            if (e.touches.length === 2) {
                pinchActive = true;
                initialPinchDistance = getPinchDistance(e.touches);
                initialZoom = zoomLevel;
                const rect = canvas.getBoundingClientRect();
                const centerX = (rect.left + rect.right) / 2;
                const scaleX = canvas.width / rect.width / window.devicePixelRatio;
                const canvasX = (centerX - rect.left) * scaleX;
                const totalWidthPerCandle = CHART_SETTINGS.candleWidthBase * zoomLevel + CHART_SETTINGS.gapBetweenCandles;
                const candleIndexFloat = (canvasX - CHART_SETTINGS.paddingLeft - dragOffset) / totalWidthPerCandle + startIndex;
                centerCandleIndex = Math.round(candleIndexFloat);
                centerCandleIndex = Math.max(0, Math.min(chartData.length - 1, centerCandleIndex));
                canvas.style.cursor = 'zoom-in';
            } else if (e.touches.length === 1) {
                handleCanvasClick(e.touches[0]);
                if (!e.defaultPrevented) {
                    touchStartTime = Date.now();
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                    startDrag(e.touches[0].clientX);
                }
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (pinchActive && e.touches.length === 2) {
                const newDistance = getPinchDistance(e.touches);
                const scale = newDistance / initialPinchDistance;
                let newZoom = initialZoom * scale;
                if (newZoom < CHART_SETTINGS.minZoom) newZoom = CHART_SETTINGS.minZoom;
                if (newZoom > CHART_SETTINGS.maxZoom) newZoom = CHART_SETTINGS.maxZoom;
                if (newZoom !== zoomLevel) {
                    const oldZoom = zoomLevel;
                    zoomLevel = newZoom;

                    if (centerCandleIndex !== null) {
                        const totalWidthPerCandleOld = CHART_SETTINGS.candleWidthBase * oldZoom + CHART_SETTINGS.gapBetweenCandles;
                        const totalWidthPerCandleNew = CHART_SETTINGS.candleWidthBase * newZoom + CHART_SETTINGS.gapBetweenCandles;

                        const oldCenterX = CHART_SETTINGS.paddingLeft + (centerCandleIndex - startIndex) * totalWidthPerCandleOld + dragOffset + CHART_SETTINGS.candleWidthBase * oldZoom / 2;
                        const newCenterX = CHART_SETTINGS.paddingLeft + (centerCandleIndex - startIndex) * totalWidthPerCandleNew + dragOffset + CHART_SETTINGS.candleWidthBase * newZoom / 2;

                        const deltaX = newCenterX - oldCenterX;
                        dragOffset -= deltaX;

                        const maxStart = getMaxStart();
                        const maxRightOffset = startIndex * totalWidthPerCandleNew;
                        const maxLeftOffset = -(maxStart - startIndex) * totalWidthPerCandleNew;
                        if (dragOffset > maxRightOffset) dragOffset = maxRightOffset;
                        if (dragOffset < maxLeftOffset) dragOffset = maxLeftOffset;
                    }

                    drawChart();
                }
            } else if (!pinchActive && isDragging && e.touches.length === 1) {
                if (crosshairVisible) {
                    const rect = canvas.getBoundingClientRect();
                    const scaleX = canvas.width / rect.width / window.devicePixelRatio;
                    const scaleY = canvas.height / rect.height / window.devicePixelRatio;
                    const canvasX = (e.touches[0].clientX - rect.left) * scaleX;
                    const canvasY = (e.touches[0].clientY - rect.top) * scaleY;
                    updateCrosshairFromPoint(canvasX, canvasY);
                    drawChart();
                } else {
                    onDrag(e.touches[0].clientX);
                }
            }
        });

        canvas.addEventListener('touchend', (e) => {
            e.preventDefault();
            if (pinchActive) {
                pinchActive = false;
                centerCandleIndex = null;
                canvas.style.cursor = 'crosshair';
            } else if (isDragging && e.touches.length === 0) {
                const touchDuration = Date.now() - touchStartTime;
                const dx = Math.abs(lastClientX - touchStartX);
                const dy = 0;
                if (touchDuration < TAP_DELAY && dx < TAP_DISTANCE) {
                    crosshairVisible = !crosshairVisible;
                    if (crosshairVisible) {
                        const rect = canvas.getBoundingClientRect();
                        const scaleX = canvas.width / rect.width / window.devicePixelRatio;
                        const scaleY = canvas.height / rect.height / window.devicePixelRatio;
                        const canvasX = (touchStartX - rect.left) * scaleX;
                        const canvasY = (touchStartY - rect.top) * scaleY;
                        updateCrosshairFromPoint(canvasX, canvasY);
                    }
                    drawChart();
                }
                endDrag();
            }
        });

        function getPinchDistance(touches) {
            const dx = touches[0].clientX - touches[1].clientX;
            const dy = touches[0].clientY - touches[1].clientY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function getPinchCenter(touches) {
            return {
                x: (touches[0].clientX + touches[1].clientX) / 2,
                y: (touches[0].clientY + touches[1].clientY) / 2
            };
        }

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            let newZoom = zoomLevel * delta;
            if (newZoom < CHART_SETTINGS.minZoom) newZoom = CHART_SETTINGS.minZoom;
            if (newZoom > CHART_SETTINGS.maxZoom) newZoom = CHART_SETTINGS.maxZoom;
            if (newZoom !== zoomLevel) {
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width / window.devicePixelRatio;
                const mouseCanvasX = (e.clientX - rect.left) * scaleX;
                const totalWidthPerCandle = CHART_SETTINGS.candleWidthBase * zoomLevel + CHART_SETTINGS.gapBetweenCandles;
                const candleIndexFloat = (mouseCanvasX - CHART_SETTINGS.paddingLeft - dragOffset) / totalWidthPerCandle + startIndex;
                const targetCandle = Math.round(candleIndexFloat);
                const targetCandleIndex = Math.max(0, Math.min(chartData.length - 1, targetCandle));

                const oldZoom = zoomLevel;
                zoomLevel = newZoom;

                const totalWidthPerCandleOld = CHART_SETTINGS.candleWidthBase * oldZoom + CHART_SETTINGS.gapBetweenCandles;
                const totalWidthPerCandleNew = CHART_SETTINGS.candleWidthBase * newZoom + CHART_SETTINGS.gapBetweenCandles;

                const oldCenterX = CHART_SETTINGS.paddingLeft + (targetCandleIndex - startIndex) * totalWidthPerCandleOld + dragOffset + CHART_SETTINGS.candleWidthBase * oldZoom / 2;
                const newCenterX = CHART_SETTINGS.paddingLeft + (targetCandleIndex - startIndex) * totalWidthPerCandleNew + dragOffset + CHART_SETTINGS.candleWidthBase * newZoom / 2;

                dragOffset -= (newCenterX - oldCenterX);

                const maxStart = getMaxStart();
                const maxRightOffset = startIndex * totalWidthPerCandleNew;
                const maxLeftOffset = -(maxStart - startIndex) * totalWidthPerCandleNew;
                if (dragOffset > maxRightOffset) dragOffset = maxRightOffset;
                if (dragOffset < maxLeftOffset) dragOffset = maxLeftOffset;

                drawChart();
            }
        });

        document.querySelectorAll('.tf-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const interval = btn.dataset.interval;
                handleIntervalChange(interval);
            });
            if (btn.dataset.interval === currentInterval) {
                btn.classList.add('active');
            }
        });

        goLastBtn.addEventListener('click', setToLastCandle);
        window.addEventListener('resize', () => drawChart());

        handleIntervalChange(currentInterval);
    </script>
</body>
</html>
