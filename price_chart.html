<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON / USDT — свечной график с плавной анимацией свечи</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            font-family: 'Roboto Mono', monospace;
            background: #000;
            color: #00ff88;
            display: flex;
            flex-direction: column;
        }
        .top-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            height: 70px;
            background: #000;
            border-bottom: 1px solid rgba(0, 255, 136, 0.3);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        .pair-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .pair-row {
            display: flex;
            align-items: baseline;
            gap: 4px;
        }
        .pair-name {
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            text-shadow: 0 0 8px rgba(255,255,255,0.5);
        }
        .current-price {
            font-size: 18px;
            font-weight: 400;
            font-family: 'Roboto Mono', monospace;
            letter-spacing: -0.5px;
            transition: color 0.1s ease;
        }
        .positive {
            color: #00ff88;
            text-shadow: 0 0 8px #00ff88;
        }
        .negative {
            color: #ff4d4d;
            text-shadow: 0 0 8px #ff4d4d;
        }
        .price-change {
            font-size: 16px;
            font-weight: 400;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
            align-self: flex-start;
            margin-top: 4px;
            font-family: 'Roboto Mono', monospace;
            letter-spacing: -0.5px;
        }
        .price-change.positive {
            color: #00ff88;
            text-shadow: 0 0 8px #00ff88;
        }
        .price-change.negative {
            color: #ff4d4d;
            text-shadow: 0 0 8px #ff4d4d;
        }
        #canvasContainer {
            flex: 1;
            position: relative;
            /* Базовый фон, пятно будет динамически обновляться через JS */
            background: 
                linear-gradient(45deg, rgba(0, 255, 136, 0.15) 0%, rgba(0, 200, 100, 0.08) 25%, rgba(0, 255, 200, 0.12) 50%, rgba(0, 150, 80, 0.05) 75%, rgba(0, 255, 136, 0.15) 100%),
                radial-gradient(circle at 50% 20%, rgba(120, 255, 120, 0.3) 0%, transparent 12%),
                radial-gradient(circle at 85% 25%, rgba(0, 255, 136, 0.3) 0%, transparent 15%),
                radial-gradient(circle at 30% 70%, rgba(0, 255, 136, 0.25) 0%, transparent 12%),
                radial-gradient(circle at 70% 80%, rgba(120, 255, 120, 0.25) 0%, transparent 15%),
                radial-gradient(circle at 45% 45%, rgba(0, 255, 136, 0.2) 0%, transparent 10%);
            backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
            -webkit-backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
            border-bottom: 1px solid rgba(0, 255, 136, 0.3);
            box-shadow: inset 0 0 30px rgba(0, 255, 136, 0.2);
        }
        #chartCanvas {
            width: 100%;
            height: 100%;
            display: block;
            cursor: grab;
            touch-action: none;
        }
        #chartCanvas:active {
            cursor: grabbing;
        }
        .timeframe-bar {
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: rgba(0, 20, 10, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 255, 136, 0.3);
            box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        .tf-btn {
            background: transparent;
            border: 1px solid rgba(0, 255, 136, 0.5);
            color: #00ff88;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-shadow: 0 0 8px #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }
        .tf-btn.active, .tf-btn:hover {
            background: rgba(0, 255, 136, 0.2);
            border-color: #00ff88;
            box-shadow: 0 0 15px #00ff88;
        }
        .go-last-btn {
            background: transparent;
            border: 1px solid rgba(0, 255, 136, 0.5);
            color: #00ff88;
            padding: 8px 18px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-shadow: 0 0 8px #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
            font-size: 18px;
            line-height: 1;
        }
        .go-last-btn:hover {
            background: rgba(0, 255, 136, 0.2);
            border-color: #00ff88;
            box-shadow: 0 0 15px #00ff88;
        }
        #loading, #error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #00ff88;
            display: none;
            z-index: 20;
        }
        #error { color: #ff4d4d; }
    </style>
</head>
<body>
    <div class="top-panel">
        <div class="pair-info">
            <div class="pair-row">
                <span class="pair-name">TON/USDT</span>
                <span class="current-price" id="priceDisplay">0.0000</span>
            </div>
            <span class="price-change" id="priceChangeDisplay">+0.00%</span>
        </div>
    </div>

    <div id="canvasContainer">
        <canvas id="chartCanvas"></canvas>
        <div id="loading">Загрузка данных...</div>
        <div id="error"></div>
    </div>

    <div class="timeframe-bar">
        <button class="tf-btn" data-interval="5m">5м</button>
        <button class="tf-btn" data-interval="15m">15м</button>
        <button class="tf-btn active" data-interval="1h">1ч</button>
        <button class="tf-btn" data-interval="4h">4ч</button>
        <button class="tf-btn" data-interval="1d">1д</button>
        <button class="go-last-btn" id="goLastBtn">&gt;&gt;&gt;</button>
    </div>

    <script>
        // ========== НАСТРОЙКИ ГРАФИКА ==========
        const CANDLE_SETTINGS = {
            upColor: '#00ff88',
            downColor: '#ff4d4d',
            wickColor: '#00ff88',
            gridColor: 'rgba(0, 255, 136, 0.15)',
            textColor: '#ffffff',
        };

        const CHART_SETTINGS = {
            paddingLeft: 40,
            paddingRight: 40,
            paddingTop: 30,
            paddingBottom: 70,
            minZoom: 0.5,
            maxZoom: 3,
            candleWidthBase: 8,
            gapBetweenCandles: 2,
            minBodyHeight: 2,
            gridVerticalStep: 4,
            gridHorizontalCount: 15,
        };

        const LABEL_CONFIG = {
            '5m':  { step: 12, pattern: ['hour'] },
            '15m': { step: 12, pattern: ['hour'] },
            '1h':  { step: 12, pattern: ['hour', 'day', 'hour', 'month'] },
            '4h':  { step: 12, pattern: ['day', 'month', 'day', 'day'] },
            '1d':  { step: 12, pattern: ['month', 'day', 'month', 'day', 'year', 'day'] }
        };

        const HIGH_LOW_SETTINGS = {
            enabled: true,
            lineColor: '#ffffff',
            lineWidth: 1,
            fontSize: 14,
            textColor: '#ffffff',
        };

        const LAST_CANDLE_LINE_SETTINGS = {
            enabled: true,
            lineColor: '#ffffff',
            lineWidth: 1,
            segmentLength: 8,
            gapLength: 2,
            segmentsCount: 5,
            boxPadding: 6,
            boxBgColor: 'rgba(20,20,30,0.8)',
            boxBorderColor: '#ffffff',
            textColor: '#ffffff',
            fontSize: 12,
        };

        // Единый интервал обновления 2 секунды для всех
        const REFRESH_INTERVALS = {
            '5m': 2000,
            '15m': 2000,
            '1h': 2000,
            '4h': 2000,
            '1d': 2000
        };

        // Настройки для подвижного пятна
        const SPOT_SETTINGS = {
            targetUpdateInterval: 7 * 60 * 1000, // 7 минут
            smoothingFactor: 1/6, // плавность: за 6 шагов
            currentX: 50, // текущая позиция в процентах
            targetX: 50,
            animationFrame: null,
        };

        const canvas = document.getElementById('chartCanvas');
        const ctx = canvas.getContext('2d');
        const loading = document.getElementById('loading');
        const errorDiv = document.getElementById('error');
        const goLastBtn = document.getElementById('goLastBtn');
        const priceDisplay = document.getElementById('priceDisplay');
        const priceChangeDisplay = document.getElementById('priceChangeDisplay');
        const canvasContainer = document.getElementById('canvasContainer');

        let chartData = [];
        let currentInterval = '1h';
        let startIndex = 0;
        let zoomLevel = 1;
        const EXTRA_SPACE = 15;
        let isDragging = false;
        let lastClientX = 0;
        let dragOffset = 0;
        let refreshIntervalId = null;
        let limit = 1000;
        let animLastCandle = null;
        let animFrame = null;

        // Глобальные переменные для позиции последней свечи
        let globalLastCandleX = 0;
        let globalCanvasWidth = 0;

        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }

        function getVisibleCount() {
            const totalWidthPerCandle = CHART_SETTINGS.candleWidthBase * zoomLevel + CHART_SETTINGS.gapBetweenCandles;
            return Math.floor((canvas.width - CHART_SETTINGS.paddingLeft - CHART_SETTINGS.paddingRight) / totalWidthPerCandle);
        }

        function getMaxStart() {
            const visibleCount = getVisibleCount();
            return Math.max(0, chartData.length - visibleCount + EXTRA_SPACE);
        }

        function setToLastCandle() {
            if (!chartData.length) return;
            const visibleCount = getVisibleCount();
            startIndex = Math.max(0, chartData.length - visibleCount + EXTRA_SPACE);
            dragOffset = 0;
            drawChart();
        }

        function updatePriceColor(candle) {
            const isGreen = candle.close >= candle.open;
            priceDisplay.classList.remove('positive', 'negative');
            priceDisplay.classList.add(isGreen ? 'positive' : 'negative');
        }

        function drawLastCandleLine(x, y, price) {
            const { lineWidth, segmentLength, gapLength, segmentsCount, boxPadding, boxBgColor, boxBorderColor, textColor, fontSize } = LAST_CANDLE_LINE_SETTINGS;
            const totalLineLength = segmentsCount * (segmentLength + gapLength) - gapLength;
            const startX = x + 2;
            const endX = startX + totalLineLength;

            ctx.save();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = lineWidth;

            for (let i = 0; i < segmentsCount; i++) {
                const segStartX = startX + i * (segmentLength + gapLength);
                ctx.beginPath();
                ctx.moveTo(segStartX, y);
                ctx.lineTo(segStartX + segmentLength, y);
                ctx.stroke();
            }

            const text = price.toFixed(4);
            ctx.font = `${fontSize}px 'Roboto Mono', monospace`;
            ctx.letterSpacing = '-0.5px';
            const textWidth = ctx.measureText(text).width;
            const boxWidth = textWidth + 2 * boxPadding;
            const boxHeight = fontSize + 2 * boxPadding;
            const boxX = endX + 2;
            const boxY = y - boxHeight / 2;

            ctx.fillStyle = boxBgColor;
            ctx.shadowColor = '#000';
            ctx.shadowBlur = 10;
            ctx.beginPath();
            ctx.roundRect(boxX, boxY, boxWidth, boxHeight, 6);
            ctx.fill();

            ctx.strokeStyle = boxBorderColor;
            ctx.lineWidth = 1;
            ctx.shadowBlur = 0;
            ctx.stroke();

            ctx.fillStyle = textColor;
            ctx.textAlign = 'left';
            ctx.textBaseline = 'middle';
            ctx.shadowBlur = 4;
            ctx.fillText(text, boxX + boxPadding, boxY + boxHeight / 2);
            ctx.restore();
        }

        CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
            if (w < 2 * r) r = w / 2;
            if (h < 2 * r) r = h / 2;
            this.moveTo(x + r, y);
            this.lineTo(x + w - r, y);
            this.quadraticCurveTo(x + w, y, x + w, y + r);
            this.lineTo(x + w, y + h - r);
            this.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
            this.lineTo(x + r, y + h);
            this.quadraticCurveTo(x, y + h, x, y + h - r);
            this.lineTo(x, y + r);
            this.quadraticCurveTo(x, y, x + r, y);
            this.closePath();
            return this;
        };

        function formatLabelByType(timestamp, type) {
            const date = new Date(timestamp);
            const monthNames = ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'];

            switch (type) {
                case 'hour':
                    const h = date.getHours().toString().padStart(2, '0');
                    return `${h}:00`;
                case 'day':
                    return date.getDate().toString();
                case 'month':
                    return monthNames[date.getMonth()];
                case 'year':
                    return date.getFullYear().toString();
                default:
                    return '';
            }
        }

        // Функция для сдвига времени дневных свечей на 23:00 UTC (02:00 МСК)
        function adjustDailyTime(timestamp) {
            return timestamp - 3600000; // минус 1 час
        }

        // Функция обновления фона пятна
        function updateSpotBackground() {
            const container = canvasContainer;
            const baseGrad = 'linear-gradient(45deg, rgba(0, 255, 136, 0.15) 0%, rgba(0, 200, 100, 0.08) 25%, rgba(0, 255, 200, 0.12) 50%, rgba(0, 150, 80, 0.05) 75%, rgba(0, 255, 136, 0.15) 100%)';
            const spotGrad = `radial-gradient(circle at ${SPOT_SETTINGS.currentX}% 20%, rgba(120, 255, 120, 0.3) 0%, transparent 12%)`;
            const otherSpots = `
                radial-gradient(circle at 85% 25%, rgba(0, 255, 136, 0.3) 0%, transparent 15%),
                radial-gradient(circle at 30% 70%, rgba(0, 255, 136, 0.25) 0%, transparent 12%),
                radial-gradient(circle at 70% 80%, rgba(120, 255, 120, 0.25) 0%, transparent 15%),
                radial-gradient(circle at 45% 45%, rgba(0, 255, 136, 0.2) 0%, transparent 10%)`;

            container.style.background = `${baseGrad}, ${spotGrad}, ${otherSpots}`;
            // остальные стили уже есть в CSS
        }

        // Функция обновления цели пятна (позиции последней свечи)
        function updateSpotTarget(instant = false) {
            if (!globalCanvasWidth || globalLastCandleX === 0) return;
            const targetX = ((globalLastCandleX - CHART_SETTINGS.paddingLeft) / (globalCanvasWidth - CHART_SETTINGS.paddingLeft - CHART_SETTINGS.paddingRight)) * 100;
            SPOT_SETTINGS.targetX = Math.max(0, Math.min(100, targetX));
            if (instant) {
                SPOT_SETTINGS.currentX = SPOT_SETTINGS.targetX;
                updateSpotBackground();
            } else {
                if (!SPOT_SETTINGS.animationFrame) {
                    SPOT_SETTINGS.animationFrame = requestAnimationFrame(animateSpot);
                }
            }
        }

        // Анимация пятна
        function animateSpot() {
            const dx = SPOT_SETTINGS.targetX - SPOT_SETTINGS.currentX;
            if (Math.abs(dx) < 0.01) {
                SPOT_SETTINGS.currentX = SPOT_SETTINGS.targetX;
                SPOT_SETTINGS.animationFrame = null;
            } else {
                SPOT_SETTINGS.currentX += dx * SPOT_SETTINGS.smoothingFactor;
            }
            updateSpotBackground();
            if (SPOT_SETTINGS.animationFrame) {
                SPOT_SETTINGS.animationFrame = requestAnimationFrame(animateSpot);
            }
        }

        function drawChart() {
            if (!chartData || chartData.length === 0) return;

            resizeCanvas();

            const width = canvas.width;
            const height = canvas.height;
            const { paddingLeft, paddingRight, paddingTop, paddingBottom, gapBetweenCandles, minBodyHeight, gridVerticalStep, gridHorizontalCount } = CHART_SETTINGS;

            const candleWidth = CHART_SETTINGS.candleWidthBase * zoomLevel;
            const totalWidthPerCandle = candleWidth + gapBetweenCandles;
            const visibleCount = getVisibleCount();
            if (visibleCount < 1) return;

            const maxStart = getMaxStart();
            if (startIndex > maxStart) startIndex = maxStart;
            if (startIndex < 0) startIndex = 0;

            const extraCandles = Math.ceil(Math.abs(dragOffset) / totalWidthPerCandle) + 5;
            const drawStart = Math.max(0, startIndex - extraCandles);
            const drawEnd = Math.min(chartData.length, startIndex + visibleCount + extraCandles);
            let visibleData = chartData.slice(drawStart, drawEnd);
            if (visibleData.length === 0) return;

            if (animLastCandle) {
                const now = performance.now();
                const progress = Math.min((now - animLastCandle.startTime) / animLastCandle.duration, 1);
                const oldC = animLastCandle.oldCandle;
                const newC = animLastCandle.newCandle;

                const interpCandle = {
                    time: newC.time,
                    open: oldC.open + (newC.open - oldC.open) * progress,
                    high: oldC.high + (newC.high - oldC.high) * progress,
                    low: oldC.low + (newC.low - oldC.low) * progress,
                    close: oldC.close + (newC.close - oldC.close) * progress,
                };

                if (visibleData.length > 0) {
                    visibleData[visibleData.length - 1] = interpCandle;
                }

                if (progress < 1) {
                    animFrame = requestAnimationFrame(() => drawChart());
                } else {
                    animLastCandle = null;
                    animFrame = null;
                }
            }

            const baseX = paddingLeft + (drawStart - startIndex) * totalWidthPerCandle + dragOffset;

            const modifiedData = visibleData.map((candle, idx) => {
                if (idx === 0) return { ...candle };
                const prevClose = visibleData[idx - 1].close;
                return {
                    ...candle,
                    open: prevClose,
                };
            });

            let minPriceVisible = Math.min(...visibleData.map(d => d.low));
            let maxPriceVisible = Math.max(...visibleData.map(d => d.high));
            const priceRange = maxPriceVisible - minPriceVisible;
            minPriceVisible -= priceRange * 0.05;
            maxPriceVisible += priceRange * 0.05;
            if (minPriceVisible === maxPriceVisible) {
                minPriceVisible -= 0.01;
                maxPriceVisible += 0.01;
            }

            ctx.clearRect(0, 0, width, height);

            // --- Вертикальные линии (сетка) с равномерным шагом ---
            ctx.strokeStyle = CANDLE_SETTINGS.gridColor;
            ctx.lineWidth = 0.5;
            const stepPx = totalWidthPerCandle * gridVerticalStep;
            const firstLineX = Math.ceil((baseX - paddingLeft) / stepPx) * stepPx + paddingLeft;
            for (let x = firstLineX; x < width - paddingRight; x += stepPx) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, height);
                ctx.stroke();
            }

            // --- Горизонтальные линии ---
            for (let i = 0; i <= gridHorizontalCount; i++) {
                const y = paddingTop + (height - paddingTop - paddingBottom) * (i / gridHorizontalCount);
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(width, y);
                ctx.strokeStyle = CANDLE_SETTINGS.gridColor;
                ctx.stroke();
            }

            // --- Свечи ---
            modifiedData.forEach((candle, i) => {
                const x = baseX + i * totalWidthPerCandle;
                const w = candleWidth;

                const openY = height - paddingBottom - ((candle.open - minPriceVisible) / (maxPriceVisible - minPriceVisible)) * (height - paddingTop - paddingBottom);
                const closeY = height - paddingBottom - ((candle.close - minPriceVisible) / (maxPriceVisible - minPriceVisible)) * (height - paddingTop - paddingBottom);
                const highY = height - paddingBottom - ((candle.high - minPriceVisible) / (maxPriceVisible - minPriceVisible)) * (height - paddingTop - paddingBottom);
                const lowY = height - paddingBottom - ((candle.low - minPriceVisible) / (maxPriceVisible - minPriceVisible)) * (height - paddingTop - paddingBottom);

                const isGreen = candle.close >= candle.open;
                ctx.fillStyle = isGreen ? CANDLE_SETTINGS.upColor : CANDLE_SETTINGS.downColor;
                ctx.strokeStyle = isGreen ? CANDLE_SETTINGS.upColor : CANDLE_SETTINGS.downColor;

                ctx.beginPath();
                ctx.moveTo(x + w / 2, highY);
                ctx.lineTo(x + w / 2, lowY);
                ctx.stroke();

                const bodyTop = Math.min(openY, closeY);
                const bodyBottom = Math.max(openY, closeY);
                const bodyHeight = bodyBottom - bodyTop;

                if (bodyHeight < minBodyHeight) {
                    const midY = (openY + closeY) / 2;
                    ctx.fillRect(x, midY - minBodyHeight / 2, w, minBodyHeight);
                } else {
                    ctx.fillRect(x, bodyTop, w, bodyHeight);
                }
            });

            // --- Линии High/Low ---
            if (HIGH_LOW_SETTINGS.enabled && visibleData.length > 0) {
                const highPrice = Math.max(...visibleData.map(d => d.high));
                const lowPrice = Math.min(...visibleData.map(d => d.low));

                const highIdxInVisible = visibleData.map(d => d.high).lastIndexOf(highPrice);
                const lowIdxInVisible = visibleData.map(d => d.low).lastIndexOf(lowPrice);

                if (highIdxInVisible !== -1) {
                    const highX = baseX + highIdxInVisible * totalWidthPerCandle + candleWidth / 2;
                    const highY = height - paddingBottom - ((highPrice - minPriceVisible) / (maxPriceVisible - minPriceVisible)) * (height - paddingTop - paddingBottom);
                    drawPriceLine(highX, highY, highPrice, width, paddingLeft, paddingRight);
                }

                if (lowIdxInVisible !== -1) {
                    const lowX = baseX + lowIdxInVisible * totalWidthPerCandle + candleWidth / 2;
                    const lowY = height - paddingBottom - ((lowPrice - minPriceVisible) / (maxPriceVisible - minPriceVisible)) * (height - paddingTop - paddingBottom);
                    drawPriceLine(lowX, lowY, lowPrice, width, paddingLeft, paddingRight);
                }
            }

            // --- Линия последней свечи ---
            if (LAST_CANDLE_LINE_SETTINGS.enabled && chartData.length > 0) {
                const lastOriginal = visibleData[visibleData.length - 1];
                const lastIndex = chartData.length - 1;
                if (lastIndex >= drawStart && lastIndex < drawEnd) {
                    const localIdx = lastIndex - drawStart;
                    const lastCandleX = baseX + localIdx * totalWidthPerCandle + candleWidth / 2;
                    const lastCandleY = height - paddingBottom - ((lastOriginal.close - minPriceVisible) / (maxPriceVisible - minPriceVisible)) * (height - paddingTop - paddingBottom);
                    drawLastCandleLine(lastCandleX, lastCandleY, lastOriginal.close);

                    // Сохраняем позицию последней свечи для пятна
                    globalLastCandleX = lastCandleX;
                    globalCanvasWidth = width;
                }
            }

            // --- Временные метки снизу ---
            ctx.save();
            ctx.fillStyle = '#ffffff';
            ctx.font = '11px "Roboto Mono", monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            const labelY = height - paddingBottom / 2;

            const config = LABEL_CONFIG[currentInterval] || { step: 12, pattern: ['hour'] };
            const step = config.step;
            const pattern = config.pattern;

            // Наборы для уникальности месяцев и годов
            let seenMonths = new Set();
            let seenYears = new Set();

            for (let i = 0; i < visibleData.length; i++) {
                const globalIndex = drawStart + i;
                const distFromLast = chartData.length - 1 - globalIndex;
                if (distFromLast % step === 0) {
                    let timestamp = visibleData[i].time;
                    // Для дневного графика корректируем время для меток
                    if (currentInterval === '1d') {
                        timestamp = adjustDailyTime(timestamp);
                    }
                    const patternIndex = Math.floor(distFromLast / step) % pattern.length;
                    let type = pattern[patternIndex];
                    let label = formatLabelByType(timestamp, type);
                    let skipDueToUniqueness = false;

                    if (type === 'year') {
                        const year = new Date(timestamp).getFullYear();
                        if (seenYears.has(year)) {
                            skipDueToUniqueness = true;
                        } else {
                            seenYears.add(year);
                        }
                    } else if (type === 'month') {
                        const date = new Date(timestamp);
                        const monthKey = `${date.getFullYear()}-${date.getMonth()}`;
                        if (seenMonths.has(monthKey)) {
                            skipDueToUniqueness = true;
                        } else {
                            seenMonths.add(monthKey);
                        }
                    }

                    if (skipDueToUniqueness) {
                        type = 'day';
                        label = formatLabelByType(timestamp, type);
                    }

                    if (label) {
                        const x = baseX + i * totalWidthPerCandle + candleWidth / 2;
                        ctx.fillText(label, x, labelY);
                    }
                }
            }
            ctx.restore();

            // --- Шкала цен (белая) ---
            ctx.fillStyle = CANDLE_SETTINGS.textColor;
            ctx.font = '12px "Roboto Mono", monospace';
            ctx.textAlign = 'right';
            ctx.textBaseline = 'middle';
            ctx.letterSpacing = '-0.5px';
            for (let i = 0; i <= 5; i++) {
                const price = minPriceVisible + (maxPriceVisible - minPriceVisible) * (i / 5);
                const y = paddingTop + (height - paddingTop - paddingBottom) * (1 - i / 5);
                ctx.fillText(price.toFixed(4), width - 10, y);
            }
        }

        function drawPriceLine(x, y, price, canvasWidth, paddingLeft, paddingRight) {
            const midX = paddingLeft + (canvasWidth - paddingLeft - paddingRight) / 2;
            const lineLength = 30;

            ctx.save();
            ctx.strokeStyle = HIGH_LOW_SETTINGS.lineColor;
            ctx.lineWidth = HIGH_LOW_SETTINGS.lineWidth;
            ctx.fillStyle = HIGH_LOW_SETTINGS.textColor;
            ctx.font = `${HIGH_LOW_SETTINGS.fontSize}px "Roboto Mono", monospace`;
            ctx.textBaseline = 'middle';
            ctx.shadowColor = '#000';
            ctx.shadowBlur = 3;
            ctx.letterSpacing = '-0.5px';

            if (x > midX) {
                const endX = x - lineLength;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(endX, y);
                ctx.stroke();
                ctx.textAlign = 'right';
                ctx.fillText(price.toFixed(4), endX - 2, y);
            } else {
                const endX = x + lineLength;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(endX, y);
                ctx.stroke();
                ctx.textAlign = 'left';
                ctx.fillText(price.toFixed(4), endX + 2, y);
            }
            ctx.restore();
        }

        async function loadData(interval) {
            loading.style.display = 'block';
            errorDiv.style.display = 'none';

            const limits = {
                '5m': 1000,
                '15m': 1000,
                '1h': 1000,
                '4h': 800,
                '1d': 500
            };
            limit = limits[interval] || 500;

            try {
                const [candlesResponse, tickerResponse] = await Promise.all([
                    fetch(`https://api.binance.com/api/v3/klines?symbol=TONUSDT&interval=${interval}&limit=${limit}`),
                    fetch('https://api.binance.com/api/v3/ticker/24hr?symbol=TONUSDT')
                ]);

                if (!candlesResponse.ok) throw new Error(`HTTP ${candlesResponse.status}`);
                if (!tickerResponse.ok) throw new Error(`HTTP ${tickerResponse.status}`);

                const candlesData = await candlesResponse.json();
                const tickerData = await tickerResponse.json();

                let rawData = candlesData.map(d => ({
                    time: parseInt(d[0]),
                    open: parseFloat(d[1]),
                    high: parseFloat(d[2]),
                    low: parseFloat(d[3]),
                    close: parseFloat(d[4])
                }));

                // Если дневной интервал, сдвигаем время на 1 час назад (23:00 UTC)
                if (interval === '1d') {
                    rawData = rawData.map(c => ({
                        ...c,
                        time: c.time - 3600000
                    }));
                }

                chartData = rawData;

                zoomLevel = 1;
                setToLastCandle();

                if (chartData.length > 0) {
                    const lastCandle = chartData[chartData.length - 1];
                    priceDisplay.textContent = lastCandle.close.toFixed(4);
                    updatePriceColor(lastCandle);
                }
                updatePriceChange(tickerData.priceChangePercent);

                loading.style.display = 'none';
            } catch (err) {
                loading.style.display = 'none';
                errorDiv.style.display = 'block';
                errorDiv.textContent = `Ошибка: ${err.message}`;
            }
        }

        function updatePriceChange(percentStr) {
            const percent = parseFloat(percentStr);
            priceChangeDisplay.textContent = (percent >= 0 ? '+' : '') + percent.toFixed(2) + '%';
            priceChangeDisplay.classList.remove('positive', 'negative');
            if (percent > 0) {
                priceChangeDisplay.classList.add('positive');
            } else if (percent < 0) {
                priceChangeDisplay.classList.add('negative');
            } else {
                priceChangeDisplay.classList.add('positive');
            }
        }

        async function refreshData() {
            if (!currentInterval || chartData.length === 0) return;

            try {
                const [candlesResponse, tickerResponse] = await Promise.all([
                    fetch(`https://api.binance.com/api/v3/klines?symbol=TONUSDT&interval=${currentInterval}&limit=${limit}`),
                    fetch('https://api.binance.com/api/v3/ticker/24hr?symbol=TONUSDT')
                ]);

                if (!candlesResponse.ok) throw new Error(`HTTP ${candlesResponse.status}`);
                if (!tickerResponse.ok) throw new Error(`HTTP ${tickerResponse.status}`);

                const newDataRaw = await candlesResponse.json();
                const tickerData = await tickerResponse.json();

                let newData = newDataRaw.map(d => ({
                    time: parseInt(d[0]),
                    open: parseFloat(d[1]),
                    high: parseFloat(d[2]),
                    low: parseFloat(d[3]),
                    close: parseFloat(d[4])
                }));

                if (currentInterval === '1d') {
                    newData = newData.map(c => ({
                        ...c,
                        time: c.time - 3600000
                    }));
                }

                if (newData.length === 0) return;

                const lastOld = chartData[chartData.length - 1];
                const lastNew = newData[newData.length - 1];

                if (lastOld.time === lastNew.time) {
                    const oldCandle = { ...lastOld };
                    const newCandle = { ...lastNew };
                    chartData[chartData.length - 1] = newCandle;

                    animLastCandle = {
                        oldCandle,
                        newCandle,
                        startTime: performance.now(),
                        duration: 400,
                    };
                    if (animFrame) cancelAnimationFrame(animFrame);
                    animFrame = requestAnimationFrame(() => drawChart());

                } else if (lastNew.time > lastOld.time) {
                    chartData.push(lastNew);
                    if (chartData.length > limit) {
                        chartData.shift();
                        if (startIndex > 0) startIndex -= 1;
                    }
                }

                priceDisplay.textContent = lastNew.close.toFixed(4);
                updatePriceColor(lastNew);
                updatePriceChange(tickerData.priceChangePercent);

                const maxStart = getMaxStart();
                const oldMaxStart = Math.max(0, chartData.length - 1 - getVisibleCount() + EXTRA_SPACE);
                if (startIndex >= oldMaxStart - 5) {
                    startIndex = Math.max(0, chartData.length - getVisibleCount() + EXTRA_SPACE);
                } else {
                    if (startIndex > maxStart) startIndex = maxStart;
                }

                if (!animLastCandle) drawChart();

                // Обновляем цель пятна
                updateSpotTarget(false);
            } catch (err) {
                console.warn('Ошибка обновления данных:', err);
            }
        }

        function startRefreshTimer(interval) {
            if (refreshIntervalId) clearInterval(refreshIntervalId);
            refreshIntervalId = setInterval(refreshData, REFRESH_INTERVALS[interval]);
        }

        function handleIntervalChange(interval) {
            currentInterval = interval;
            loadData(interval).then(() => {
                startRefreshTimer(interval);
                // Устанавливаем пятно мгновенно на последнюю свечу после загрузки
                setTimeout(() => {
                    updateSpotTarget(true);
                }, 100); // небольшая задержка, чтобы canvas успел отрисоваться
            });
        }

        function startDrag(clientX) {
            isDragging = true;
            lastClientX = clientX;
            canvas.style.cursor = 'grabbing';
        }

        function onDrag(clientX) {
            if (!isDragging) return;
            const dx = clientX - lastClientX;
            lastClientX = clientX;

            dragOffset += dx;

            const totalWidthPerCandle = CHART_SETTINGS.candleWidthBase * zoomLevel + CHART_SETTINGS.gapBetweenCandles;
            const maxStart = getMaxStart();

            const maxRightOffset = startIndex * totalWidthPerCandle;
            const maxLeftOffset = -(maxStart - startIndex) * totalWidthPerCandle;

            if (dragOffset > maxRightOffset) dragOffset = maxRightOffset;
            if (dragOffset < maxLeftOffset) dragOffset = maxLeftOffset;

            drawChart();
        }

        function endDrag() {
            if (!isDragging) return;
            isDragging = false;
            canvas.style.cursor = 'grab';

            const totalWidthPerCandle = CHART_SETTINGS.candleWidthBase * zoomLevel + CHART_SETTINGS.gapBetweenCandles;
            const shiftCandles = Math.round(dragOffset / totalWidthPerCandle);

            if (shiftCandles !== 0) {
                startIndex -= shiftCandles;
                const maxStart = getMaxStart();
                if (startIndex > maxStart) startIndex = maxStart;
                if (startIndex < 0) startIndex = 0;
            }

            dragOffset -= shiftCandles * totalWidthPerCandle;
            drawChart();

            // Обновляем цель пятна после перетаскивания
            updateSpotTarget(false);
        }

        canvas.addEventListener('mousedown', (e) => startDrag(e.clientX));
        window.addEventListener('mousemove', (e) => onDrag(e.clientX));
        window.addEventListener('mouseup', endDrag);
        canvas.addEventListener('touchstart', (e) => startDrag(e.touches[0].clientX));
        window.addEventListener('touchmove', (e) => onDrag(e.touches[0].clientX));
        window.addEventListener('touchend', endDrag);

        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? 0.9 : 1.1;
            let newZoom = zoomLevel * delta;
            if (newZoom < CHART_SETTINGS.minZoom) newZoom = CHART_SETTINGS.minZoom;
            if (newZoom > CHART_SETTINGS.maxZoom) newZoom = CHART_SETTINGS.maxZoom;
            if (newZoom !== zoomLevel) {
                zoomLevel = newZoom;
                drawChart();
                updateSpotTarget(false);
            }
        });

        document.querySelectorAll('.tf-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                handleIntervalChange(btn.dataset.interval);
            });
        });

        goLastBtn.addEventListener('click', setToLastCandle);
        window.addEventListener('resize', () => {
            drawChart();
            updateSpotTarget(false);
        });

        handleIntervalChange('1h');
    </script>
</body>
</html>
