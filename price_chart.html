<!DOCTYPE html>
<html>
<head>
    <style>
        body { margin: 0; overflow: hidden; background: black; }
        canvas { display: block; width: 100vw; height: 100vh; background: #333; }
        #debug { 
            position: fixed; 
            top: 10px; 
            left: 10px; 
            color: lime; 
            font-family: monospace; 
            z-index: 999; 
            background: rgba(0,0,0,0.7); 
            padding: 5px;
        }
    </style>
</head>
<body>
    <div id="debug">Нажмите и двигайте мышью</div>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const debug = document.getElementById('debug');

        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let squareX = 200, squareY = 200;
        let isDragging = false;
        let lastX, lastY;

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'lime';
            ctx.fillRect(squareX, squareY, 80, 80);
        }
        draw();

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
            debug.innerText = 'Мышь нажата';
            e.preventDefault();
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const dx = e.clientX - lastX;
            const dy = e.clientY - lastY;
            squareX += dx;
            squareY += dy;
            lastX = e.clientX;
            lastY = e.clientY;
            draw();
            debug.innerText = `X=${squareX}, Y=${squareY}`;
            e.preventDefault();
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
            debug.innerText = 'Отпущено';
        });

        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
        });
    </script>
</body>
</html>
