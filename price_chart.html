<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TON / USDT</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            overflow: hidden;
            background: #000;
            font-family: monospace;
        }
        /* Контейнер для графика */
        .chart-wrapper {
            width: 100%;
            height: calc(100% - 50px);
            background: #000; /* чёрный фон */
            position: relative;
            border-bottom: 1px solid rgba(0, 255, 136, 0.3);
            box-shadow: inset 0 0 30px rgba(0, 255, 136, 0.2);
        }
        #chart {
            width: 100%;
            height: 100%;
        }
        .timeframe-bar {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: rgba(0, 20, 10, 0.8);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-top: 1px solid rgba(0, 255, 136, 0.3);
            box-shadow: 0 -5px 15px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }
        .tf-btn {
            background: transparent;
            border: 1px solid rgba(0, 255, 136, 0.5);
            color: #00ff88;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-shadow: 0 0 8px #00ff88;
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
            font-family: monospace;
        }
        .tf-btn:hover, .tf-btn.active {
            background: rgba(0, 255, 136, 0.2);
            border-color: #00ff88;
            box-shadow: 0 0 15px #00ff88;
        }
    </style>
    <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>
    <div class="chart-wrapper">
        <div id="chart"></div>
    </div>
    <div class="timeframe-bar" id="timeframe-bar">
        <button class="tf-btn active" data-interval="1h">1ч</button>
        <button class="tf-btn" data-interval="4h">4ч</button>
        <button class="tf-btn" data-interval="1d">1д</button>
    </div>

    <script>
        // Получаем размеры контейнера
        const wrapper = document.querySelector('.chart-wrapper');
        const chartElement = document.getElementById('chart');

        // Создаём график с чёрным фоном
        const chart = LightweightCharts.createChart(chartElement, {
            width: wrapper.clientWidth,
            height: wrapper.clientHeight,
            layout: {
                backgroundColor: '#000000',
                textColor: '#00ff88',
                fontFamily: 'monospace',
            },
            grid: {
                vertLines: { color: 'rgba(0, 255, 136, 0.15)' },
                horzLines: { color: 'rgba(0, 255, 136, 0.15)' },
            },
            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal,
                vertLine: { color: '#00ff88', width: 1, style: 1 },
                horzLine: { color: '#00ff88', width: 1, style: 1 },
            },
            rightPriceScale: {
                borderColor: 'rgba(0, 255, 136, 0.3)',
                textColor: '#00ff88',
            },
            timeScale: {
                borderColor: 'rgba(0, 255, 136, 0.3)',
                textColor: '#00ff88',
                timeVisible: true,
                secondsVisible: false,
            },
        });

        // Свечная серия
        const candlestickSeries = chart.addCandlestickSeries({
            upColor: '#00ff88',
            downColor: '#ff4d4d',
            borderDownColor: '#ff4d4d',
            borderUpColor: '#00ff88',
            wickDownColor: '#ff4d4d',
            wickUpColor: '#00ff88',
        });

        let currentInterval = '1h';

        async function loadData(interval) {
            const limits = { '1h': 500, '4h': 500, '1d': 365 };
            const limit = limits[interval] || 500;
            try {
                const response = await fetch(`https://api.binance.com/api/v3/klines?symbol=TONUSDT&interval=${interval}&limit=${limit}`);
                const data = await response.json();
                
                const chartData = data.map(d => ({
                    time: Math.floor(d[0] / 1000),
                    open: parseFloat(d[1]),
                    high: parseFloat(d[2]),
                    low: parseFloat(d[3]),
                    close: parseFloat(d[4]),
                }));
                
                candlestickSeries.setData(chartData);
                chart.timeScale().fitContent();
            } catch (error) {
                console.error('Ошибка загрузки данных:', error);
            }
        }

        loadData('1h');

        // Обработчики кнопок
        document.querySelectorAll('.tf-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tf-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentInterval = btn.dataset.interval;
                loadData(currentInterval);
            });
        });

        // Адаптация под изменение размера
        window.addEventListener('resize', () => {
            chart.applyOptions({
                width: wrapper.clientWidth,
                height: wrapper.clientHeight,
            });
        });
    </script>
</body>
</html>
