<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Gift Charts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    body {
      background-color: #1a1a1a;
      font-family: 'Inter', Arial, sans-serif;
      color: #fff;
    }

    /* Верхняя панель с белой линией */
    .top-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 16px 16px 16px 16px;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
    }

    .nav-item {
      font-size: 16px;
      font-weight: 500;
      color: #ffffff;
      white-space: nowrap;
    }

    .green-arrow {
      color: #4caf50;
    }

    /* Блок поиска с кругами */
    .search-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 16px 0 16px;
    }

    .search-input {
      flex: 1;
      background-color: #2a2a2a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      padding: 12px 20px;
      font-size: 16px;
      color: #ffffff;
      outline: none;
      transition: border 0.2s;
      min-width: 0;
    }

    .search-input::placeholder {
      color: #aaaaaa;
      font-weight: 400;
      opacity: 1;
    }

    .search-input:focus {
      border-color: rgba(255, 255, 255, 0.3);
    }

    .circle-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #2a2a2a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #fff;
      cursor: pointer;
      transition: background-color 0.2s;
      flex-shrink: 0;
    }

    .circle-btn:hover {
      background-color: #3a3a3a;
    }

    .double-arrow {
      font-size: 20px;
      line-height: 1;
      transform: scale(1.2);
    }

    /* Прямоугольники (категории) */
    .categories {
      margin-top: 16px;
    }

    .category-item {
      background-color: #2a2a2a;
      border-bottom: 1px solid #3a3a3a;
      padding: 18px 16px;  /* увеличен вертикальный отступ (было 14px) */
      font-size: 20px;
      line-height: 1;
    }

    .category-item:last-child {
      border-bottom: none;
    }
  </style>
</head>
<body>
  <!-- Верхняя панель -->
  <div class="top-nav">
    <span class="nav-item">🎁 Все подарки</span>
    <span class="nav-item">⭐ Избранное</span>
    <span class="nav-item"><span class="green-arrow">↑</span> Рост</span>
  </div>

  <!-- Поиск с двумя кругами справа -->
  <div class="search-row">
    <input type="text" class="search-input" placeholder="Поиск подарков">
    <div class="circle-btn" title="Сортировка">
      <span class="double-arrow">↑↓</span>
    </div>
    <div class="circle-btn" title="Фильтр">
      <span>⌛</span>
    </div>
  </div>

  <!-- Шесть прямоугольников с эмодзи (шире по вертикали) -->
  <div class="categories">
    <div class="category-item">🎁</div>
    <div class="category-item">🎂</div>
    <div class="category-item">💐</div>
    <div class="category-item">🧸</div>
    <div class="category-item">🍫</div>
    <div class="category-item">🎈</div>  <!-- шестой элемент -->
  </div>

  <!-- Место для будущего контента -->
</body>
</html>
