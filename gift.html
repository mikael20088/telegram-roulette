<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Gift Charts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #1a1a1a;
      font-family: 'Inter', Arial, sans-serif;
      color: #fff;
    }

    /* Верхняя панель */
    .top-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 16px 16px 16px 16px;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
    }

    .nav-item {
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      white-space: nowrap;
    }

    .green-arrow {
      color: #4caf50;
    }

    /* Блок поиска */
    .search-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 16px 0 16px;
    }

    .search-input {
      flex: 1;
      background-color: #2a2a2a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      padding: 12px 20px;
      font-size: 16px;
      color: #fff;
      outline: none;
      transition: border 0.2s;
      min-width: 0;
    }

    .search-input::placeholder {
      color: #aaa;
    }

    .search-input:focus {
      border-color: rgba(255, 255, 255, 0.3);
    }

    .circle-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #2a2a2a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .circle-btn:hover {
      background-color: #3a3a3a;
    }

    .double-arrow {
      font-size: 20px;
      transform: scale(1.2);
    }

    /* Категории (подарки) */
    .categories {
      margin-top: 16px;
    }

    .category-item {
      background-color: #2a2a2a;
      border-bottom: 1px solid #3a3a3a;
      padding: 16px 16px;
      display: flex;
      gap: 16px;
    }

    .category-item:last-child {
      border-bottom: none;
    }

    .category-emoji {
      width: 30px;              /* фиксированная ширина для эмодзи */
      font-size: 20px;
      text-align: center;
      flex-shrink: 0;
    }

    .category-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .category-name {
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      line-height: 1.2;
    }

    .category-stats {
      font-size: 14px;
      color: #aaa;              /* серый цвет для чисел */
      font-weight: 400;
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <!-- Верхняя панель -->
  <div class="top-nav">
    <span class="nav-item">🎁 Все подарки</span>
    <span class="nav-item">⭐ Избранное</span>
    <span class="nav-item"><span class="green-arrow">↑</span> Рост</span>
  </div>

  <!-- Поиск и кнопки -->
  <div class="search-row">
    <input type="text" class="search-input" placeholder="Поиск подарков">
    <div class="circle-btn" title="Сортировка">
      <span class="double-arrow">↑↓</span>
    </div>
    <div class="circle-btn" title="Фильтр">
      <span>⌛</span>
    </div>
  </div>

  <!-- Список подарков с эмодзи, названиями и статистикой -->
  <div class="categories">
    <div class="category-item">
      <div class="category-emoji">🎁</div>
      <div class="category-info">
        <div class="category-name">Plush Pepe</div>
        <div class="category-stats">2.8тыс. / 2.9тыс.</div>
      </div>
    </div>
    <div class="category-item">
      <div class="category-emoji">🎂</div>
      <div class="category-info">
        <div class="category-name">Heart Locket</div>
        <div class="category-stats">1.9тыс. / 2.0тыс.</div>
      </div>
    </div>
    <div class="category-item">
      <div class="category-emoji">💐</div>
      <div class="category-info">
        <div class="category-name">Durov's Cap</div>
        <div class="category-stats">4.7тыс. / 4.8тыс.</div>
      </div>
    </div>
    <div class="category-item">
      <div class="category-emoji">🧸</div>
      <div class="category-info">
        <div class="category-name">Precious Peach</div>
        <div class="category-stats">3.0тыс. / 3.2тыс.</div>
      </div>
    </div>
    <div class="category-item">
      <div class="category-emoji">🍫</div>
      <div class="category-info">
        <div class="category-name">Heroic Helmet</div>
        <div class="category-stats">3.4тыс. / 3.8тыс.</div>
      </div>
    </div>
    <div class="category-item">
      <div class="category-emoji">🎈</div>
      <div class="category-info">
        <div class="category-name">Astral Shard</div>
        <div class="category-stats">5.7тыс. / 6.2тыс.</div>
      </div>
    </div>
  </div>
</body>
</html>
