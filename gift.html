<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Gift Charts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    @keyframes matrixGlow {
      0% { opacity: 0.8; }
      100% { opacity: 1; }
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      background-color: #f5f5f5;
      font-family: 'Inter', Arial, sans-serif;
      color: #333;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-sizing: border-box;
    }

    .top-title {
      font-size: 18px;
      font-weight: normal;
      text-align: center;
      margin-bottom: 20px;
      color: #333;
      flex-shrink: 0;
    }

    .squares-row {
      flex-grow: 1;
      display: flex;
      flex-wrap: nowrap;
      gap: 1.5px;
      align-items: stretch;
      min-height: 0;
      margin-left: 1px;
    }

    .square-container {
      position: relative;
      width: 82px;
      background-color: #0c0c1f;
      border-radius: 16px;
      flex-shrink: 0;
    }

    /* Плашка процентов сверху */
    .percent-badge {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(10, 20, 10, 0.3);
      backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      -webkit-backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #00ff00;
      font-size: 16px;
      font-weight: 600;
      padding: 8px 0 18px 0;
      text-align: center;
      border-radius: 16px 16px 0 0;
      line-height: 1;
      box-sizing: border-box;
      z-index: 1;
    }

    .percent-badge::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(45deg, rgba(0, 255, 136, 0.15) 0%, rgba(0, 200, 100, 0.08) 25%, rgba(0, 255, 200, 0.12) 50%, rgba(0, 150, 80, 0.05) 75%, rgba(0, 255, 136, 0.15) 100%),
        radial-gradient(circle at 25% 25%, rgba(120, 255, 120, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(0, 255, 136, 0.2) 0%, transparent 50%);
      border-radius: 16px 16px 0 0;
      z-index: -1;
      animation: matrixGlow 4s ease-in-out infinite alternate;
    }

    /* Центральный блок $200 на всю ширину */
    .price-badge {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(10, 20, 10, 0.3);
      backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      -webkit-backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #00ff00;
      font-size: 16px;
      font-weight: 700;
      padding: 8px 0;
      text-align: center;
      border-radius: 12px;
      line-height: 1;
      box-sizing: border-box;
      white-space: nowrap;
      z-index: 1;
    }

    .price-badge::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(45deg, rgba(0, 255, 136, 0.15) 0%, rgba(0, 200, 100, 0.08) 25%, rgba(0, 255, 200, 0.12) 50%, rgba(0, 150, 80, 0.05) 75%, rgba(0, 255, 136, 0.15) 100%),
        radial-gradient(circle at 25% 25%, rgba(120, 255, 120, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(0, 255, 136, 0.2) 0%, transparent 50%);
      border-radius: 12px;
      z-index: -1;
      animation: matrixGlow 4s ease-in-out infinite alternate;
    }

    /* Плашка капитализации ($28,77M) — выше $200 */
    .cap-badge {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(50% - 50px);
      background: rgba(10, 20, 10, 0.3);
      backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      -webkit-backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #00ff00;
      font-size: 18px;
      font-weight: 700;
      padding: 8px 0;
      text-align: center;
      border-radius: 12px;
      line-height: 1;
      box-sizing: border-box;
      white-space: nowrap;
      z-index: 1;
    }

    .cap-badge::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(45deg, rgba(0, 255, 136, 0.15) 0%, rgba(0, 200, 100, 0.08) 25%, rgba(0, 255, 200, 0.12) 50%, rgba(0, 150, 80, 0.05) 75%, rgba(0, 255, 136, 0.15) 100%),
        radial-gradient(circle at 25% 25%, rgba(120, 255, 120, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(0, 255, 136, 0.2) 0%, transparent 50%);
      border-radius: 12px;
      z-index: -1;
      animation: matrixGlow 4s ease-in-out infinite alternate;
    }

    /* Плашка для pcs (432826 pcs) — уменьшена в 2 раза, белый текст */
    .pcs-badge {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(50% + 26px);           /* новая позиция после уменьшения */
      background: rgba(10, 20, 10, 0.3);
      backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      -webkit-backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      font-size: 9px;                   /* уменьшено в 2 раза (было 18px) */
      font-weight: 700;
      padding: 4px 0;                    /* уменьшено с 8px 0 */
      text-align: center;
      border-radius: 12px;
      line-height: 1;
      box-sizing: border-box;
      white-space: nowrap;
      z-index: 1;
    }

    .pcs-badge::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(45deg, rgba(0, 255, 136, 0.15) 0%, rgba(0, 200, 100, 0.08) 25%, rgba(0, 255, 200, 0.12) 50%, rgba(0, 150, 80, 0.05) 75%, rgba(0, 255, 136, 0.15) 100%),
        radial-gradient(circle at 25% 25%, rgba(120, 255, 120, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(0, 255, 136, 0.2) 0%, transparent 50%);
      border-radius: 12px;
      z-index: -1;
      animation: matrixGlow 4s ease-in-out infinite alternate;
    }

    .bottom-link {
      flex-shrink: 0;
      margin-top: 15px;
      text-align: center;
      font-size: 16px;
      color: #333;
      cursor: pointer;
      transition: color 0.2s;
    }

    .bottom-link:hover {
      color: #000;
    }
  </style>
</head>
<body>

  <!-- Верхняя надпись -->
  <div class="top-title">Все подарки</div>

  <!-- Ряд из четырёх квадратов -->
  <div class="squares-row">
    <div class="square-container">
      <div class="percent-badge">+12%</div>
      <div class="price-badge">$200</div>
      <div class="cap-badge">$28,77M</div>
      <div class="pcs-badge">432826 pcs</div>
    </div>
    <div class="square-container">
      <div class="percent-badge">+12%</div>
      <div class="price-badge">$200</div>
      <div class="cap-badge">$28,77M</div>
      <div class="pcs-badge">432826 pcs</div>
    </div>
    <div class="square-container">
      <div class="percent-badge">+12%</div>
      <div class="price-badge">$200</div>
      <div class="cap-badge">$28,77M</div>
      <div class="pcs-badge">432826 pcs</div>
    </div>
    <div class="square-container">
      <div class="percent-badge">+12%</div>
      <div class="price-badge">$200</div>
      <div class="cap-badge">$28,77M</div>
      <div class="pcs-badge">432826 pcs</div>
    </div>
  </div>

  <!-- Нижняя надпись "Главная" -->
  <div class="bottom-link" id="homeLink">Главная</div>

  <script>
    document.getElementById('homeLink').addEventListener('click', () => {
      if (window.parent) {
        window.parent.postMessage({ type: 'CLOSE_GIFT_OVERLAY' }, '*');
      }
    });
  </script>

</body>
</html>
