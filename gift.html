<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Gift Charts</title>
  <!-- Подключаем шрифт Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    @keyframes matrixGlow {
      0% { opacity: 0.8; }
      100% { opacity: 1; }
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
      font-family: 'Inter', Arial, sans-serif;
      color: #333;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-sizing: border-box;
    }

    .top-title {
      font-size: 18px;
      font-weight: normal;
      text-align: center;
      margin-bottom: 20px;
      color: #333;
    }

    /* Квадрат — контейнер для процентов и цены */
    .square-container {
      position: relative;
      width: 192px;
      height: 192px;
      background-color: #0c0c1f;
      border-radius: 16px;
      margin-bottom: 20px;
    }

    /* Прямоугольник с процентами */
    .percent-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(10, 20, 10, 0.3);
      backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      -webkit-backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #00ff00;
      font-size: 16px;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 12px;
      line-height: 1;
      box-sizing: border-box;
      white-space: nowrap;
      z-index: 1;
    }

    /* Псевдоэлемент с градиентным свечением для процентов */
    .percent-badge::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(45deg, rgba(0, 255, 136, 0.15) 0%, rgba(0, 200, 100, 0.08) 25%, rgba(0, 255, 200, 0.12) 50%, rgba(0, 150, 80, 0.05) 75%, rgba(0, 255, 136, 0.15) 100%),
        radial-gradient(circle at 25% 25%, rgba(120, 255, 120, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(0, 255, 136, 0.2) 0%, transparent 50%);
      border-radius: 12px;
      z-index: -1;
      animation: matrixGlow 4s ease-in-out infinite alternate;
    }

    /* Стиль для цены $200 (как у процентов, но чуть крупнее) */
    .price-badge {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 60%;                     /* ниже середины */
      background: rgba(10, 20, 10, 0.3);
      backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      -webkit-backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #00ff00;                /* зелёный текст */
      font-size: 20px;
      font-weight: 700;
      padding: 6px 12px;            /* уменьшенные отступы */
      border-radius: 14px;           /* скругление */
      line-height: 1;
      box-sizing: border-box;
      white-space: nowrap;
      z-index: 1;
    }

    /* Псевдоэлемент с таким же свечением для цены */
    .price-badge::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(45deg, rgba(0, 255, 136, 0.15) 0%, rgba(0, 200, 100, 0.08) 25%, rgba(0, 255, 200, 0.12) 50%, rgba(0, 150, 80, 0.05) 75%, rgba(0, 255, 136, 0.15) 100%),
        radial-gradient(circle at 25% 25%, rgba(120, 255, 120, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(0, 255, 136, 0.2) 0%, transparent 50%);
      border-radius: 14px;           /* совпадает с border-radius родителя */
      z-index: -1;
      animation: matrixGlow 4s ease-in-out infinite alternate;
    }

    .spacer {
      flex: 1;
    }

    .bottom-link {
      margin-top: 15px;
      text-align: center;
      font-size: 16px;
      color: #333;
      cursor: pointer;
      transition: color 0.2s;
    }

    .bottom-link:hover {
      color: #000;
    }
  </style>
</head>
<body>

  <!-- Верхняя надпись -->
  <div class="top-title">Все подарки</div>

  <!-- Квадрат с процентами и ценой -->
  <div class="square-container">
    <div class="percent-badge">+12%</div>
    <div class="price-badge">$200</div>
  </div>

  <!-- Пустой разделитель -->
  <div class="spacer"></div>

  <!-- Нижняя надпись "Главная" -->
  <div class="bottom-link" id="homeLink">Главная</div>

  <script>
    // Закрытие оверлея при клике на "Главная"
    document.getElementById('homeLink').addEventListener('click', () => {
      if (window.parent) {
        window.parent.postMessage({ type: 'CLOSE_GIFT_OVERLAY' }, '*');
      }
    });
  </script>

</body>
</html>
