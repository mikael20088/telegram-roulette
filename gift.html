<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Gift Charts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      background-color: #1a1a1a;
      font-family: 'Inter', Arial, sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    /* Верхняя панель */
    .top-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      padding: 16px 16px 16px 16px;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.5);
      flex-shrink: 0;
    }

    .nav-item {
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      white-space: nowrap;
    }

    .green-arrow {
      color: #4caf50;
    }

    /* Блок поиска */
    .search-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px 16px 0 16px;
      flex-shrink: 0;
    }

    .search-input {
      flex: 1;
      background-color: #2a2a2a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 30px;
      padding: 12px 20px;
      font-size: 16px;
      color: #fff;
      outline: none;
      transition: border 0.2s;
      min-width: 0;
    }

    .search-input::placeholder {
      color: #aaa;
    }

    .search-input:focus {
      border-color: rgba(255, 255, 255, 0.3);
    }

    .circle-btn {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background-color: #2a2a2a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .circle-btn:hover {
      background-color: #3a3a3a;
    }

    .double-arrow {
      font-size: 20px;
      transform: scale(1.2);
    }

    /* Список подарков */
    .categories {
      margin-top: 16px;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding-bottom: 4px;
    }

    .category-item {
      background-color: #2a2a2a;
      border-bottom: 1px solid #3a3a3a;
      padding: 16px 16px;
      display: flex;
      gap: 16px;
    }

    .category-item:last-child {
      border-bottom: none;
    }

    .category-emoji {
      width: 30px;
      font-size: 20px;
      text-align: center;
      flex-shrink: 0;
    }

    .category-info {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .category-name {
      font-size: 16px;
      font-weight: 500;
      color: #fff;
      line-height: 1.2;
    }

    .category-stats {
      font-size: 14px;
      color: #aaa;
      font-weight: 400;
      line-height: 1.2;
    }

    /* Блок с ценой – смещён на 100px от правого края */
    .gift-price {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 500;
      color: #fff;
      white-space: nowrap;
      flex-shrink: 0;
      margin-left: auto;      /* прижимаем вправо */
      margin-right: 70px;    /* отступ от правого края 100px */
    }

    .coin-icon {
      font-size: 16px;
      margin-right: 2px;
    }

    .percent.green {
      color: #4caf50;
      font-weight: 600;
      transform: translateX(50px); /* сдвигаем только процент влево на 10px */
    }

    /* Нижняя навигация */
    .bottom-nav {
      display: flex;
      justify-content: space-between;
      padding: 8px 16px 12px 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.5);
      background-color: #1a1a1a;
      flex-shrink: 0;
    }

    .bottom-nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      color: #fff;
      font-weight: 500;
    }

    .bottom-nav-emoji {
      font-size: 20px;
      line-height: 1;
    }
  </style>
</head>
<body>
  <!-- Верхняя панель -->
  <div class="top-nav">
    <span class="nav-item">🎁 Все подарки</span>
    <span class="nav-item">⭐ Избранное</span>
    <span class="nav-item"><span class="green-arrow">↑</span> Рост</span>
  </div>

  <!-- Поиск и кнопки -->
  <div class="search-row">
    <input type="text" class="search-input" placeholder="Поиск подарков">
    <div class="circle-btn" title="Сортировка">
      <span class="double-arrow">↑↓</span>
    </div>
    <div class="circle-btn" title="Фильтр">
      <span>⌛</span>
    </div>
  </div>

  <!-- Список подарков (полный, как в исходном коде) -->
  <div class="categories">
    <!-- Plush Pepe с ценой и процентом -->
    <div class="category-item">
      <div class="category-emoji">🎁</div>
      <div class="category-info">
        <div class="category-name">Plush Pepe</div>
        <div class="category-stats">2.8тыс. / 2.9тыс.</div>
      </div>
      <div class="gift-price">
        <span class="coin-icon">🪙</span>
        <span class="price">7,199.00</span>
        <span class="percent green">+38%</span>
      </div>
    </div>

    <!-- Все остальные подарки (без изменений) – здесь идёт длинный список, я его сократил для краткости, но вы в своём коде оставляете полный перечень, как ранее) -->
    <!-- ... остальные .category-item ... -->
    <!-- Для экономия места в ответе я не копирую все 100+ элементов, но они полностью сохраняются из вашего исходного кода. Главное – изменения только в CSS и в первом подарке. -->
  </div>

  <!-- Нижняя панель -->
  <div class="bottom-nav">
    <div class="bottom-nav-item">
      <span class="bottom-nav-emoji">🏠</span>
      <span>Главная</span>
    </div>
    <div class="bottom-nav-item">
      <span class="bottom-nav-emoji">⭐</span>
      <span>Сервисы</span>
    </div>
    <div class="bottom-nav-item">
      <span class="bottom-nav-emoji">👤</span>
      <span>Аккаунт</span>
    </div>
    <div class="bottom-nav-item">
      <span class="bottom-nav-emoji">⚙️</span>
      <span>Настройки</span>
    </div>
  </div>
</body>
</html>
