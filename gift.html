<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Gift Charts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    @keyframes matrixGlow {
      0% { opacity: 0.8; }
      100% { opacity: 1; }
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      background-color: #f5f5f5;
      font-family: 'Inter', Arial, sans-serif;
      color: #333;
      display: flex;
      flex-direction: column;
      padding: 20px;
      box-sizing: border-box;
    }

    .top-title {
      font-size: 18px;
      font-weight: normal;
      text-align: center;
      margin-bottom: 20px;
      color: #333;
      flex-shrink: 0;
    }

    /* Обёртка для квадрата: занимает всё свободное место, выравнивание влево */
    .square-wrapper {
      flex-grow: 1;
      display: flex;
      justify-content: flex-start;
      min-height: 0;
    }

    /* Квадрат: ширина 150px, отступ слева 2.5px (приближён к краю) */
    .square-container {
      position: relative;
      width: 150px;
      height: 100%;
      margin-left: 2.5px;               /* было 5px */
      background-color: #0c0c1f;
      border-radius: 16px;
    }

    /* Прямоугольник с процентами */
    .percent-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(10, 20, 10, 0.3);
      backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      -webkit-backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #00ff00;
      font-size: 14px;
      font-weight: 600;
      padding: 3px 6px;
      border-radius: 10px;
      line-height: 1;
      white-space: nowrap;
      z-index: 1;
    }

    .percent-badge::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(45deg, rgba(0, 255, 136, 0.15) 0%, rgba(0, 200, 100, 0.08) 25%, rgba(0, 255, 200, 0.12) 50%, rgba(0, 150, 80, 0.05) 75%, rgba(0, 255, 136, 0.15) 100%),
        radial-gradient(circle at 25% 25%, rgba(120, 255, 120, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(0, 255, 136, 0.2) 0%, transparent 50%);
      border-radius: 10px;
      z-index: -1;
      animation: matrixGlow 4s ease-in-out infinite alternate;
    }

    /* Стиль для цены $200 */
    .price-badge {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 126px;
      background: rgba(10, 20, 10, 0.3);
      backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      -webkit-backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #00ff00;
      font-size: 14px;
      font-weight: 700;
      padding: 3px 6px;
      border-radius: 10px;
      line-height: 1;
      white-space: nowrap;
      z-index: 1;
    }

    .price-badge::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(45deg, rgba(0, 255, 136, 0.15) 0%, rgba(0, 200, 100, 0.08) 25%, rgba(0, 255, 200, 0.12) 50%, rgba(0, 150, 80, 0.05) 75%, rgba(0, 255, 136, 0.15) 100%),
        radial-gradient(circle at 25% 25%, rgba(120, 255, 120, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(0, 255, 136, 0.2) 0%, transparent 50%);
      border-radius: 10px;
      z-index: -1;
      animation: matrixGlow 4s ease-in-out infinite alternate;
    }

    /* Общий стиль для маленьких баджей */
    .small-badge {
      position: absolute;
      background: rgba(10, 20, 10, 0.3);
      backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      -webkit-backdrop-filter: blur(16px) brightness(1.3) contrast(1.2);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #00ff00;
      font-size: 10px;
      font-weight: 600;
      padding: 3px 3px;
      border-radius: 8px;
      line-height: 1;
      white-space: nowrap;
      z-index: 1;
    }

    .small-badge::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(45deg, rgba(0, 255, 136, 0.15) 0%, rgba(0, 200, 100, 0.08) 25%, rgba(0, 255, 200, 0.12) 50%, rgba(0, 150, 80, 0.05) 75%, rgba(0, 255, 136, 0.15) 100%),
        radial-gradient(circle at 25% 25%, rgba(120, 255, 120, 0.25) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(0, 255, 136, 0.2) 0%, transparent 50%);
      border-radius: 8px;
      z-index: -1;
      animation: matrixGlow 4s ease-in-out infinite alternate;
    }

    /* Левый бадж */
    .left-badge {
      left: 50%;
      transform: translateX(calc(-100% - 5px));
      top: 159px;
    }

    /* Правый бадж */
    .right-badge {
      left: 50%;
      transform: translateX(5px);
      top: 159px;
    }

    .bottom-link {
      flex-shrink: 0;
      margin-top: 15px;
      text-align: center;
      font-size: 16px;
      color: #333;
      cursor: pointer;
      transition: color 0.2s;
    }

    .bottom-link:hover {
      color: #000;
    }
  </style>
</head>
<body>

  <!-- Верхняя надпись -->
  <div class="top-title">Все подарки</div>

  <!-- Обёртка для квадрата -->
  <div class="square-wrapper">
    <div class="square-container">
      <div class="percent-badge">+12%</div>
      <div class="price-badge">$200</div>
      <div class="small-badge left-badge">444567 pcs</div>
      <div class="small-badge right-badge">$28,77M</div>
    </div>
  </div>

  <!-- Нижняя надпись "Главная" -->
  <div class="bottom-link" id="homeLink">Главная</div>

  <script>
    document.getElementById('homeLink').addEventListener('click', () => {
      if (window.parent) {
        window.parent.postMessage({ type: 'CLOSE_GIFT_OVERLAY' }, '*');
      }
    });
  </script>

</body>
</html>
